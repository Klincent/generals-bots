name: picker9-opponent-suite-pr

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  suite:
    if: github.head_ref == 'tmp/picker9-suite-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [doomstack, earlyrush, pressure, flood]
        variant: [candidate, picker9]
    env:
      PICKER9_SHA: 734355a44adf76f274892bf13804d638c52869b0
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/picker9-opponent-suite-75
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install engine
        run: pip install -e .
      - name: Build candidate and exact picker9
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
          git worktree add --detach /tmp/picker9 "$PICKER9_SHA"
          bash /tmp/picker9/competition/agents/juraj_v35_cpp/build.sh
          cat >/tmp/candidate.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1
          export V35_DOOMGUARD_ENABLED=1
          exec "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@"
          EOF
          cat >/tmp/picker9.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1
          exec "/tmp/picker9/competition/agents/juraj_v35_cpp/run.sh" "$@"
          EOF
          chmod +x /tmp/candidate.sh /tmp/picker9.sh
          python -m py_compile competition/agents/doomstack_rusher/agent.py competition/agents/doomstack_rusher/main.py
      - name: Run adversarial screen
        run: |
          set -euo pipefail
          OUT="/tmp/suite-${{ matrix.mode }}-${{ matrix.variant }}"
          AGENT=/tmp/candidate.sh
          if [ '${{ matrix.variant }}' = picker9 ]; then AGENT=/tmp/picker9.sh; fi
          STRESS_MODE='${{ matrix.mode }}' python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate "$AGENT" \
            --baseline competition/agents/doomstack_rusher/run.sh \
            --start 37100 --seeds 10 --output "$OUT"
          cat "$OUT/summary.json"
          python - "$OUT/summary.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          assert s['errors']==0 and s['illegal_actions']==0, s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: suite-${{ matrix.mode }}-${{ matrix.variant }}
          path: /tmp/suite-${{ matrix.mode }}-${{ matrix.variant }}
          retention-days: 7

  aggregate:
    if: github.head_ref == 'tmp/picker9-suite-trigger'
    needs: suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/picker9-opponent-suite-75
      - uses: actions/download-artifact@v4
        with:
          pattern: suite-*
          path: /tmp/results
      - name: Aggregate 80-game candidate suite and gate 75 percent wins
        id: gate
        run: |
          python - <<'PY' | tee /tmp/opponent-suite-summary.txt
          import json,os
          modes=['doomstack','earlyrush','pressure','flood']
          total_w=total_d=total_l=total_err=total_illegal=0
          rows=[]
          for mode in modes:
              vals={}
              for variant in ('candidate','picker9'):
                  p=f'/tmp/results/suite-{mode}-{variant}/summary.json'
                  s=json.load(open(p)); vals[variant]=s
              c=vals['candidate']; b=vals['picker9']
              wr=c['W']/c['games']; bwr=b['W']/b['games']
              rows.append((mode,c['W'],c['D'],c['L'],wr,bwr,wr-bwr))
              total_w+=c['W']; total_d+=c['D']; total_l+=c['L']
              total_err+=c['errors']; total_illegal+=c['illegal_actions']
          games=total_w+total_d+total_l
          overall=total_w/games
          min_mode=min(r[4] for r in rows)
          print('mode candidate_W/D/L candidate_win_rate picker9_win_rate delta')
          for r in rows: print(r[0],f'{r[1]}/{r[2]}/{r[3]}',f'{r[4]:.4f}',f'{r[5]:.4f}',f'{r[6]:+.4f}')
          print('candidate_total',f'{total_w}/{total_d}/{total_l}','games',games,'WIN_RATE',f'{overall:.4f}','MIN_MODE',f'{min_mode:.4f}')
          passed=(overall>=.75 and min_mode>=.60 and total_err==0 and total_illegal==0)
          print('PICKER9_75_GATE','PASS' if passed else 'FAIL')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"pass={1 if passed else 0}\n")
              f.write(f"win_rate={overall:.6f}\n")
          PY
      - name: Package submission only after 75 percent gate
        if: steps.gate.outputs.pass == '1'
        run: |
          set -euo pipefail
          mkdir -p /tmp/package/juraj_v35
          cp competition/agents/juraj_v35_cpp/{main.cpp,core.hpp,build.sh,run.sh} /tmp/package/juraj_v35/
          cp /tmp/opponent-suite-summary.txt /tmp/package/
          (cd /tmp/package && zip -qr picker9_75_submission.zip juraj_v35 opponent-suite-summary.txt)
          sha256sum /tmp/package/picker9_75_submission.zip > /tmp/package/picker9_75_submission.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: picker9-opponent-suite-summary
          path: /tmp/opponent-suite-summary.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.pass == '1'
        with:
          name: picker9-75-submission
          path: /tmp/package
          retention-days: 14
