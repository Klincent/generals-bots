name: evolution4-g09-export

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'evolution4/submission-g09-export-kick.txt'

permissions:
  contents: write

concurrency:
  group: evolution4-g09-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: submission/evolution4-g09-b6b150-experimental-20260823
          fetch-depth: 0
      - name: Split submission as base64 chunks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          p=Path('evolution4/submissions/juraj_evolution4_g09_b6b150_experimental.zip')
          data=p.read_bytes(); enc=base64.b64encode(data).decode('ascii')
          d=Path('evolution4/submissions/export_chunks'); d.mkdir(parents=True,exist_ok=True)
          for old in d.glob('chunk_*.txt'): old.unlink()
          n=3000; chunks=[enc[i:i+n] for i in range(0,len(enc),n)]
          for i,c in enumerate(chunks): (d/f'chunk_{i:03d}.txt').write_text(c)
          m={'chunks':len(chunks),'chunk_chars':n,'binary_size':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (d/'manifest.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          print(m)
          PY
          git config user.name ChatGPT
          git config user.email actions@users.noreply.github.com
          git add evolution4/submissions/export_chunks
          git commit -m 'submission: add transport chunks for G9 snapshot'
          git push origin HEAD:submission/evolution4-g09-b6b150-experimental-20260823
