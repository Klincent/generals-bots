name: picker-v8-holdout2-pr
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  holdout2:
    if: ${{ github.head_ref == 'picker-v8-holdout-run' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      E501: e50123cee7d924f0d643acd372a5300971f93917
      CANDIDATE: d3c8bd3c340c1f113e82ec4c16e7c8d91a9e4d9b
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - name: Prepare frozen candidate and exact champion
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/candidate "$CANDIDATE"
          git worktree add --detach /tmp/e501 "$E501"
          (cd /tmp/candidate/competition/agents/juraj_v35_cpp && bash test.sh && bash build.sh)
          bash /tmp/e501/competition/agents/juraj_v35_cpp/build.sh
          test "$(git -C /tmp/candidate rev-parse HEAD)" = "$CANDIDATE"
          test "$(git -C /tmp/e501 rev-parse HEAD)" = "$E501"
      - name: Run untouched 34000..34059 holdout
        run: |
          set -euo pipefail
          mkdir -p /tmp/holdout/chunk1 /tmp/holdout/chunk2
          python /tmp/candidate/competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/candidate/competition/agents/juraj_v35_cpp/run.sh --baseline /tmp/e501/competition/agents/juraj_v35_cpp/run.sh --start 34000 --seeds 30 --output /tmp/holdout/chunk1 & p1=$!
          python /tmp/candidate/competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/candidate/competition/agents/juraj_v35_cpp/run.sh --baseline /tmp/e501/competition/agents/juraj_v35_cpp/run.sh --start 34030 --seeds 30 --output /tmp/holdout/chunk2 & p2=$!
          wait $p1; wait $p2
      - name: Aggregate and package
        run: |
          python - <<'PY'
          import json,re,statistics,random,pathlib
          root=pathlib.Path('/tmp/holdout'); games=[]
          for p in root.glob('chunk*/games.jsonl'):
              games += [json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          valid=[g for g in games if 'result' in g]
          W=sum(g['result']=='win' for g in valid);D=sum(g['result']=='draw' for g in valid);L=sum(g['result']=='loss' for g in valid)
          score=(W+.5*D)/max(1,len(valid))
          paired=[]
          for seed in range(34000,34060):
              x=[g for g in valid if g['seed']==seed]
              if len(x)==2: paired.append(sum(1 if g['result']=='win' else .5 if g['result']=='draw' else 0 for g in x)/2)
          rng=random.Random(0x354);boots=sorted(statistics.mean(rng.choice(paired) for _ in paired) for _ in range(10000));q=lambda z:boots[min(len(boots)-1,max(0,round(z*(len(boots)-1))))]
          starts=moves=delivered=completions=active_games=0
          for g in valid:
              m=re.search(r'\[v36_picker\].*?starts=(\d+).*?completions=(\d+).*?moves=(\d+).*?delivered=(\d+)',g.get('stderr',''))
              if m:
                  st,co,mv,de=map(int,m.groups());starts+=st;completions+=co;moves+=mv;delivered+=de;active_games+=st>0
          n=max(1,len(valid))
          s={'candidate':'d3c8bd3c340c1f113e82ec4c16e7c8d91a9e4d9b','baseline':'e50123cee7d924f0d643acd372a5300971f93917','games':len(games),'valid':len(valid),'W':W,'D':D,'L':L,'score':score,'ci95':[q(.025),q(.975)],'errors':sum('error' in g for g in games),'illegal':sum(g.get('candidate_illegal',0) for g in games),'picker_starts_per_game':starts/n,'picker_active_games':active_games,'picker_moves_per_game':moves/n,'picker_delivered_per_game':delivered/n,'delivered_per_move':delivered/max(1,moves),'completions':completions}
          root.joinpath('aggregate.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n');print(json.dumps(s,indent=2,sort_keys=True))
          PY
          mkdir -p /tmp/package/juraj_v35
          cp /tmp/candidate/competition/agents/juraj_v35_cpp/{main.cpp,core.hpp,build.sh,run.sh} /tmp/package/juraj_v35/
          cp /tmp/holdout/aggregate.json /tmp/package/
          (cd /tmp/package && zip -qr juraj_picker_d3c8bd3_submission.zip juraj_v35)
          sha256sum /tmp/package/juraj_picker_d3c8bd3_submission.zip > /tmp/package/juraj_picker_d3c8bd3_submission.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: picker-v8-holdout2
          path: /tmp/package
          retention-days: 7
