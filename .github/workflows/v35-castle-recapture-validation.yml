name: V3.5 castle recapture causal validation

on:
  workflow_dispatch:
  push:
    branches:
      - v35-castle-recapture
    paths:
      - .github/workflows/v35-castle-recapture-validation.yml

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: dummy
  CANDIDATE_SHA: 31429b71b8b34bc57f5ef274d8e6a52f1e260cc1
  CHAMPION_SHA: 4f0fac768a8fc4479d45347a3ecbdbfedd6aef05
  V34_SHA: 2ed9e8bbcf76b36c5276013afc356118fccc8b6e

jobs:
  direct-22350:
    name: Recapture vs Champion 22350-22399
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact agents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cand .opp result
          mkdir -p .cand .opp result
          git archive "$CANDIDATE_SHA" competition/agents/juraj_v35_cpp | tar -x -C .cand
          git archive "$CHAMPION_SHA" competition/agents/juraj_v35_cpp | tar -x -C .opp
          mapfile -t changed < <(git diff --name-only "$CHAMPION_SHA" "$CANDIDATE_SHA" -- competition/agents/juraj_v35_cpp)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = competition/agents/juraj_v35_cpp/main.cpp
          grep -Fq v35_castle_recapture .cand/competition/agents/juraj_v35_cpp/main.cpp
          .cand/competition/agents/juraj_v35_cpp/build.sh
          .opp/competition/agents/juraj_v35_cpp/build.sh
      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps
      - name: Benchmark
        run: PYTHONPATH=. python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate .cand/competition/agents/juraj_v35_cpp/run.sh --baseline .opp/competition/agents/juraj_v35_cpp/run.sh --start 22350 --seeds 50 --output result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-castle-recapture-direct-22350
          path: result/

  direct-22200:
    name: Recapture vs Champion 22200-22249
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact agents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cand .opp result
          mkdir -p .cand .opp result
          git archive "$CANDIDATE_SHA" competition/agents/juraj_v35_cpp | tar -x -C .cand
          git archive "$CHAMPION_SHA" competition/agents/juraj_v35_cpp | tar -x -C .opp
          .cand/competition/agents/juraj_v35_cpp/build.sh
          .opp/competition/agents/juraj_v35_cpp/build.sh
      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps
      - name: Benchmark
        run: PYTHONPATH=. python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate .cand/competition/agents/juraj_v35_cpp/run.sh --baseline .opp/competition/agents/juraj_v35_cpp/run.sh --start 22200 --seeds 50 --output result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-castle-recapture-direct-22200
          path: result/

  vs-v34:
    name: Recapture vs V3.4 22350-22399
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize exact agents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cand .opp result
          mkdir -p .cand .opp result
          git archive "$CANDIDATE_SHA" competition/agents/juraj_v35_cpp | tar -x -C .cand
          git archive "$V34_SHA" competition/agents/juraj_cpp | tar -x -C .opp
          .cand/competition/agents/juraj_v35_cpp/test.sh
          .cand/competition/agents/juraj_v35_cpp/build.sh
          .opp/competition/agents/juraj_cpp/build.sh
      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps
      - name: Benchmark
        run: PYTHONPATH=. python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate .cand/competition/agents/juraj_v35_cpp/run.sh --baseline .opp/competition/agents/juraj_cpp/run.sh --start 22350 --seeds 50 --output result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-castle-recapture-v34-22350
          path: result/
