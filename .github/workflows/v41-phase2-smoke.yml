name: V4.1 Phase 2 smoke
on:
  push:
    branches: [v41-phase2]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.4.6 jax==0.11.0 pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m py_compile competition/training/v4/*.py
      - run: PYTHONPATH="$PWD:$PWD/competition:$PWD/competition/training/v4" pytest -q competition/training/v4/test_fit_policy_v41.py competition/training/v4/test_github_pipeline.py competition/training/v4/test_rollout_train.py competition/training/v4/test_tactics_v41.py
      - name: Run tiny real-engine tactics mining smoke
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/competition:${{ github.workspace }}/competition/training/v4
        run: |
          python competition/training/v4/mine_tactics_v41.py \
            --tactics /tmp/tactics.bin \
            --report /tmp/tactics-report.json \
            --seed-start 41990 \
            --games 2 \
            --states-per-game 1 \
            --rollouts-per-action 1 \
            --horizon 2 \
            --candidates 4 \
            --min-support 1
          test -s /tmp/tactics.bin
          test -s /tmp/tactics-report.json
          python -c 'import sys; sys.path.insert(0,"competition/training/v4"); from tactics_v41 import deserialize_tactics; print("tactic_records", len(deserialize_tactics(open("/tmp/tactics.bin","rb").read())))'
          cat /tmp/tactics-report.json
      - run: git fetch --no-tags --depth=1 origin refs/heads/juraj-v3.4:refs/remotes/origin/juraj-v3.4
      - run: test "$(git rev-parse refs/remotes/origin/juraj-v3.4)" = "2ed9e8bbcf76b36c5276013afc356118fccc8b6e"
      - run: mkdir -p /tmp/v34-source && git archive 2ed9e8bbcf76b36c5276013afc356118fccc8b6e competition/agents/juraj_cpp | tar -x -C /tmp/v34-source
      - run: python competition/training/v4/prepare_v41_runtime.py --agent-dir /tmp/v34-source/competition/agents/juraj_cpp --output /tmp/main.v41.cpp
      - run: sha256sum /tmp/main.v41.cpp
      - run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic /tmp/main.v41.cpp -o /tmp/v41-agent-bin
