name: picker9-soft-expansion-50-pr

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  shard:
    if: ${{ github.head_ref == 'tmp/picker9-soft-expansion50-trigger' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        parent:
          - name: v75
            sha: 9cc3b78a0003dd17079cd2aa8d6439321fedccc0
          - name: final
            sha: 2260b6f19d51a14d7c68770677f22d04dfd88022
        start: [54000, 54005, 54010, 54015, 54020]
    env:
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.parent.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - name: Apply only validated soft-deficit expansion priority
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/parent ${{ matrix.parent.sha }}
          python - <<'PY'
          from pathlib import Path
          p=Path('competition/agents/juraj_v35_cpp/main.cpp');s=p.read_text()
          old='production_==ProductionState::SEVERE_DEFICIT?.62:production_==ProductionState::SOFT_DEFICIT?.45:.35'
          new='production_==ProductionState::SEVERE_DEFICIT?.62:production_==ProductionState::SOFT_DEFICIT?.52:.35'
          if old not in s: raise SystemExit('soft expansion share not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          bash competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/parent/competition/agents/juraj_v35_cpp/build.sh
          cat >/tmp/patched.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1 V35_DOOMGUARD_ENABLED=1
          exec "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed 's/^/[PATCHED] /' >&2)
          EOF
          cat >/tmp/parent.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1 V35_DOOMGUARD_ENABLED=1
          exec "/tmp/parent/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed 's/^/[PARENT] /' >&2)
          EOF
          chmod +x /tmp/patched.sh /tmp/parent.sh
      - name: Run 10 paired-seat games
        run: |
          OUT=/tmp/${{ matrix.parent.name }}-${{ matrix.start }}
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/patched.sh --baseline /tmp/parent.sh \
            --start ${{ matrix.start }} --seeds 5 --output "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: soft50-${{ matrix.parent.name }}-${{ matrix.start }}
          path: /tmp/${{ matrix.parent.name }}-${{ matrix.start }}
          retention-days: 14

  aggregate:
    if: ${{ github.head_ref == 'tmp/picker9-soft-expansion50-trigger' }}
    needs: shard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: soft50-*
          path: /tmp/results
      - name: Aggregate parent deltas and production telemetry
        run: |
          python - <<'PY' | tee /tmp/soft50-summary.txt
          import json,glob,re,statistics,os
          turns=[50,100,150,200,250,300,400,600,800]
          for parent in ('v75','final'):
            W=D=L=err=illegal=0; games=[]
            for p in glob.glob(f'/tmp/results/soft50-{parent}-*/**/summary.json',recursive=True):
              s=json.load(open(p));W+=s['W'];D+=s['D'];L+=s['L'];err+=s['errors'];illegal+=s['illegal_actions']
            for p in glob.glob(f'/tmp/results/soft50-{parent}-*/**/games.jsonl',recursive=True):
              games += [json.loads(x) for x in open(p)]
            n=W+D+L
            print(f'{parent} PATCHED_vs_PARENT W/D/L={W}/{D}/{L} games={n} raw_wr={W/max(1,n):.4f} score={(W+.5*D)/max(1,n):.4f} errors={err} illegal={illegal}')
            land={k:{t:[] for t in turns} for k in ('PATCHED','PARENT')}
            for g in games:
              for line in g.get('stderr','').splitlines():
                for who in land:
                  if line.startswith(f'[{who}] [v35_land]'):
                    vals={int(a):int(b) for a,b in re.findall(r'(\d+):(\d+)',line)}
                    for t in turns:
                      if t in vals: land[who][t].append(vals[t])
            for t in turns:
              a=statistics.mean(land['PATCHED'][t]) if land['PATCHED'][t] else 0
              b=statistics.mean(land['PARENT'][t]) if land['PARENT'][t] else 0
              print(f'  t{t}: patched={a:.2f} parent={b:.2f} delta={a-b:+.2f}')
            assert err==0 and illegal==0
          PY
          mkdir -p /tmp/summary && cp /tmp/soft50-summary.txt /tmp/summary/
      - uses: actions/upload-artifact@v4
        with:
          name: picker9-soft-expansion50-summary
          path: /tmp/summary
          retention-days: 14
