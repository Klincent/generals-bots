name: v36-loss-forensics-pr
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  forensics:
    if: ${{ github.head_ref == 'juraj-v3.6-loss-forensics' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 61bf6184dda66355170156d6d8b08be5511e4d36
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.6-loss-forensics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e .
      - name: Build candidate and exact baseline
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/build.sh
          git worktree add --detach /tmp/v36-base "$BASE_SHA"
          bash /tmp/v36-base/competition/agents/juraj_v35_cpp/build.sh
      - name: Re-run exact 40 games with labeled stderr
        run: |
          set -euo pipefail
          cat > /tmp/run-candidate.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_EDGE_PICKER_THRESHOLD=16
          export V36_EDGE_PICKER_MIN_EFFICIENCY=2.0
          "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed -u 's/^/[CAND] /' >&2)
          EOF
          cat > /tmp/run-baseline.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_EDGE_PICKER_THRESHOLD=16
          export V36_EDGE_PICKER_MIN_EFFICIENCY=2.0
          "/tmp/v36-base/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed -u 's/^/[BASE] /' >&2)
          EOF
          chmod +x /tmp/run-candidate.sh /tmp/run-baseline.sh
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/run-candidate.sh --baseline /tmp/run-baseline.sh \
            --start 24200 --seeds 20 --output /tmp/v36-loss-forensics
      - name: Analyze all losses
        run: |
          python tools/analyze_v36_losses.py /tmp/v36-loss-forensics/games.jsonl | tee /tmp/v36-loss-forensics/loss-analysis.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v36-loss-forensics
          path: /tmp/v36-loss-forensics
          retention-days: 3
