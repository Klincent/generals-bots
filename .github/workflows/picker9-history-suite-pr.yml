name: picker9-history-suite-pr

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  history:
    if: github.head_ref == 'tmp/picker9-history-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        opponent:
          - v35-champion-70fresh
          - v35-defense-fresh
          - v35-heuristic-rebuild
          - v35-logistics-recenter
          - juraj-v3.6-iter1-attack-pass
          - juraj-v3.6-search-refactor
        variant: [candidate, picker9]
    env:
      PICKER9_SHA: 734355a44adf76f274892bf13804d638c52869b0
      CANDIDATE_REF: chatgpt/picker9-opponent-suite-75
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - name: Build target and historical opponent
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/build.sh
          git worktree add --detach /tmp/picker9 "$PICKER9_SHA"
          bash /tmp/picker9/competition/agents/juraj_v35_cpp/build.sh
          OPP='${{ matrix.opponent }}'
          if git rev-parse --verify --quiet "origin/$OPP" >/dev/null; then OREF="origin/$OPP"; else OREF="$OPP"; fi
          git worktree add --detach /tmp/opponent "$OREF"
          bash /tmp/opponent/competition/agents/juraj_v35_cpp/build.sh
          cat >/tmp/candidate.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1
          export V35_DOOMGUARD_ENABLED=1
          exec "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@"
          EOF
          cat >/tmp/picker9.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1
          exec "/tmp/picker9/competition/agents/juraj_v35_cpp/run.sh" "$@"
          EOF
          chmod +x /tmp/candidate.sh /tmp/picker9.sh /tmp/opponent/competition/agents/juraj_v35_cpp/run.sh
      - name: Historical matchup
        run: |
          set -euo pipefail
          SAFE=$(echo '${{ matrix.opponent }}' | tr '/' '_')
          OUT="/tmp/history-${SAFE}-${{ matrix.variant }}"
          AGENT=/tmp/candidate.sh
          if [ '${{ matrix.variant }}' = picker9 ]; then AGENT=/tmp/picker9.sh; fi
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate "$AGENT" \
            --baseline /tmp/opponent/competition/agents/juraj_v35_cpp/run.sh \
            --start 38200 --seeds 6 --output "$OUT"
          cat "$OUT/summary.json"
          python - "$OUT/summary.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          assert s['errors']==0 and s['illegal_actions']==0, s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: history-${{ matrix.opponent }}-${{ matrix.variant }}
          path: /tmp/history-*
          retention-days: 7

  aggregate:
    if: github.head_ref == 'tmp/picker9-history-trigger'
    needs: history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: history-*
          path: /tmp/results
      - name: Aggregate historical opponent screen
        run: |
          python - <<'PY' | tee /tmp/history-suite-summary.txt
          import json,glob
          refs=['v35-champion-70fresh','v35-defense-fresh','v35-heuristic-rebuild','v35-logistics-recenter','juraj-v3.6-iter1-attack-pass','juraj-v3.6-search-refactor']
          cw=cd=cl=bw=bd=bl=0
          print('opponent candidate_W/D/L candidate_wr picker9_W/D/L picker9_wr delta')
          for ref in refs:
              c=glob.glob(f'/tmp/results/history-{ref}-candidate/**/summary.json',recursive=True)
              b=glob.glob(f'/tmp/results/history-{ref}-picker9/**/summary.json',recursive=True)
              if not c: c=glob.glob(f'/tmp/results/history-{ref}-candidate/summary.json')
              if not b: b=glob.glob(f'/tmp/results/history-{ref}-picker9/summary.json')
              cs=json.load(open(c[0])); bs=json.load(open(b[0]))
              cwr=cs['W']/cs['games']; bwr=bs['W']/bs['games']
              print(ref,f"{cs['W']}/{cs['D']}/{cs['L']}",f'{cwr:.4f}',f"{bs['W']}/{bs['D']}/{bs['L']}",f'{bwr:.4f}',f'{cwr-bwr:+.4f}')
              cw+=cs['W']; cd+=cs['D']; cl+=cs['L']; bw+=bs['W']; bd+=bs['D']; bl+=bs['L']
          cg=cw+cd+cl; bg=bw+bd+bl
          print('candidate_total',f'{cw}/{cd}/{cl}','games',cg,'RAW_WR',f'{cw/cg:.4f}')
          print('picker9_total',f'{bw}/{bd}/{bl}','games',bg,'RAW_WR',f'{bw/bg:.4f}')
          print('DELTA_RAW_WR',f'{cw/cg-bw/bg:+.4f}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: picker9-history-suite-summary
          path: /tmp/history-suite-summary.txt
          retention-days: 7
