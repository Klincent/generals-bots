name: V3.5 materialize conservative logistics candidate

on:
  workflow_dispatch:
  push:
    branches: [v35-logistics-conservative]
    paths:
      - '.github/workflows/v35-logistics-conservative-materialize.yml'

permissions:
  contents: write

env:
  CHAMPION_SHA: 4f0fac768a8fc4479d45347a3ecbdbfedd6aef05

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v35-logistics-conservative

      - name: Prove exact champion gameplay base
        shell: bash
        run: |
          set -euo pipefail
          for f in main.cpp core.hpp build.sh run.sh test.sh test_core.cpp test_agent.cpp paired_benchmark.py; do
            cmp "competition/agents/juraj_v35_cpp/$f" <(git show "$CHAMPION_SHA:competition/agents/juraj_v35_cpp/$f")
          done
          ! grep -q 'staging_point' competition/agents/juraj_v35_cpp/main.cpp
          ! grep -q 'rear_pressure' competition/agents/juraj_v35_cpp/main.cpp
          ! grep -q 'castle_opportunity_' competition/agents/juraj_v35_cpp/main.cpp
          ! grep -q 'castle_target_' competition/agents/juraj_v35_cpp/main.cpp

      - name: Apply conservative edge-drain hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('competition/agents/juraj_v35_cpp/main.cpp')
          s = p.read_text()
          start = s.find('  const Front*front=fronts_.primary();int sink=')
          end = s.find('  int window_pass=', start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('champion logistics block anchors not found')
          old = s[start:end]
          if old.count('Reason::REAR_EVACUATION') != 1 or old.count('Reason::WAR_MOBILIZATION') != 1:
              raise SystemExit('unexpected champion logistics block identity')
          if 'staging_point' in old or 'rear_pressure' in old or 'behind_rally' in old:
              raise SystemExit('contaminated logistics base')
          new = '''  const Front*front=fronts_.primary();int sink=belief_.confirmed()?belief_.confirmed_cell():(front?front->anchor:belief_.top());for(int x=0;x<n_;++x)if(source(o,x)){int surplus=o.army[x]-reserve(o,x);if(surplus<=0)continue;int r=x/w_,cc=x%w_,er=std::min(r,h_-1-r),ec=std::min(cc,w_-1-cc),edge=std::min(er,ec),deg=g_.degree(x);bool corner=er==0&&ec==0,base_rear=edge<=1||deg<=1;int target=sink==x?general_:sink,y=target>=0?tactical_next(o,x,target):-1;if(y<0)continue;bool contact_known=meaningful_contact_turn_>=0&&sink>=0&&general_>=0&&g_.dist[general_][sink]<INF;int detour_x=0,detour_y=0;bool axis_gain=false,off_axis_rear=false;if(contact_known&&g_.dist[general_][x]<INF&&g_.dist[x][sink]<INF&&g_.dist[general_][y]<INF&&g_.dist[y][sink]<INF){int base=g_.dist[general_][sink];detour_x=std::max(0,g_.dist[general_][x]+g_.dist[x][sink]-base);detour_y=std::max(0,g_.dist[general_][y]+g_.dist[y][sink]-base);axis_gain=detour_y<detour_x;off_axis_rear=edge<=2&&detour_x>=4&&axis_gain;}bool rear=base_rear||off_axis_rear;double flow=double(surplus)/std::max(1,g_.dist[x][target]);double pull=(corner?20.:0.)+(edge==0?10.:0.)+(deg<=1?10.:0.)+(off_axis_rear?std::min(24.,detour_x*3.):0.);if(confirmed_war&&b.war>0)c.push_back({2,x,y,0,flow+(rear&&contact_known?std::min(8.,pull*.2):0.),Reason::WAR_MOBILIZATION,false,ActionClass::LOGISTICS,target,front?front->id:-1,PacketRole::FRONT});else if(rear&&b.free+b.search>0)c.push_back({2,x,y,0,double(surplus)+pull,Reason::REAR_EVACUATION,false,ActionClass::LOGISTICS,target,-1,PacketRole::FREE_SURPLUS_RELOCATION});else if(!enemy_seen&&b.search>0)c.push_back({3,x,y,0,flow,Reason::SEARCH_PROGRESS,false,ActionClass::SEARCH,target,-1,PacketRole::SEARCH});}\n'''
          s = s[:start] + new + s[end:]
          for token in ('off_axis_rear=edge<=2', 'axis_gain=detour_y<detour_x', 'double pull=(corner?20.'):
              if s.count(token) != 1:
                  raise SystemExit(f'missing conservative token: {token}')
          for forbidden in ('staging_point', 'rear_pressure', 'behind_rally', 'castle_opportunity_', 'castle_target_'):
              if forbidden in s:
                  raise SystemExit(f'forbidden token present: {forbidden}')
          p.write_text(s)
          PY

          git diff --check
          test "$(git diff --name-only "$CHAMPION_SHA" -- competition/agents/juraj_v35_cpp | tr '\n' ' ')" = "competition/agents/juraj_v35_cpp/main.cpp "
          git diff -- competition/agents/juraj_v35_cpp/main.cpp

      - name: Fast suite and build
        shell: bash
        run: |
          set -euo pipefail
          competition/agents/juraj_v35_cpp/test.sh
          competition/agents/juraj_v35_cpp/build.sh
          test -x competition/agents/juraj_v35_cpp/agent
          rm -f competition/agents/juraj_v35_cpp/agent competition/agents/juraj_v35_cpp/test_core competition/agents/juraj_v35_cpp/test_agent

      - name: Commit immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competition/agents/juraj_v35_cpp/main.cpp
          test "$(git diff --cached --name-only)" = "competition/agents/juraj_v35_cpp/main.cpp"
          git commit -m 'v35: conservatively drain edge surplus toward contact axis'
          git push origin HEAD:v35-logistics-conservative
          echo "GAMEPLAY_COMMIT=$(git rev-parse HEAD)"
          sha256sum competition/agents/juraj_v35_cpp/main.cpp
