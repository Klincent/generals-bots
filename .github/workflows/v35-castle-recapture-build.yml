name: V3.5 castle recapture build

on:
  workflow_dispatch:
  push:
    branches:
      - v35-castle-recapture
    paths:
      - .github/workflows/v35-castle-recapture-build.yml

permissions:
  contents: write

env:
  CHAMPION_SHA: 4f0fac768a8fc4479d45347a3ecbdbfedd6aef05

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v35-castle-recapture

      - name: Verify champion gameplay base
        shell: bash
        run: |
          set -euo pipefail
          BASE=competition/agents/juraj_v35_cpp
          for f in main.cpp core.hpp build.sh run.sh test.sh test_core.cpp test_agent.cpp; do
            git show "$CHAMPION_SHA:$BASE/$f" > /tmp/champion-file
            cmp "$BASE/$f" /tmp/champion-file
          done

      - name: Apply recapture patch and tests
        run: python .github/scripts/materialize_castle_recapture.py

      - name: Test and build
        shell: bash
        run: |
          set -euo pipefail
          competition/agents/juraj_v35_cpp/test.sh
          competition/agents/juraj_v35_cpp/build.sh
          test -x competition/agents/juraj_v35_cpp/agent
          git diff --check

      - name: Keep only gameplay change
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$CHAMPION_SHA" -- competition/agents/juraj_v35_cpp/test_agent.cpp
          rm -f competition/agents/juraj_v35_cpp/agent competition/agents/juraj_v35_cpp/test_agent competition/agents/juraj_v35_cpp/test_core
          git diff --name-only "$CHAMPION_SHA" -- competition/agents/juraj_v35_cpp > /tmp/changed
          test "$(wc -l < /tmp/changed)" -eq 1
          grep -Fxq competition/agents/juraj_v35_cpp/main.cpp /tmp/changed

      - name: Commit gameplay candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add competition/agents/juraj_v35_cpp/main.cpp
          git commit -m 'v35: recapture lost owned castles with local force'
          git push origin HEAD:v35-castle-recapture
          git rev-parse HEAD
          sha256sum competition/agents/juraj_v35_cpp/main.cpp
