name: v36-submission-package

on:
  push:
    branches:
      - juraj-v3.6-expansion-cycle-hardening

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.6-expansion-cycle-hardening
      - name: Build submission
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/build.sh
      - name: Package submission
        run: |
          set -euo pipefail
          rm -rf /tmp/juraj_v36
          mkdir -p /tmp/juraj_v36
          cp competition/agents/juraj_v35_cpp/main.cpp /tmp/juraj_v36/
          cp competition/agents/juraj_v35_cpp/core.hpp /tmp/juraj_v36/
          cp competition/agents/juraj_v35_cpp/build.sh /tmp/juraj_v36/
          cp competition/agents/juraj_v35_cpp/run.sh /tmp/juraj_v36/
          chmod +x /tmp/juraj_v36/build.sh /tmp/juraj_v36/run.sh
          cd /tmp
          zip -r "$GITHUB_WORKSPACE/juraj_v36_hardened_submission.zip" juraj_v36
          sha256sum "$GITHUB_WORKSPACE/juraj_v36_hardened_submission.zip" | tee "$GITHUB_WORKSPACE/juraj_v36_hardened_submission.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: juraj-v36-hardened-submission
          path: |
            juraj_v36_hardened_submission.zip
            juraj_v36_hardened_submission.sha256
          if-no-files-found: error
