name: V3.5 heuristic reference validation
on:
  push:
    branches: [v35-heuristic-rebuild]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate ref (dispatch checkout only)
        default: v35-heuristic-rebuild
      baseline_sha:
        description: Exact V3.4 baseline SHA
        default: 2ed9e8bbcf76b36c5276013afc356118fccc8b6e
permissions:
  contents: read
env:
  SDL_VIDEODRIVER: dummy
  BASELINE_SHA: 2ed9e8bbcf76b36c5276013afc356118fccc8b6e
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.candidate_ref || github.sha }}
      - name: Record immutable source identity
        run: |
          mkdir -p benchmark
          printf 'candidate_sha=%s\nbaseline_sha=%s\n' "$(git rev-parse HEAD)" "$BASELINE_SHA" > benchmark/source-identity.txt
          git ls-tree HEAD -- competition/agents/juraj_v35_cpp/main.cpp competition/agents/juraj_v35_cpp/core.hpp competition/agents/juraj_v35_cpp/build.sh competition/agents/juraj_v35_cpp/run.sh >> benchmark/source-identity.txt
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fast build and 20 behavioral checks
        run: |
          competition/agents/juraj_v35_cpp/build.sh
          competition/agents/juraj_v35_cpp/test.sh
          python -m py_compile competition/matchup.py competition/agents/juraj_v35_cpp/paired_benchmark.py
      - name: Materialize exact corrected V3.4
        run: |
          git fetch --no-tags --depth=1 origin juraj-v3.4
          test "$(git rev-parse FETCH_HEAD)" = "$BASELINE_SHA"
          rm -rf .bench-v34
          mkdir -p .bench-v34
          git archive "$BASELINE_SHA" competition/agents/juraj_cpp | tar -x -C .bench-v34
          .bench-v34/competition/agents/juraj_cpp/build.sh
      - name: Install headless competition engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps
      - name: V3.5 fresh Phase 1 (22100-22119)
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate competition/agents/juraj_v35_cpp/run.sh \
            --baseline .bench-v34/competition/agents/juraj_cpp/run.sh \
            --start 22100 --seeds 20 --output benchmark/phase1
          python - <<'PY'
          import json
          s=json.load(open('benchmark/phase1/summary.json'))
          assert s['errors']==0 and s['illegal_actions']==0
          assert s['score'] >= .54, f"Phase-1 score below 54% gate: {s['score']}"
          PY
      - name: V3.5 fresh Phase 2 (22150-22199)
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate competition/agents/juraj_v35_cpp/run.sh \
            --baseline .bench-v34/competition/agents/juraj_cpp/run.sh \
            --start 22150 --seeds 50 --output benchmark/phase2 --diagnostics
          python - <<'PY'
          import json
          s=json.load(open('benchmark/phase2/summary.json'))
          assert s['errors']==0 and s['illegal_actions']==0
          PY
      - name: Classify fresh Phase 2 losses
        run: |
          python competition/agents/juraj_v35_cpp/analysis/loss_forensics.py \
            --games benchmark/phase2/games.jsonl --traces benchmark/phase2/traces \
            --output benchmark/phase2/loss-forensics.json
          python - <<'PY'
          import json
          p='benchmark/phase2/loss-forensics.json'; data=json.load(open(p)); old=data['counts']
          named=['EARLY_STALL','INTERCEPT_AVAILABLE_NOT_USED','DEFENSE_UNDERCOMMITTED','MISSED_COUNTERATTACK','ECONOMICALLY_OUTPLAYED']
          out={k:old.get(k,0) for k in named}; out['OTHER']=sum(v for k,v in old.items() if k not in named)
          json.dump({'losses':data['losses'],'counts':out},open('benchmark/phase2/fresh-loss-classes.json','w'),indent=2,sort_keys=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-fresh-221xx-validation
          path: benchmark/
