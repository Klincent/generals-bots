name: v35-champion-castle-edge-hardening

on:
  push:
    branches: [juraj-v3.5-castle-edge-hardening]

permissions:
  contents: write

env:
  SDL_VIDEODRIVER: dummy
  CHAMPION_SHA: 4f0fac768a8fc4479d45347a3ecbdbfedd6aef05

jobs:
  patch-test-benchmark-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.5-castle-edge-hardening
          fetch-depth: 0

      - name: Verify exact V3.5 champion ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CHAMPION_SHA" HEAD
          test "$(git show -s --format=%s "$CHAMPION_SHA")" = "v35: escape catastrophic early expansion stalls"
          echo "PATCH_BASE=$CHAMPION_SHA"
          echo "This branch is based on immutable tag v35-champion-70fresh / exact V3.5 champion."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply castle + edge hardening to V3.5
        run: python tools/apply_v35_castle_edge_hardening.py

      - name: Commit patched V3.5 source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competition/agents/juraj_v35_cpp/main.cpp competition/agents/juraj_v35_cpp/core.hpp
          git commit -m "V3.5 champion: C1 turn-160 hardening and two-rally edge consolidation"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install engine and test dependencies
        run: |
          pip install -e .
          pip install pytest

      - name: V3.5 unit and agent tests
        run: bash competition/agents/juraj_v35_cpp/test.sh

      - name: Build candidate
        run: bash competition/agents/juraj_v35_cpp/build.sh

      - name: Build exact frozen V3.5 champion baseline
        run: |
          git worktree add --detach /tmp/v35-champion "$CHAMPION_SHA"
          bash /tmp/v35-champion/competition/agents/juraj_v35_cpp/build.sh

      - name: Fresh paired benchmark vs exact V3.5 champion
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate competition/agents/juraj_v35_cpp/run.sh \
            --baseline /tmp/v35-champion/competition/agents/juraj_v35_cpp/run.sh \
            --start 22400 --seeds 20 --output /tmp/v35-paired
          cat /tmp/v35-paired/summary.json

      - name: Smoke versus expander
        run: |
          set -euo pipefail
          mkdir -p /tmp/v35-expander
          for seed in $(seq 22420 22429); do
            python competition/matchup.py \
              competition/agents/juraj_v35_cpp/run.sh \
              competition/agents/expander_cpp/run.sh \
              --mode competition --seed "$seed" \
              >"/tmp/v35-expander/$seed.out" 2>"/tmp/v35-expander/$seed.err"
          done

      - name: Push tested V3.5 source
        run: git push origin HEAD:juraj-v3.5-castle-edge-hardening

      - name: Build minimal submission ZIP
        run: |
          rm -f submission-juraj-v3.5-castle-edge-hardening.zip
          cd competition/agents/juraj_v35_cpp
          zip ../../../submission-juraj-v3.5-castle-edge-hardening.zip main.cpp core.hpp build.sh run.sh
          cd ../../..
          unzip -l submission-juraj-v3.5-castle-edge-hardening.zip
          sha256sum submission-juraj-v3.5-castle-edge-hardening.zip

      - uses: actions/upload-artifact@v4
        with:
          name: submission-juraj-v3.5-castle-edge-hardening
          path: |
            submission-juraj-v3.5-castle-edge-hardening.zip
            /tmp/v35-paired/summary.json
            /tmp/v35-paired/selected-traces.json
          if-no-files-found: error
