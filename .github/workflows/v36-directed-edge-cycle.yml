name: v36-directed-edge-cycle
on:
  push:
    branches: [juraj-v3.6-short-cycle-only]
permissions:
  contents: write
jobs:
  test-and-commit:
    if: ${{ !contains(github.event.head_commit.message, 'V3.6: directed-edge cycle guard') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.6-short-cycle-only
          fetch-depth: 0
      - name: Apply exact cycle semantics
        run: python tools/apply_v36_directed_edge_cycle_guard.py
      - name: Unit and build smoke
        run: |
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
      - name: Commit tested implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competition/agents/juraj_v35_cpp/core.hpp \
                  competition/agents/juraj_v35_cpp/main.cpp \
                  competition/agents/juraj_v35_cpp/test_core.cpp \
                  competition/agents/juraj_v35_cpp/test_stall_hardening.cpp
          if ! git diff --cached --quiet; then
            git commit -m 'V3.6: directed-edge cycle guard'
            git push origin HEAD:juraj-v3.6-short-cycle-only
          fi
