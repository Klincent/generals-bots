name: V3.5 hardening fresh validation

on:
  push:
    branches: [v35-heuristic-rebuild]
    paths:
      - .github/workflows/v35-hardening-validation.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: dummy
  GAMEPLAY_SHA: 3716ab7e823212c7074424682250b152eed11592
  BASELINE_SHA: 2ed9e8bbcf76b36c5276013afc356118fccc8b6e

jobs:
  fresh-v34:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen gameplay and record identity
        run: |
          set -euo pipefail
          git diff --exit-code "$GAMEPLAY_SHA" HEAD -- \
            competition/agents/juraj_v35_cpp/main.cpp \
            competition/agents/juraj_v35_cpp/core.hpp \
            competition/agents/juraj_v35_cpp/build.sh \
            competition/agents/juraj_v35_cpp/run.sh
          mkdir -p benchmark/v34
          printf 'workflow_sha=%s\ngameplay_sha=%s\nbaseline_sha=%s\n' "$(git rev-parse HEAD)" "$GAMEPLAY_SHA" "$BASELINE_SHA" > benchmark/v34/source-identity.txt
          git ls-tree "$GAMEPLAY_SHA" -- competition/agents/juraj_v35_cpp/main.cpp competition/agents/juraj_v35_cpp/core.hpp competition/agents/juraj_v35_cpp/build.sh competition/agents/juraj_v35_cpp/run.sh >> benchmark/v34/source-identity.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate and behavioral tests
        run: |
          competition/agents/juraj_v35_cpp/build.sh
          competition/agents/juraj_v35_cpp/test.sh
      - name: Materialize exact V3.4
        run: |
          set -euo pipefail
          git fetch --no-tags origin juraj-v3.4
          test "$(git rev-parse origin/juraj-v3.4)" = "$BASELINE_SHA"
          rm -rf .bench-v34
          mkdir -p .bench-v34
          git archive "$BASELINE_SHA" competition/agents/juraj_cpp | tar -x -C .bench-v34
          .bench-v34/competition/agents/juraj_cpp/build.sh
      - name: Install headless competition engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps
      - name: Fresh 22200-22249 vs exact V3.4
        run: |
          set -euo pipefail
          PYTHONPATH=. python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate competition/agents/juraj_v35_cpp/run.sh \
            --baseline .bench-v34/competition/agents/juraj_cpp/run.sh \
            --start 22200 --seeds 50 --output benchmark/v34 --diagnostics
          python - <<'PY'
          import json
          p='benchmark/v34/summary.json'
          s=json.load(open(p))
          assert s['errors']==0, s
          assert s['illegal_actions']==0, s
          print('FRESH_V34', json.dumps(s, sort_keys=True))
          open('v34-summary.json','w').write(json.dumps(s,indent=2,sort_keys=True)+'\n')
          PY
      - name: Fresh V3.4 loss forensics
        if: always()
        run: |
          if [ -f benchmark/v34/games.jsonl ] && [ -d benchmark/v34/traces ]; then
            PYTHONPATH=. python competition/agents/juraj_v35_cpp/analysis/loss_forensics.py \
              --games benchmark/v34/games.jsonl --traces benchmark/v34/traces \
              --output benchmark/v34/loss-forensics.json || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-hardening-fresh-v34
          path: |
            benchmark/v34/
            v34-summary.json
          if-no-files-found: error

  fresh-proxy:
    strategy:
      fail-fast: false
      matrix:
        opponent: [expander_cpp, expander_rust, expander_python]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen gameplay
        run: |
          git diff --exit-code "$GAMEPLAY_SHA" HEAD -- \
            competition/agents/juraj_v35_cpp/main.cpp \
            competition/agents/juraj_v35_cpp/core.hpp \
            competition/agents/juraj_v35_cpp/build.sh \
            competition/agents/juraj_v35_cpp/run.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate and proxy
        env:
          OPP: ${{ matrix.opponent }}
        run: |
          set -euo pipefail
          competition/agents/juraj_v35_cpp/build.sh
          case "$OPP" in
            expander_cpp) competition/agents/expander_cpp/build.sh ;;
            expander_rust) competition/agents/expander_rust/build.sh ;;
            expander_python) : ;;
            *) exit 2 ;;
          esac
      - name: Install headless competition engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps
      - name: Fresh 22250-22269 proxy games
        env:
          OPP: ${{ matrix.opponent }}
        run: |
          set -euo pipefail
          OUT="benchmark/proxy-$OPP"
          PYTHONPATH=. python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate competition/agents/juraj_v35_cpp/run.sh \
            --baseline "competition/agents/$OPP/run.sh" \
            --start 22250 --seeds 20 --output "$OUT"
          python - "$OPP" <<'PY'
          import json,sys
          opp=sys.argv[1]
          p=f'benchmark/proxy-{opp}/summary.json'
          s=json.load(open(p))
          assert s['errors']==0, s
          assert s['illegal_actions']==0, s
          s['opponent']=opp
          out=f'proxy-summary-{opp}.json'
          open(out,'w').write(json.dumps(s,indent=2,sort_keys=True)+'\n')
          print('PROXY', opp, json.dumps(s, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-hardening-proxy-${{ matrix.opponent }}
          path: |
            benchmark/proxy-${{ matrix.opponent }}/
            proxy-summary-${{ matrix.opponent }}.json
          if-no-files-found: error

  aggregate:
    needs: [fresh-v34, fresh-proxy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v35-hardening-*
          path: downloaded
      - name: Aggregate results
        run: |
          python - <<'PY'
          import glob,json,os
          result={'gameplay_sha':'3716ab7e823212c7074424682250b152eed11592','baseline_sha':'2ed9e8bbcf76b36c5276013afc356118fccc8b6e'}
          v=glob.glob('downloaded/**/v34-summary.json',recursive=True)
          result['v34']=json.load(open(v[0])) if v else None
          proxies={}
          for p in glob.glob('downloaded/**/proxy-summary-*.json',recursive=True):
            s=json.load(open(p)); proxies[s['opponent']]=s
          result['proxies']=proxies
          if proxies:
            scores=[x['score'] for x in proxies.values()]
            result['proxy_macro_score']=sum(scores)/len(scores)
            result['proxy_worst_score']=min(scores)
            result['proxy_best_score']=max(scores)
          health=[]
          if result['v34']: health.append((result['v34']['errors'],result['v34']['illegal_actions']))
          health += [(x['errors'],x['illegal_actions']) for x in proxies.values()]
          result['health_clean']=bool(health) and all(e==0 and i==0 for e,i in health)
          open('hardening-aggregate.json','w').write(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v35-hardening-aggregate
          path: hardening-aggregate.json
