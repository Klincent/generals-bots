name: v36-iter1-attack-pass-pr
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test-benchmark:
    if: ${{ github.head_ref == 'juraj-v3.6-iter1-attack-pass' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 89568b0912eb3a482a3994349e2724642b893b3a
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.6-iter1-attack-pass
          fetch-depth: 0
      - name: Apply iter1 attack/pass patch
        run: python tools/apply_v36_iter1_attack_pass.py
      - name: Unit and build smoke
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: pip install -e .
      - name: Build exact per-packet baseline
        run: |
          git worktree add --detach /tmp/v36-base "$BASE_SHA"
          bash /tmp/v36-base/competition/agents/juraj_v35_cpp/build.sh
      - name: Run 40-game paired benchmark
        run: |
          set -euo pipefail
          cat > /tmp/run-candidate.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_EDGE_PICKER_THRESHOLD=16
          export V36_EDGE_PICKER_MIN_EFFICIENCY=2.0
          "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed -u 's/^/[CAND] /' >&2)
          EOF
          cat > /tmp/run-base.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_EDGE_PICKER_THRESHOLD=16
          export V36_EDGE_PICKER_MIN_EFFICIENCY=2.0
          "/tmp/v36-base/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed -u 's/^/[BASE] /' >&2)
          EOF
          chmod +x /tmp/run-candidate.sh /tmp/run-base.sh
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/run-candidate.sh --baseline /tmp/run-base.sh \
            --start 24300 --seeds 20 --output /tmp/v36-iter1
          cat /tmp/v36-iter1/summary.json
          python tools/analyze_v36_iter1.py /tmp/v36-iter1/games.jsonl | tee /tmp/v36-iter1/analysis.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v36-iter1-attack-pass
          path: /tmp/v36-iter1
          retention-days: 3
