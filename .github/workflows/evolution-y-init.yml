name: evolution-y-init
on:
  push:
    branches: [evolution/version-y]
    paths: ['.github/workflows/evolution-y-init.yml']
permissions:
  contents: write
jobs:
  init-y:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution/version-y
          fetch-depth: 0
      - name: Apply one initial gameplay improvement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('competition/agents/juraj_v35_cpp/main.cpp')
          s=p.read_text()
          old='production_==ProductionState::SEVERE_DEFICIT?.62:production_==ProductionState::SOFT_DEFICIT?.45:.35'
          new='production_==ProductionState::SEVERE_DEFICIT?.62:production_==ProductionState::SOFT_DEFICIT?.45:((!enemy_seen&&o.turn<=250)?.40:.35)'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
      - name: Commit Y1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competition/agents/juraj_v35_cpp/main.cpp
          git commit -m 'evolution Y1: healthy pre-contact expansion through t250'
          git push origin HEAD:evolution/version-y
