name: evolution5-preflight

on:
  push:
    branches: [master]
    paths:
      - 'evolution5/preflight-kick.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SDL_VIDEODRIVER: dummy
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution5/cambrian-league
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python architecture tests
        run: |
          set -euo pipefail
          git fetch --no-tags origin evolution4/turbo-structural evolution4/turbo-template
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m py_compile tools/evolution4/*.py tools/evolution5/*.py
          pytest -q tests/test_evolution5.py
      - name: Bootstrap 64 organisms without persistence
        run: |
          set -euo pipefail
          rm -rf evolution5/genomes
          python - <<'PY'
          from tools.evolution5.bootstrap import build_bootstrap_state
          from tools.evolution5.genome import load_genome
          from tools.evolution5.graph import validate_graph
          from pathlib import Path
          s,paths=build_bootstrap_state()
          assert s['mode']=='cambrian_league_v1'
          assert len(s['islands'])==8
          assert len(s['current_population'])==64
          assert len(set(s['current_population']))==64
          assert all(len(q['population'])==8 for q in s['islands'].values())
          for gid in s['current_population']:
              validate_graph(load_genome(Path('evolution5/genomes')/f'{gid}.json')['genome']['graph'])
          print('BOOTSTRAP OK islands=8 population=64 league=',len(s['league']))
          PY
          git reset --hard origin/evolution5/cambrian-league
          git clean -fd evolution5/genomes
      - name: C++ baseline regression and graph runtime
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/test.sh
          git reset --hard origin/evolution5/cambrian-league
          python -m tools.evolution5.apply_cpp
          bash competition/agents/juraj_v35_cpp/build.sh
          grep -q 'e5_.update' competition/agents/juraj_v35_cpp/main.cpp
          grep -q 'e5_.allow(q)' competition/agents/juraj_v35_cpp/main.cpp
          rm -rf /tmp/e5-baseline
          git worktree prune
          git worktree add --detach /tmp/e5-baseline origin/evolution4/turbo-template
          bash /tmp/e5-baseline/competition/agents/juraj_v35_cpp/build.sh
          python -m tools.evolution4.equivalence_check --original /tmp/e5-baseline/competition/agents/juraj_v35_cpp/run.sh --template competition/agents/juraj_v35_cpp/run.sh --env-json '{}' --seeds 12
      - name: Clean evolved standalone submission freeze
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from tools.evolution4.genome import founder_x0
          from tools.evolution5.graph import specialize_graph
          from tools.evolution5.freeze import freeze_submission
          genome={'graph':specialize_graph('Rush'),'params':founder_x0()}
          info=freeze_submission(genome,Path('.'),Path('/tmp/e5-preflight-submission.zip'))
          assert info['size']>1000
          print('EVOLVED FREEZE OK',info)
          PY
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('/tmp/e5-preflight-submission.zip')
          assert sorted(z.namelist())==sorted(['main.cpp','core.hpp','build.sh','run.sh'])
          run=z.read('run.sh').decode()
          assert 'EVO5_GRAPH_MODE=evolved' in run
          assert 'EVO5_GRAPH_RUNTIME=' in run
          assert 'EVO5_GRAPH_ENTRY=' in run
          assert 'EVO5_ACTIVE_MODULES=' in run
          print('EVOLVED ZIP CONTENTS/GRAPH ENV OK',z.namelist())
          PY
