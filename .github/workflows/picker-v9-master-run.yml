name: picker-v9-master-run
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  apply-test:
    if: github.event.head_commit.message == 'ci: trigger picker-v9 master run'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      E501: e50123cee7d924f0d643acd372a5300971f93917
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/picker-v9-muster-castle
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - name: Apply patch
        run: |
          python competition/agents/juraj_v35_cpp/apply_picker_v9.py
          git diff --check
      - name: Test and build
        run: |
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
      - name: Commit implementation
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git add competition/agents/juraj_v35_cpp/main.cpp
          git commit -m 'picker-v9: implement late attack muster and castle catchup'
          git push origin HEAD:chatgpt/picker-v9-muster-castle
