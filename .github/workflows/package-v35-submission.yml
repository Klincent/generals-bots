name: Package V3.5 submission
on:
  push:
    branches: [v35-submission-package]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build exact candidate and package minimal submission
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "cf51ae7be3194d48266557d8d589ac72efa6c58c"
          rm -rf juraj_v35 juraj_v35_submission_cf51ae7.zip
          mkdir juraj_v35
          cp competition/agents/juraj_v35_cpp/main.cpp juraj_v35/
          cp competition/agents/juraj_v35_cpp/core.hpp juraj_v35/
          cp competition/agents/juraj_v35_cpp/build.sh juraj_v35/
          cp competition/agents/juraj_v35_cpp/run.sh juraj_v35/
          chmod +x juraj_v35/build.sh juraj_v35/run.sh
          (cd juraj_v35 && ./build.sh && test -x agent)
          rm -f juraj_v35/agent
          zip -r juraj_v35_submission_cf51ae7.zip juraj_v35
          unzip -l juraj_v35_submission_cf51ae7.zip
          sha256sum juraj_v35_submission_cf51ae7.zip | tee submission.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: juraj-v35-submission-cf51ae7
          path: |
            juraj_v35_submission_cf51ae7.zip
            submission.sha256
          if-no-files-found: error
