name: v36-e50123-rebuild-pr
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  rebuild-test-benchmark:
    if: ${{ github.head_ref == 'juraj-v3.6-e50123-rebuild' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: e50123cee7d924f0d643acd372a5300971f93917
      FEATURE_SHA: 61bf6184dda66355170156d6d8b08be5511e4d36
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.6-e50123-rebuild
          fetch-depth: 0
      - name: Restore selected picker and 3x3 feature patchers
        run: |
          set -euo pipefail
          for f in apply_v36_edge_picker.py apply_v36_picker_lifecycle_fix.py apply_v36_picker_economics.py apply_v36_search_refactor.py; do
            git show "$FEATURE_SHA:tools/$f" > "/tmp/$f"
          done
      - name: Apply picker and 3x3 exploration only
        run: |
          set -euo pipefail
          python /tmp/apply_v36_edge_picker.py
          python /tmp/apply_v36_picker_lifecycle_fix.py
          python /tmp/apply_v36_picker_economics.py
          python /tmp/apply_v36_search_refactor.py
      - name: Apply exact per-packet four-edge anti-cycle guard
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path('competition/agents/juraj_v35_cpp/core.hpp')
          s=core.read_text()
          a=s.index('inline bool route_allowed(')
          b=s.index('\nstruct Budget',a)
          fn='inline bool route_allowed(const Packet&p,int dest,int new_distance,int old_distance,int event_version,Reason reason){bool emergency=reason==Reason::GENERAL_EMERGENCY||reason==Reason::TERMINAL_CAPTURE;if(emergency)return true;int seen_edges=0;for(int i=(int)p.path.size()-1;i>=1&&seen_edges<4;--i,++seen_edges)if(p.path[i-1]==p.cell&&p.path[i]==dest)return false;bool recent_return=false;int seen_cells=0;for(auto it=p.path.rbegin();it!=p.path.rend()&&seen_cells<5;++it,++seen_cells)if(*it==dest){recent_return=true;break;}bool changed=event_version!=p.event_version&&reason!=Reason::NONE;if(!changed&&new_distance>old_distance&&!recent_return)return false;return true;}'
          core.write_text(s[:a]+fn+s[b:])
          main=Path('competition/agents/juraj_v35_cpp/main.cpp')
          s=main.read_text()
          import re
          s,n=re.subn(r'while\(p\.path\.size\(\)>\d+\)p\.path\.pop_front\(\);','while(p.path.size()>5)p.path.pop_front();',s,count=1)
          if n!=1: raise SystemExit('could not trim packet path to 5 cells')
          a=s.index(' bool history_cycle(')
          b=s.index('\n bool packet_route_ok',a)
          fn=' bool history_cycle(const Candidate&q)const{if(q.from<0||q.to<0)return false;if(q.reason==Reason::GENERAL_EMERGENCY||q.reason==Reason::TERMINAL_CAPTURE)return false;const Packet*p=packet_for(q.from);if(!p)return false;int seen_edges=0;for(int i=(int)p->path.size()-1;i>=1&&seen_edges<4;--i,++seen_edges)if(p->path[i-1]==q.from&&p->path[i]==q.to)return true;return false;}'
          main.write_text(s[:a]+fn+s[b:])
          PY
      - name: Restore feature regression tests
        run: |
          set -euo pipefail
          for f in test_picker.cpp test_picker_economics.cpp test_search_refactor.cpp; do
            git show "$FEATURE_SHA:competition/agents/juraj_v35_cpp/$f" > "competition/agents/juraj_v35_cpp/$f"
          done
          git show "$FEATURE_SHA:competition/agents/juraj_v35_cpp/test.sh" > competition/agents/juraj_v35_cpp/test.sh
          chmod +x competition/agents/juraj_v35_cpp/test.sh
      - name: Verify requested invariants
        run: |
          set -euo pipefail
          grep -q 'owned_castle_history_' competition/agents/juraj_v35_cpp/main.cpp
          grep -q 'castles_=plan_castles(g_,general_)' competition/agents/juraj_v35_cpp/main.cpp
          grep -q 'sector_target_' competition/agents/juraj_v35_cpp/main.cpp
          grep -q 'EdgePickerState picker_' competition/agents/juraj_v35_cpp/main.cpp
          grep -q 'seen_edges<4' competition/agents/juraj_v35_cpp/core.hpp
          cat >/tmp/test_cycle.cpp <<'EOF'
          #include "competition/agents/juraj_v35_cpp/core.hpp"
          #include <cassert>
          using namespace v35;
          static bool ok(std::initializer_list<int> path,int cell,int dest){Packet p;p.cell=cell;p.target=99;p.path=std::deque<int>(path);return route_allowed(p,dest,0,0,0,Reason::SEARCH_PROGRESS);}
          int main(){assert(ok({1,2},2,1));assert(!ok({1,2,1},1,2));assert(ok({1,2,3},3,2));assert(!ok({1,2,3,2},2,3));assert(ok({1,2,3,4,1},1,5));assert(!ok({1,2,3,4,1},1,2));Packet p;p.cell=1;p.path={1,2,1};assert(route_allowed(p,2,0,0,0,Reason::GENERAL_EMERGENCY));}
          EOF
          g++ -std=c++20 -O2 -I. /tmp/test_cycle.cpp -o /tmp/test_cycle
          /tmp/test_cycle
      - name: Unit tests and build
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: pip install -e .
      - name: Build exact e50123 champion
        run: |
          git worktree add --detach /tmp/champion "$BASE_SHA"
          bash /tmp/champion/competition/agents/juraj_v35_cpp/build.sh
      - name: Run 120-game paired benchmark vs e50123 champion
        run: |
          set -euo pipefail
          cat >/tmp/run-candidate.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_EDGE_PICKER_THRESHOLD=16
          export V36_EDGE_PICKER_MIN_EFFICIENCY=2.0
          "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed -u 's/^/[CAND] /' >&2)
          EOF
          cat >/tmp/run-champion.sh <<'EOF'
          #!/usr/bin/env bash
          "/tmp/champion/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed -u 's/^/[CHAMP] /' >&2)
          EOF
          chmod +x /tmp/run-candidate.sh /tmp/run-champion.sh
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/run-candidate.sh --baseline /tmp/run-champion.sh \
            --start 30000 --seeds 60 --output /tmp/e50123-rebuild-bench
          cat /tmp/e50123-rebuild-bench/summary.json
      - name: Feature telemetry summary
        run: |
          python - <<'PY' | tee /tmp/e50123-rebuild-bench/feature-summary.txt
          import json,re
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/e50123-rebuild-bench/games.jsonl').read_text().splitlines() if x.strip()]
          def tag(stderr,prefix):
            xs=[x[7:] for x in stderr.splitlines() if x.startswith('[CAND] '+prefix)]
            return xs[-1] if xs else ''
          def ints(s): return {k:int(v) for k,v in re.findall(r'(\w+)=(-?\d+)',s)}
          d=[]
          for g in rows:
            e=g.get('stderr','')
            p=ints(tag(e,'[v36_picker]')); q=ints(tag(e,'[v36_search]')); c=ints(tag(e,'[v35_castle_deadline]')); a=ints(tag(e,'[v35_actions]'))
            d.append((g['result'],p,q,c,a))
          for result in ('win','draw','loss'):
            xs=[x for x in d if x[0]==result]
            if not xs: continue
            avg=lambda idx,key: sum(x[idx].get(key,0) for x in xs)/len(xs)
            print(result, 'n=',len(xs), 'picker_starts=',round(avg(1,'starts'),2),'delivered=',round(avg(1,'delivered'),2),'touched=',round(avg(2,'touched'),2),'swept=',round(avg(2,'swept'),2),'c1_missing=',sum(x[3].get('c1_build_turn',-1)<0 for x in xs),'c2_missing=',sum(x[3].get('c2_build_turn',-1)<0 for x in xs),'war=',round(avg(4,'war'),2))
          PY
      - name: Commit rebuilt source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competition/agents/juraj_v35_cpp/core.hpp competition/agents/juraj_v35_cpp/main.cpp competition/agents/juraj_v35_cpp/test.sh competition/agents/juraj_v35_cpp/test_picker.cpp competition/agents/juraj_v35_cpp/test_picker_economics.cpp competition/agents/juraj_v35_cpp/test_search_refactor.cpp
          git commit -m 'V3.6: e50123 champion plus picker 3x3 search and exact anti-cycle'
          git push origin HEAD:juraj-v3.6-e50123-rebuild
      - name: Build submission package
        run: |
          set -euo pipefail
          rm -rf /tmp/submission && mkdir -p /tmp/submission/juraj_v36
          cp competition/agents/juraj_v35_cpp/main.cpp competition/agents/juraj_v35_cpp/core.hpp competition/agents/juraj_v35_cpp/build.sh competition/agents/juraj_v35_cpp/run.sh /tmp/submission/juraj_v36/
          cd /tmp/submission && zip -qr /tmp/juraj_v36_e50123_rebuild.zip juraj_v36
          sha256sum /tmp/juraj_v36_e50123_rebuild.zip | tee /tmp/e50123-rebuild-bench/submission.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: v36-e50123-rebuild-results
          path: |
            /tmp/e50123-rebuild-bench
            /tmp/juraj_v36_e50123_rebuild.zip
          retention-days: 5
