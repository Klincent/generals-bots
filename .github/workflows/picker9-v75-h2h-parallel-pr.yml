name: picker9-v75-h2h-parallel-pr

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  shard:
    if: ${{ github.head_ref == 'tmp/picker9-v75-h2h2-trigger' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        start: [52000, 52005, 52010, 52015, 52020]
    env:
      FINAL_SHA: 2260b6f19d51a14d7c68770677f22d04dfd88022
      V75_SHA: 9cc3b78a0003dd17079cd2aa8d6439321fedccc0
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FINAL_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - name: Build exact versions
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/build.sh
          git worktree add --detach /tmp/v75 "$V75_SHA"
          bash /tmp/v75/competition/agents/juraj_v35_cpp/build.sh
          cat >/tmp/final.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1 V35_DOOMGUARD_ENABLED=1
          exec "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed 's/^/[FINAL] /' >&2)
          EOF
          cat >/tmp/v75.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1 V35_DOOMGUARD_ENABLED=1
          exec "/tmp/v75/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed 's/^/[V75] /' >&2)
          EOF
          chmod +x /tmp/final.sh /tmp/v75.sh
      - name: Run 10 games
        run: |
          OUT=/tmp/h2h-${{ matrix.start }}
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/final.sh --baseline /tmp/v75.sh --start ${{ matrix.start }} --seeds 5 --output "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: h2h-${{ matrix.start }}
          path: /tmp/h2h-${{ matrix.start }}
          retention-days: 14

  aggregate:
    if: ${{ github.head_ref == 'tmp/picker9-v75-h2h2-trigger' }}
    needs: shard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: h2h-*
          path: /tmp/results
      - name: Aggregate 50 games and production telemetry
        run: |
          python - <<'PY' | tee /tmp/summary.txt
          import json,glob,re,statistics
          W=D=L=err=illegal=0; games=[]
          for p in glob.glob('/tmp/results/**/summary.json',recursive=True):
              s=json.load(open(p)); W+=s['W'];D+=s['D'];L+=s['L'];err+=s['errors'];illegal+=s['illegal_actions']
          for p in glob.glob('/tmp/results/**/games.jsonl',recursive=True):
              games += [json.loads(x) for x in open(p)]
          print(f'FINAL_vs_V75 W/D/L={W}/{D}/{L} games={W+D+L} raw_wr={W/max(1,W+D+L):.4f} score={(W+.5*D)/max(1,W+D+L):.4f} errors={err} illegal={illegal}')
          turns=[50,100,150,200,250,300,400,600,800]
          land={k:{t:[] for t in turns} for k in ('FINAL','V75')}
          def add(who,s):
              for line in s.splitlines():
                  if not line.startswith(f'[{who}] [v35_land]'): continue
                  d={int(a):int(b) for a,b in re.findall(r'(\d+):(\d+)',line)}
                  for t in turns:
                      if t in d: land[who][t].append(d[t])
          for g in games:
              for who in ('FINAL','V75'): add(who,g.get('stderr',''))
          print('mean_land_snapshots')
          for t in turns:
              fv=statistics.mean(land['FINAL'][t]) if land['FINAL'][t] else 0
              vv=statistics.mean(land['V75'][t]) if land['V75'][t] else 0
              print(f'{t}: final={fv:.2f} v75={vv:.2f} delta={fv-vv:+.2f} n={len(land["FINAL"][t])}/{len(land["V75"][t])}')
          assert err==0 and illegal==0
          PY
          mkdir -p /tmp/final
          cp /tmp/summary.txt /tmp/final/
      - uses: actions/upload-artifact@v4
        with:
          name: picker9-final-v75-parallel-summary
          path: /tmp/final
          retention-days: 14
