name: picker9-loop

on:
  push:
    branches:
      - automation/picker9-loop
    paths:
      - tools/picker9_loop_experiment.py

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SDL_VIDEODRIVER: dummy
      PARENT_SHA: 9cc3b78a0003dd17079cd2aa8d6439321fedccc0
    steps:
      - name: Checkout loop branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve experiment and checkout exact v75
        run: |
          set -euo pipefail
          cp tools/picker9_loop_experiment.py /tmp/picker9_loop_experiment.py
          git fetch origin --prune
          git checkout --detach "$PARENT_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install -e .

      - name: Apply one experiment and build
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/parent "$PARENT_SHA"
          if git rev-parse --verify --quiet origin/v35-defense-fresh >/dev/null; then DREF=origin/v35-defense-fresh; else DREF=v35-defense-fresh; fi
          git worktree add --detach /tmp/defense "$DREF"
          python /tmp/picker9_loop_experiment.py competition/agents/juraj_v35_cpp/main.cpp
          git diff --check
          git diff -- competition/agents/juraj_v35_cpp/main.cpp | tee /tmp/experiment.diff
          cp /tmp/picker9_loop_experiment.py /tmp/experiment.py
          bash competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/parent/competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/defense/competition/agents/juraj_v35_cpp/build.sh
          cat >/tmp/patched.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1 V35_DOOMGUARD_ENABLED=1
          exec "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed 's/^/[PATCHED] /' >&2)
          EOF
          cat >/tmp/parent.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1 V35_DOOMGUARD_ENABLED=1
          exec "/tmp/parent/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed 's/^/[PARENT] /' >&2)
          EOF
          chmod +x /tmp/patched.sh /tmp/parent.sh /tmp/defense/competition/agents/juraj_v35_cpp/run.sh

      - name: Random exact-parent screen
        run: |
          set -euo pipefail
          OUT=/tmp/random-v75
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/patched.sh --baseline /tmp/parent.sh --start 55700 --seeds 12 --output "$OUT"
          cat "$OUT/summary.json"
          python - "$OUT/summary.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          assert s['errors']==0 and s['illegal_actions']==0, s
          PY

      - name: Defense candidate
        run: |
          set -euo pipefail
          OUT=/tmp/defense-patched-v75
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/patched.sh --baseline /tmp/defense/competition/agents/juraj_v35_cpp/run.sh --start 55720 --seeds 10 --output "$OUT"
          cat "$OUT/summary.json"
          python - "$OUT/summary.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          assert s['errors']==0 and s['illegal_actions']==0, s
          PY

      - name: Defense exact-parent control
        run: |
          set -euo pipefail
          OUT=/tmp/defense-parent-v75
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/parent.sh --baseline /tmp/defense/competition/agents/juraj_v35_cpp/run.sh --start 55720 --seeds 10 --output "$OUT"
          cat "$OUT/summary.json"
          python - "$OUT/summary.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]))
          assert s['errors']==0 and s['illegal_actions']==0, s
          PY

      - name: Production snapshots
        run: |
          python - <<'PY' | tee /tmp/production-v75.txt
          import json,re,statistics
          rows=[json.loads(x) for x in open('/tmp/random-v75/games.jsonl')]
          turns=[50,100,150,200,250,300,400,600,800]
          d={k:{t:[] for t in turns} for k in ('PATCHED','PARENT')}
          for g in rows:
            for line in g.get('stderr','').splitlines():
              for who in d:
                if line.startswith(f'[{who}] [v35_land]'):
                  vals={int(a):int(b) for a,b in re.findall(r'(\d+):(\d+)',line)}
                  for t in turns:
                    if t in vals:
                      d[who][t].append(vals[t])
          out={}
          for t in turns:
            a=statistics.mean(d['PATCHED'][t]) if d['PATCHED'][t] else 0
            b=statistics.mean(d['PARENT'][t]) if d['PARENT'][t] else 0
            out[str(t)]={'patched':a,'parent':b,'delta':a-b}
            print(f'{t} patched={a:.2f} parent={b:.2f} delta={a-b:+.2f}')
          json.dump(out,open('/tmp/production-v75.json','w'),indent=2,sort_keys=True)
          PY

      - name: Persist loop result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          result={
            'experiment': pathlib.Path('/tmp/experiment.py').read_text(),
            'random': json.load(open('/tmp/random-v75/summary.json')),
            'defense_candidate': json.load(open('/tmp/defense-patched-v75/summary.json')),
            'defense_parent': json.load(open('/tmp/defense-parent-v75/summary.json')),
            'production': json.load(open('/tmp/production-v75.json')),
          }
          pathlib.Path('/tmp/picker9_loop_last_result.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
          git fetch origin automation/picker9-loop
          git worktree add /tmp/loop-result origin/automation/picker9-loop
          cp /tmp/picker9_loop_last_result.json /tmp/loop-result/tools/picker9_loop_last_result.json
          cd /tmp/loop-result
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/picker9_loop_last_result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: record picker9 loop result'
          git push origin HEAD:automation/picker9-loop

      - name: Upload loop artifact
        uses: actions/upload-artifact@v4
        with:
          name: picker9-loop-${{ github.run_number }}
          path: |
            /tmp/random-v75
            /tmp/defense-patched-v75
            /tmp/defense-parent-v75
            /tmp/production-v75.txt
            /tmp/production-v75.json
            /tmp/experiment.py
            /tmp/experiment.diff
            /tmp/picker9_loop_last_result.json
          retention-days: 14
