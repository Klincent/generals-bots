name: picker9-production-gate-pr

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  parent-delta:
    if: ${{ github.head_ref == 'tmp/picker9-production-gate-trigger' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v75
            sha: 9cc3b78a0003dd17079cd2aa8d6439321fedccc0
            start: 53000
          - name: final
            sha: 2260b6f19d51a14d7c68770677f22d04dfd88022
            start: 53000
    env:
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - name: Preserve exact parent and apply one production gate fix
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/parent ${{ matrix.sha }}
          python - <<'PY'
          from pathlib import Path
          p=Path('competition/agents/juraj_v35_cpp/main.cpp')
          s=p.read_text()
          old='bool allowed=mature&&not_behind&&growing&&needs_concentration;'
          new='bool allowed=mature&&not_behind&&growing&&few_neutrals&&needs_concentration;'
          if old not in s: raise SystemExit('allowed gate not found')
          s=s.replace(old,new,1)
          old2='else if(!growing)++picker_reject_growth_;else if(!needs_concentration)++picker_reject_concentration_;'
          new2='else if(!growing)++picker_reject_growth_;else if(!few_neutrals)++picker_reject_neutrals_;else if(!needs_concentration)++picker_reject_concentration_;'
          if old2 not in s: raise SystemExit('reject chain not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- competition/agents/juraj_v35_cpp/main.cpp
          bash competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/parent/competition/agents/juraj_v35_cpp/build.sh
          cat >/tmp/patched.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1 V35_DOOMGUARD_ENABLED=1
          exec "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed 's/^/[PATCHED] /' >&2)
          EOF
          cat >/tmp/parent.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1 V35_DOOMGUARD_ENABLED=1
          exec "/tmp/parent/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed 's/^/[PARENT] /' >&2)
          EOF
          chmod +x /tmp/patched.sh /tmp/parent.sh
      - name: Paired parent regression screen
        run: |
          OUT=/tmp/${{ matrix.name }}-prodgate
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/patched.sh --baseline /tmp/parent.sh --start ${{ matrix.start }} --seeds 10 --output "$OUT"
          cat "$OUT/summary.json"
      - name: Production snapshots
        run: |
          python - <<'PY' | tee /tmp/${{ matrix.name }}-prodgate/production.txt
          import json,re,statistics
          rows=[json.loads(x) for x in open('/tmp/${{ matrix.name }}-prodgate/games.jsonl')]
          turns=[50,100,150,200,250,300,400,600,800]
          d={k:{t:[] for t in turns} for k in ('PATCHED','PARENT')}
          for g in rows:
            for line in g.get('stderr','').splitlines():
              for who in d:
                if line.startswith(f'[{who}] [v35_land]'):
                  vals={int(a):int(b) for a,b in re.findall(r'(\d+):(\d+)',line)}
                  for t in turns:
                    if t in vals:d[who][t].append(vals[t])
          for t in turns:
            a=statistics.mean(d['PATCHED'][t]) if d['PATCHED'][t] else 0
            b=statistics.mean(d['PARENT'][t]) if d['PARENT'][t] else 0
            print(f'{t} patched={a:.2f} parent={b:.2f} delta={a-b:+.2f}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prodgate-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}-prodgate
          retention-days: 14
