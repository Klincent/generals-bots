name: evolution3-elitist

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/evolution3-elitist.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: evolution3-elitist
  cancel-in-progress: false

jobs:
  transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SDL_VIDEODRIVER: dummy
      X0_GAMEPLAY_SHA: 2260b6f19d51a14d7c68770677f22d04dfd88022
    steps:
      - name: Checkout evolution3 control
        uses: actions/checkout@v4
        with:
          ref: evolution3/control
          fetch-depth: 0

      - name: Emergency STOP check
        id: stop
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin evolution3/control
          if git cat-file -e origin/evolution3/control:evolution3/STOP 2>/dev/null; then
            echo 'stopped=true' >> "$GITHUB_OUTPUT"
            echo 'evolution3/STOP present; no work performed.'
          else
            echo 'stopped=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.stop.outputs.stopped != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize pinned evaluator
        if: steps.stop.outputs.stopped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            evolution3/start-x evolution3/start-y \
            evolution3/version-x evolution3/version-y \
            evolution2/control
          git archive "$X0_GAMEPLAY_SHA" competition generals | tar -x
          test -s competition/agents/juraj_v35_cpp/paired_benchmark.py
          test -s competition/matchup.py
          test -s competition/protocol.py
          grep -q -- '--audit-json' competition/matchup.py
          python -m py_compile \
            competition/agents/juraj_v35_cpp/paired_benchmark.py \
            competition/matchup.py \
            competition/protocol.py \
            tools/evolution3_orchestrator.py

      - name: Install evaluator dependencies
        if: steps.stop.outputs.stopped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps

      - name: Execute exactly one evolution3 transaction
        id: evolve
        if: steps.stop.outputs.stopped != 'true'
        shell: bash
        run: |
          set +e
          python tools/evolution3_orchestrator.py 2>&1 | tee /tmp/evolution3.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Read durable state
        id: state
        if: always() && steps.stop.outputs.stopped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin evolution3/control
          git show origin/evolution3/control:evolution3/state.json > /tmp/evolution3-state.json
          python - <<'PY' | tee /tmp/evolution3-state-summary.txt
          import json
          s=json.load(open('/tmp/evolution3-state.json'))
          print('phase=',s.get('phase'))
          print('cycle1=',s.get('cycle1_attempted'),'/23 promoted=',s.get('cycle1_promoted'),'rejected=',s.get('cycle1_rejected'))
          print('cycle2=',s.get('cycle2_attempted'),'/32')
          print('X promoted/rejected/skipped=',s.get('cycle2_x_promoted'),s.get('cycle2_x_rejected'),s.get('cycle2_x_skipped'))
          print('Y promoted/rejected/skipped=',s.get('cycle2_y_promoted'),s.get('cycle2_y_rejected'),s.get('cycle2_y_skipped'))
          print('X champion=',s.get('current_x_champion_sha'))
          print('Y champion=',s.get('current_y_champion_sha'))
          print('retry_count=',s.get('retry_count'),'last_error=',s.get('last_error'))
          PY
          phase=$(python -c "import json; print(json.load(open('/tmp/evolution3-state.json')).get('phase',''))")
          retry=$(python -c "import json; print(int(json.load(open('/tmp/evolution3-state.json')).get('retry_count',0)))")
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "retry=$retry" >> "$GITHUB_OUTPUT"

      - name: Upload final submission only
        if: always() && steps.state.outputs.phase == 'done'
        uses: actions/upload-artifact@v4
        with:
          name: evolution3-final
          path: |
            evolution3/final/generals_evolution3_submission.zip
            evolution3/final/generals_evolution3_submission.sha256
            evolution3/final/VALIDATION.json
          if-no-files-found: error
          retention-days: 30

      - name: Dispatch next transaction
        if: steps.stop.outputs.stopped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin evolution3/control
          if git cat-file -e origin/evolution3/control:evolution3/STOP 2>/dev/null; then
            echo 'STOP present; no recursive dispatch.'
            exit 0
          fi
          git show origin/evolution3/control:evolution3/state.json > /tmp/evolution3-state.json
          phase=$(python -c "import json; print(json.load(open('/tmp/evolution3-state.json'))['phase'])")
          retry=$(python -c "import json; print(int(json.load(open('/tmp/evolution3-state.json')).get('retry_count',0)))")
          rc='${{ steps.evolve.outputs.rc }}'
          echo "phase=$phase retry_count=$retry transaction_rc=$rc"
          if [ "$phase" = done ]; then
            echo 'Evolution3 complete.'
            exit 0
          fi
          if [ "$retry" -ge 3 ]; then
            echo 'Three consecutive infrastructure failures; hard stop.'
            exit 1
          fi
          gh workflow run evolution3-elitist.yml --repo "$GITHUB_REPOSITORY" --ref master

      - name: Fail visibly after durable recovery state
        if: steps.stop.outputs.stopped != 'true' && steps.evolve.outputs.rc != '0'
        run: exit 1
