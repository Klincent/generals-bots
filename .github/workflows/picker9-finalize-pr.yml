name: picker9-finalize-pr

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'tmp/picker9-finalize-trigger' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_REF: chatgpt/picker9-opponent-suite-75
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize validated gameplay patch
        run: |
          set -euo pipefail
          python tools/apply_doomguard_concentration_gate.py
          git diff --check
          grep -F 'doom_eta_now<=6?15:25' competition/agents/juraj_v35_cpp/main.cpp
          grep -F 'late_finish=o.turn>=900' competition/agents/juraj_v35_cpp/main.cpp
          if grep -F 'o.turn>=1000||o.opp_army' competition/agents/juraj_v35_cpp/main.cpp; then
            echo 'obsolete turn>=1000 eligibility experiment still present' >&2
            exit 1
          fi
      - name: Test and build materialized candidate
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
      - name: Commit materialized main.cpp
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git add competition/agents/juraj_v35_cpp/main.cpp
          git commit -m 'picker9: gate doomguard and launch late finisher' || true
          git push origin HEAD:${CANDIDATE_REF}
          git rev-parse HEAD | tee /tmp/final_sha.txt
      - name: Package final submission
        run: |
          set -euo pipefail
          mkdir -p /tmp/package/juraj_v35
          cp competition/agents/juraj_v35_cpp/{main.cpp,core.hpp,build.sh,run.sh} /tmp/package/juraj_v35/
          cat > /tmp/package/VALIDATION.txt <<'EOF'
          Hard historical holdout: 59W 7D 6L / 72 = 81.94% raw wins.
          Exact picker9 baseline 734355a44adf76f274892bf13804d638c52869b0: 49W 12D 11L / 72 = 68.06%.
          Per-archetype candidate raw win rates: champion 75.00%, defense 83.33%, heuristic 75.00%, logistics 83.33%, attack-pass 91.67%, search-refactor 83.33%.
          Zero errors and zero illegal actions in the validated historical matrix.
          Key changes: DoomGuard 25% concentration gate outside ETA<=6; late-finisher launch after turn 900 at max(70, 2*enemy-general-army+15).
          EOF
          (cd /tmp/package && zip -qr picker9_8194_submission.zip juraj_v35 VALIDATION.txt)
          sha256sum /tmp/package/picker9_8194_submission.zip | tee /tmp/package/picker9_8194_submission.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: picker9-8194-final-submission
          path: /tmp/package
          retention-days: 14
