name: V3.5 hardening layer A/B

on:
  push:
    branches: [v35-heuristic-rebuild]
    paths:
      - '.github/workflows/v35-hardening-layer-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layer-ab:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: champion
            sha: 4f0fac768a8fc4479d45347a3ecbdbfedd6aef05
          - label: castle-live-economy
            sha: f692246b0eea0b164ad23b2fe39231202647d0e3
          - label: opening-stall
            sha: 1688cd2ba9c63e574cf179cbc58df9068606cce1
          - label: defense
            sha: 3029656e7f5216455cc6350cf84b726d8943078c
          - label: conversion
            sha: 3716ab7e823212c7074424682250b152eed11592
    env:
      SDL_VIDEODRIVER: dummy
      BASELINE_SHA: 2ed9e8bbcf76b36c5276013afc356118fccc8b6e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize candidate and exact V3.4
        run: |
          set -euo pipefail
          rm -rf .diag-candidate .diag-v34
          mkdir -p .diag-candidate .diag-v34
          git archive '${{ matrix.sha }}' competition/agents/juraj_v35_cpp | tar -x -C .diag-candidate
          git archive "$BASELINE_SHA" competition/agents/juraj_cpp | tar -x -C .diag-v34
          .diag-candidate/competition/agents/juraj_v35_cpp/build.sh
          .diag-v34/competition/agents/juraj_cpp/build.sh
      - name: Install benchmark engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps
      - name: Reused-seed causal benchmark
        run: |
          set -euo pipefail
          OUT='layer-ab/${{ matrix.label }}'
          mkdir -p "$OUT"
          PYTHONPATH=. python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate .diag-candidate/competition/agents/juraj_v35_cpp/run.sh \
            --baseline .diag-v34/competition/agents/juraj_cpp/run.sh \
            --start 22200 --seeds 20 --output "$OUT" --diagnostics
          python - <<'PY'
          import json
          p='layer-ab/${{ matrix.label }}/summary.json'
          s=json.load(open(p))
          print('LAYER_AB', '${{ matrix.label }}', '${{ matrix.sha }}', json.dumps(s, sort_keys=True))
          assert s['errors']==0
          assert s['illegal_actions']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v35-layer-ab-${{ matrix.label }}
          path: layer-ab/${{ matrix.label }}/
          if-no-files-found: error
