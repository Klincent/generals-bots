name: v36-clean-cycle-benchmark-pr
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  test-benchmark:
    if: ${{ github.head_ref == 'juraj-v3.6-cycle-only-clean' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 61bf6184dda66355170156d6d8b08be5511e4d36
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.6-cycle-only-clean
          fetch-depth: 0
      - name: Apply only requested directed-edge cycle semantics
        run: python tools/apply_v36_clean_cycle_only.py
      - name: Unit and build smoke
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: pip install -e .
      - name: Build exact baseline
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/v36-base "$BASE_SHA"
          bash /tmp/v36-base/competition/agents/juraj_v35_cpp/build.sh
      - name: Run 40-game paired benchmark
        run: |
          set -euo pipefail
          cat > /tmp/run-candidate.sh <<EOF
          #!/usr/bin/env bash
          export V35_EDGE_PICKER_THRESHOLD=16
          export V36_EDGE_PICKER_MIN_EFFICIENCY=2.0
          exec "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "\$@"
          EOF
          cat > /tmp/run-baseline.sh <<EOF
          #!/usr/bin/env bash
          export V35_EDGE_PICKER_THRESHOLD=16
          export V36_EDGE_PICKER_MIN_EFFICIENCY=2.0
          exec "/tmp/v36-base/competition/agents/juraj_v35_cpp/run.sh" "\$@"
          EOF
          chmod +x /tmp/run-candidate.sh /tmp/run-baseline.sh
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/run-candidate.sh --baseline /tmp/run-baseline.sh \
            --start 24200 --seeds 20 --output /tmp/v36-clean-cycle-benchmark
          echo '=== CLEAN CYCLE BENCHMARK SUMMARY ==='
          cat /tmp/v36-clean-cycle-benchmark/summary.json
      - name: Commit tested source to feature branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competition/agents/juraj_v35_cpp/core.hpp \
                  competition/agents/juraj_v35_cpp/main.cpp \
                  competition/agents/juraj_v35_cpp/test_core.cpp
          git commit -m 'V3.6: clean four-move directed-edge cycle guard'
          git push origin HEAD:juraj-v3.6-cycle-only-clean
