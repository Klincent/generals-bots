name: v36-edge-picker-economics

on:
  push:
    branches: [juraj-v3.6-edge-picker-economics]
  workflow_dispatch:

permissions:
  contents: write

env:
  CHAMPION_SHA: 4f0fac768a8fc4479d45347a3ecbdbfedd6aef05
  CURRENT_SUBMISSION_SHA: 5043c64ed62ad48f5aa2fa6690ac73795601fe75
  LIFECYCLE_SHA: e43b19f7023a7a67fc668e7ca2374f5837abbd01
  SDL_VIDEODRIVER: dummy

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.sha.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.6-edge-picker-economics
          fetch-depth: 0
      - name: Verify lifecycle ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CHAMPION_SHA" HEAD
          git merge-base --is-ancestor "$CURRENT_SUBMISSION_SHA" HEAD
          git merge-base --is-ancestor "$LIFECYCLE_SHA" HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply picker economics
        run: python tools/apply_v36_picker_economics.py
      - name: Install engine dependencies
        run: pip install -e .
      - name: Run V3.5 and V3.6 regressions
        run: bash competition/agents/juraj_v35_cpp/test.sh
      - name: Build candidate
        run: bash competition/agents/juraj_v35_cpp/build.sh
      - name: Commit and push tested implementation
        id: sha
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competition/agents/juraj_v35_cpp/main.cpp competition/agents/juraj_v35_cpp/test_picker.cpp competition/agents/juraj_v35_cpp/test_picker_economics.cpp competition/agents/juraj_v35_cpp/test.sh
          if ! git diff --cached --quiet; then
            git commit -m "V3.6: gate edge picker by ray-local economics"
            git push origin HEAD:juraj-v3.6-edge-picker-economics
          fi
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: materialize
    strategy:
      fail-fast: false
      matrix:
        threshold: [8, 12, 16, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.6-edge-picker-economics
          fetch-depth: 0
      - name: Pin tested candidate
        run: |
          set -euo pipefail
          git fetch origin juraj-v3.6-edge-picker-economics
          git checkout --detach "${{ needs.materialize.outputs.candidate_sha }}"
          test "$(git rev-parse HEAD)" = "${{ needs.materialize.outputs.candidate_sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine dependencies
        run: pip install -e .
      - name: Build candidate and pinned baselines
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/build.sh
          git worktree add --detach /tmp/lifecycle "$LIFECYCLE_SHA"
          bash /tmp/lifecycle/competition/agents/juraj_v35_cpp/build.sh
          git worktree add --detach /tmp/current "$CURRENT_SUBMISSION_SHA"
          bash /tmp/current/competition/agents/juraj_v35_cpp/build.sh
          git worktree add --detach /tmp/champion "$CHAMPION_SHA"
          bash /tmp/champion/competition/agents/juraj_v35_cpp/build.sh
          cat > /tmp/run-economic-picker.sh <<EOF
          #!/usr/bin/env bash
          export V35_EDGE_PICKER_THRESHOLD=${{ matrix.threshold }}
          export V36_EDGE_PICKER_MIN_EFFICIENCY=2.0
          exec "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "\$@"
          EOF
          chmod +x /tmp/run-economic-picker.sh
      - name: H2H against lifecycle picker
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/run-economic-picker.sh \
            --baseline /tmp/lifecycle/competition/agents/juraj_v35_cpp/run.sh \
            --start 22800 --seeds 20 --output /tmp/vs-lifecycle
      - name: H2H against current submission
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/run-economic-picker.sh \
            --baseline /tmp/current/competition/agents/juraj_v35_cpp/run.sh \
            --start 22800 --seeds 20 --output /tmp/vs-current
      - name: H2H against immutable champion
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/run-economic-picker.sh \
            --baseline /tmp/champion/competition/agents/juraj_v35_cpp/run.sh \
            --start 22800 --seeds 20 --output /tmp/vs-champion
      - name: Aggregate economics telemetry
        env:
          THRESHOLD: ${{ matrix.threshold }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          pat=re.compile(r'\[v36_picker\] threshold=(\d+) min_eff=([0-9.]+) starts=(\d+) completions=(\d+) moves=(\d+) delivered=(\d+) aborts=(\d+) active=(\d+) blocked_ticks=(\d+) lost_aborts=(\d+) depleted_aborts=(\d+) source_guard=(\d+) critical_preempt_moves=(\d+) mass_rejects=(\d+) efficiency_rejects=(\d+) planned_mass=(\d+) planned_moves=(\d+)')
          vals=[]
          for line in Path('/tmp/vs-current/games.jsonl').read_text().splitlines():
              row=json.loads(line)
              for m in pat.finditer(row.get('stderr','')):
                  g=m.groups(); vals.append((int(g[0]),float(g[1]),*map(int,g[2:])))
          n=max(1,len(vals))
          def mean(i): return sum(v[i] for v in vals)/n
          starts=sum(v[2] for v in vals); comps=sum(v[3] for v in vals)
          tele={
              'samples':len(vals), 'min_efficiency':2.0,
              'starts_mean':mean(2), 'completions_mean':mean(3), 'moves_mean':mean(4),
              'delivered_mean':mean(5), 'aborts_mean':mean(6), 'blocked_ticks_mean':mean(8),
              'mass_rejects_mean':mean(13), 'efficiency_rejects_mean':mean(14),
              'planned_mass_mean':mean(15), 'planned_moves_mean':mean(16),
              'completion_ratio':comps/max(1,starts),
              'delivered_per_picker_move':sum(v[5] for v in vals)/max(1,sum(v[4] for v in vals)),
          }
          out={
              'threshold':int(os.environ['THRESHOLD']),
              'vs_lifecycle':json.loads(Path('/tmp/vs-lifecycle/summary.json').read_text()),
              'vs_current':json.loads(Path('/tmp/vs-current/summary.json').read_text()),
              'vs_champion':json.loads(Path('/tmp/vs-champion/summary.json').read_text()),
              'picker':tele,
          }
          d=Path('/tmp/result');d.mkdir(exist_ok=True)
          (d/'result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v36-picker-economics-${{ matrix.threshold }}
          path: |
            /tmp/result/result.json
            /tmp/vs-lifecycle/summary.json
            /tmp/vs-current/summary.json
            /tmp/vs-champion/summary.json
            /tmp/vs-current/selected-traces.json
            /tmp/vs-champion/selected-traces.json

  compare:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v36-picker-economics-*
          path: /tmp/results
      - name: Build economics comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('/tmp/results').glob('*/result.json'):
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda x:x['threshold'])
          print('| T | vs lifecycle | vs current | vs champion | starts | moves | delivered | delivered/move | completion |')
          print('|---:|---:|---:|---:|---:|---:|---:|---:|---:|')
          for r in rows:
              l,c,h,t=r['vs_lifecycle'],r['vs_current'],r['vs_champion'],r['picker']
              print(f"| {r['threshold']} | {l['W']}-{l['D']}-{l['L']} {l['score']:.3f} | {c['W']}-{c['D']}-{c['L']} {c['score']:.3f} | {h['W']}-{h['D']}-{h['L']} {h['score']:.3f} | {t['starts_mean']:.1f} | {t['moves_mean']:.1f} | {t['delivered_mean']:.1f} | {t['delivered_per_picker_move']:.2f} | {t['completion_ratio']:.1%} |")
          Path('/tmp/combined-results.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v36-picker-economics-comparison
          path: /tmp/combined-results.json
