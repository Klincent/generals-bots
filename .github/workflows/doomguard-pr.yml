name: doomguard-pr
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ github.head_ref == 'chatgpt/e50123-doomguard' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      BASE_SHA: e50123cee7d924f0d643acd372a5300971f93917
      PICKER9_SHA: 734355a44adf76f274892bf13804d638c52869b0
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/e50123-doomguard
          fetch-depth: 0
      - name: Apply DoomGuard to exact e50123
        run: |
          set -euo pipefail
          if ! grep -q '\[v35_doomguard\]' competition/agents/juraj_v35_cpp/main.cpp; then
            python tools/apply_e50123_doomguard.py
          fi
          grep -q 'doomguard_active_' competition/agents/juraj_v35_cpp/main.cpp
          grep -q '\[v35_doomguard\]' competition/agents/juraj_v35_cpp/main.cpp
      - name: Unit regression suite and build
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: pip install -e .
      - name: Build exact champion and picker9 pressure proxy
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/champion "$BASE_SHA"
          git worktree add --detach /tmp/picker9 "$PICKER9_SHA"
          bash /tmp/champion/competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/picker9/competition/agents/juraj_v35_cpp/build.sh
          cat >/tmp/doom.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_DOOMGUARD_ENABLED=1
          "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed -u 's/^/[DOOM] /' >&2)
          EOF
          cat >/tmp/champ.sh <<'EOF'
          #!/usr/bin/env bash
          "/tmp/champion/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed -u 's/^/[CHAMP] /' >&2)
          EOF
          cat >/tmp/picker9.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1
          "/tmp/picker9/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed -u 's/^/[P9] /' >&2)
          EOF
          chmod +x /tmp/doom.sh /tmp/champ.sh /tmp/picker9.sh
      - name: Champion preservation screen - 60 games
        run: |
          set -euo pipefail
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/doom.sh --baseline /tmp/champ.sh --start 36000 --seeds 30 --output /tmp/doom/champion
          cat /tmp/doom/champion/summary.json
      - name: Pressure screen vs picker9 - DoomGuard 40 games
        run: |
          set -euo pipefail
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/doom.sh --baseline /tmp/picker9.sh --start 36100 --seeds 20 --output /tmp/doom/doom-vs-p9
          cat /tmp/doom/doom-vs-p9/summary.json
      - name: Pressure control - exact champion vs picker9 40 games
        run: |
          set -euo pipefail
          cd /tmp/champion
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/champ.sh --baseline /tmp/picker9.sh --start 36100 --seeds 20 --output /tmp/doom/champ-vs-p9
          cat /tmp/doom/champ-vs-p9/summary.json
      - name: Summarize DoomGuard activation and gates
        run: |
          python - <<'PY' | tee /tmp/doom/gate.txt
          import json,re
          from pathlib import Path
          base=Path('/tmp/doom')
          preserve=json.loads((base/'champion/summary.json').read_text())
          doom=json.loads((base/'doom-vs-p9/summary.json').read_text())
          control=json.loads((base/'champ-vs-p9/summary.json').read_text())
          games=[json.loads(x) for x in (base/'champion/games.jsonl').read_text().splitlines() if x.strip()]
          starts=moves=windows=active_games=0
          for g in games:
            lines=[x for x in g.get('stderr','').splitlines() if '[DOOM] [v35_doomguard]' in x]
            if not lines: continue
            vals={k:int(v) for k,v in re.findall(r'(\w+)=(-?\d+)',lines[-1])}
            starts+=vals.get('starts',0);moves+=vals.get('moves',0);windows+=vals.get('windows',0)
            active_games+=vals.get('starts',0)>0
          delta=doom['score']-control['score']
          preservation=preserve['score']>=0.475 and preserve['errors']==0 and preserve['illegal_actions']==0
          pressure=delta>=0.0
          print('preserve_score',preserve['score'],'CI',preserve['paired_ci95'])
          print('doom_vs_picker9',doom['score'],'champ_vs_picker9',control['score'],'delta',round(delta,4))
          print('doom_active_games',active_games,'starts',starts,'windows',windows,'moves',moves)
          print('PRESERVATION_GATE', 'PASS' if preservation else 'FAIL')
          print('PRESSURE_GATE', 'PASS' if pressure else 'FAIL')
          print('COMBINE_RECOMMENDATION', 'YES' if preservation and pressure else 'NO')
          PY
      - name: Commit tested DoomGuard source to branch
        run: |
          set -euo pipefail
          if ! git diff --quiet -- competition/agents/juraj_v35_cpp/main.cpp; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add competition/agents/juraj_v35_cpp/main.cpp
            git commit -m 'V3.5: add gated DoomGuard defensive muster'
            git push origin HEAD:chatgpt/e50123-doomguard
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: doomguard-validation
          path: /tmp/doom
          retention-days: 5
