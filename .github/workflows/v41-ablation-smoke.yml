name: V4.1 ablation smoke

on:
  workflow_dispatch:
  push:
    branches: [v41-phase2]
    paths:
      - .github/workflows/v41-ablation-smoke.yml

permissions:
  contents: read
  actions: read

jobs:
  ablations:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/competition:${{ github.workspace }}/competition/training/v4
      SDL_VIDEODRIVER: dummy
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download exact Phase 2 candidate
        uses: actions/download-artifact@v4
        with:
          name: v41-phase2-candidate
          path: /tmp/candidate-artifact
          github-token: ${{ github.token }}
          repository: Klincent/generals-bots
          run-id: 31777528051
      - name: Prepare V4.1 mode directories
        run: |
          for mode in policy tactics off; do
            mkdir -p /tmp/v41-$mode
            cp /tmp/candidate-artifact/v41-candidate/juraj-v41 /tmp/v41-$mode/juraj-v41
            cp /tmp/candidate-artifact/v41-candidate/policy.bin /tmp/v41-$mode/policy.bin
            cp /tmp/candidate-artifact/v41-candidate/tactics.bin /tmp/v41-$mode/tactics.bin
            chmod +x /tmp/v41-$mode/juraj-v41
          done
          cat > /tmp/v41-policy/run.sh <<'SH'
          #!/usr/bin/env bash
          export JURAJ_V4_POLICY=1 JURAJ_V4_TACTICS=0 JURAJ_V4_OPENING=0
          exec "$(dirname "$0")/juraj-v41"
          SH
          cat > /tmp/v41-tactics/run.sh <<'SH'
          #!/usr/bin/env bash
          export JURAJ_V4_POLICY=0 JURAJ_V4_TACTICS=1 JURAJ_V4_OPENING=0
          exec "$(dirname "$0")/juraj-v41"
          SH
          cat > /tmp/v41-off/run.sh <<'SH'
          #!/usr/bin/env bash
          export JURAJ_V4_POLICY=0 JURAJ_V4_TACTICS=0 JURAJ_V4_OPENING=0
          exec "$(dirname "$0")/juraj-v41"
          SH
          chmod +x /tmp/v41-*/run.sh
      - name: Reconstruct exact corrected V3.4 baseline
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/juraj-v3.4:refs/remotes/origin/juraj-v3.4
          test "$(git rev-parse refs/remotes/origin/juraj-v3.4)" = "2ed9e8bbcf76b36c5276013afc356118fccc8b6e"
          mkdir -p /tmp/v34-source /tmp/v34-agent
          git archive 2ed9e8bbcf76b36c5276013afc356118fccc8b6e competition/agents/juraj_cpp | tar -x -C /tmp/v34-source
          python competition/training/v4/prepare_v34_baseline.py \
            --agent-dir /tmp/v34-source/competition/agents/juraj_cpp \
            --output /tmp/v34-agent/main.cpp
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic /tmp/v34-agent/main.cpp -o /tmp/v34-agent/juraj-v34
          cat > /tmp/v34-agent/run.sh <<'SH'
          #!/usr/bin/env bash
          exec "$(dirname "$0")/juraj-v34"
          SH
          chmod +x /tmp/v34-agent/run.sh
      - name: Run policy-only paired smoke
        run: |
          python competition/training/v4/benchmark_v41.py --baseline-run /tmp/v34-agent/run.sh --candidate-run /tmp/v41-policy/run.sh --seed-start 20000 --seed-end 20009 --output /tmp/policy.jsonl --timeout-seconds 180
          python competition/training/v4/aggregate_benchmark_v41.py /tmp/policy.jsonl --output /tmp/policy-summary.json --bootstrap-samples 10000
      - name: Run tactics-only paired smoke
        run: |
          python competition/training/v4/benchmark_v41.py --baseline-run /tmp/v34-agent/run.sh --candidate-run /tmp/v41-tactics/run.sh --seed-start 20000 --seed-end 20009 --output /tmp/tactics.jsonl --timeout-seconds 180
          python competition/training/v4/aggregate_benchmark_v41.py /tmp/tactics.jsonl --output /tmp/tactics-summary.json --bootstrap-samples 10000
      - name: Run OFF/OFF equivalence smoke
        run: |
          python competition/training/v4/benchmark_v41.py --baseline-run /tmp/v34-agent/run.sh --candidate-run /tmp/v41-off/run.sh --seed-start 20000 --seed-end 20009 --output /tmp/off.jsonl --timeout-seconds 180
          python competition/training/v4/aggregate_benchmark_v41.py /tmp/off.jsonl --output /tmp/off-summary.json --bootstrap-samples 10000
      - name: Summarize ablations
        run: |
          python - <<'PY'
          import json
          for name in ('policy','tactics','off'):
              s=json.load(open(f'/tmp/{name}-summary.json'))
              print(name, 'score', s['score'], 'W/D/L', s['wins'], s['draws'], s['losses'], 'CI', s['paired_bootstrap_95ci'])
              if not s['acceptance_ready']:
                  raise SystemExit(f'{name} has errors/incomplete games')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v41-ablation-smoke
          path: |
            /tmp/policy.jsonl
            /tmp/policy-summary.json
            /tmp/tactics.jsonl
            /tmp/tactics-summary.json
            /tmp/off.jsonl
            /tmp/off-summary.json
          retention-days: 14
