name: V4.1 policy scale sweep

on:
  workflow_dispatch:
  push:
    branches: [v41-phase2]
    paths:
      - .github/workflows/v41-policy-scale-sweep.yml

permissions:
  contents: read
  actions: read

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        scale: ['0.15','0.30','0.50','0.75','1.00']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/competition:${{ github.workspace }}/competition/training/v4
      SDL_VIDEODRIVER: dummy
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      POLICY_SCALE: ${{ matrix.scale }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Download exact Phase 2 candidate
        uses: actions/download-artifact@v4
        with:
          name: v41-phase2-candidate
          path: /tmp/candidate-artifact
          github-token: ${{ github.token }}
          repository: Klincent/generals-bots
          run-id: 31777528051
      - name: Prepare scaled policy candidate
        run: |
          mkdir -p /tmp/v41-policy
          cp /tmp/candidate-artifact/v41-candidate/juraj-v41 /tmp/v41-policy/juraj-v41
          cp /tmp/candidate-artifact/v41-candidate/policy.bin /tmp/v41-policy/policy.bin
          chmod +x /tmp/v41-policy/juraj-v41
          cat > /tmp/v41-policy/run.sh <<'SH'
          #!/usr/bin/env bash
          export JURAJ_V4_POLICY=1 JURAJ_V4_TACTICS=0 JURAJ_V4_OPENING=0
          export JURAJ_V4_POLICY_SCALE="${POLICY_SCALE}"
          exec "$(dirname "$0")/juraj-v41"
          SH
          chmod +x /tmp/v41-policy/run.sh
      - name: Reconstruct exact corrected V3.4 baseline
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/juraj-v3.4:refs/remotes/origin/juraj-v3.4
          test "$(git rev-parse refs/remotes/origin/juraj-v3.4)" = "2ed9e8bbcf76b36c5276013afc356118fccc8b6e"
          mkdir -p /tmp/v34-source /tmp/v34-agent
          git archive 2ed9e8bbcf76b36c5276013afc356118fccc8b6e competition/agents/juraj_cpp | tar -x -C /tmp/v34-source
          python competition/training/v4/prepare_v34_baseline.py --agent-dir /tmp/v34-source/competition/agents/juraj_cpp --output /tmp/v34-agent/main.cpp
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic /tmp/v34-agent/main.cpp -o /tmp/v34-agent/juraj-v34
          cat > /tmp/v34-agent/run.sh <<'SH'
          #!/usr/bin/env bash
          exec "$(dirname "$0")/juraj-v34"
          SH
          chmod +x /tmp/v34-agent/run.sh
      - name: Run 20-map scale sweep
        run: |
          python competition/training/v4/benchmark_v41.py \
            --baseline-run /tmp/v34-agent/run.sh \
            --candidate-run /tmp/v41-policy/run.sh \
            --seed-start 20200 --seed-end 20219 \
            --output /tmp/scale-${POLICY_SCALE}.jsonl --timeout-seconds 180
          python competition/training/v4/aggregate_benchmark_v41.py \
            /tmp/scale-${POLICY_SCALE}.jsonl \
            --output /tmp/scale-${POLICY_SCALE}-summary.json \
            --bootstrap-samples 10000
          python - <<'PY'
          import json, os
          s=json.load(open(f"/tmp/scale-{os.environ['POLICY_SCALE']}-summary.json"))
          print('scale', os.environ['POLICY_SCALE'], 'score', s['score'], 'W/D/L', s['wins'], s['draws'], s['losses'], 'CI', s['paired_bootstrap_95ci'], 'seats', s['seat_split'])
          if not s['acceptance_ready'] or s['games_scored'] != 40:
              raise SystemExit('invalid scale sweep result')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v41-policy-scale-${{ matrix.scale }}
          path: |
            /tmp/scale-${{ matrix.scale }}.jsonl
            /tmp/scale-${{ matrix.scale }}-summary.json
          retention-days: 14
