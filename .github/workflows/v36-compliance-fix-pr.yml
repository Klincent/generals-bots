name: v36-compliance-package-pr
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  package:
    if: ${{ github.head_ref == 'juraj-v3.6-compliance-fix' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.6-compliance-fix
          fetch-depth: 0
      - name: Verify and build committed source
        run: |
          set -euo pipefail
          grep -q 'castle_funding_active' competition/agents/juraj_v35_cpp/core.hpp
          grep -q 'picker_start_allowed' competition/agents/juraj_v35_cpp/core.hpp
          grep -q 'picker_cooldown_until_' competition/agents/juraj_v35_cpp/main.cpp
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
      - name: Build submission zip
        run: |
          set -euo pipefail
          rm -rf /tmp/juraj_v36 /tmp/juraj_v36_submission.zip
          mkdir -p /tmp/juraj_v36
          cp competition/agents/juraj_v35_cpp/main.cpp /tmp/juraj_v36/
          cp competition/agents/juraj_v35_cpp/core.hpp /tmp/juraj_v36/
          cp competition/agents/juraj_v35_cpp/build.sh /tmp/juraj_v36/
          cp competition/agents/juraj_v35_cpp/run.sh /tmp/juraj_v36/
          chmod +x /tmp/juraj_v36/build.sh /tmp/juraj_v36/run.sh
          cd /tmp
          zip -r juraj_v36_submission.zip juraj_v36
          sha256sum juraj_v36_submission.zip | tee juraj_v36_submission.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: juraj-v36-submission
          path: |
            /tmp/juraj_v36_submission.zip
            /tmp/juraj_v36_submission.sha256
          retention-days: 3
