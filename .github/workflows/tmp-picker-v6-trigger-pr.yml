name: tmp-picker-v7-trigger-pr

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'tmp/picker-v6-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/e50123-picker-v7-comeback
          fetch-depth: 0
      - name: Install Python deps
        run: python -m pip install -q numpy jax
      - name: Apply v7 comeback picker
        run: python competition/agents/juraj_v35_cpp/apply_picker_v7.py
      - name: Validate tests and zero-picker equivalence
        shell: bash
        run: |
          set -euxo pipefail
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
          git worktree add --detach /tmp/e50123 e50123cee7d924f0d643acd372a5300971f93917
          V35_PICKER_ENABLED=0 python competition/agents/juraj_v35_cpp/equivalence_check.py --candidate competition/agents/juraj_v35_cpp/run.sh --baseline /tmp/e50123/competition/agents/juraj_v35_cpp/run.sh --start 31000 --seeds 3 --jobs 2 --timeout 600 --picker-enabled 0
      - name: Commit implementation
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --quiet -- competition/agents/juraj_v35_cpp/main.cpp; then
            git add competition/agents/juraj_v35_cpp/main.cpp
            git commit -m 'picker-v7: late comeback selective picker'
            git push origin HEAD:chatgpt/e50123-picker-v7-comeback
          fi

  bench:
    if: github.head_ref == 'tmp/picker-v6-trigger'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        start: [31000, 31010, 31020]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/e50123-picker-v7-comeback
          fetch-depth: 0
      - name: Install Python deps
        run: python -m pip install -q numpy jax
      - name: Prepare agents
        shell: bash
        run: |
          set -euxo pipefail
          git worktree add --detach /tmp/e50123 e50123cee7d924f0d643acd372a5300971f93917
          bash competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/e50123/competition/agents/juraj_v35_cpp/build.sh
      - name: Run paired chunk
        env:
          V35_PICKER_GATE: 5
        shell: bash
        run: |
          set -euxo pipefail
          OUT="picker-v7-s${{ matrix.start }}"
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate competition/agents/juraj_v35_cpp/run.sh --baseline /tmp/e50123/competition/agents/juraj_v35_cpp/run.sh --start ${{ matrix.start }} --seeds 10 --output "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: picker-v7-s${{ matrix.start }}
          path: picker-v7-s${{ matrix.start }}
          retention-days: 7

  aggregate:
    if: github.head_ref == 'tmp/picker-v6-trigger'
    needs: [prepare, bench]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: picker-v7-s*
          path: artifacts
      - name: Aggregate v7
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib,random,re,statistics
          games=[]
          for p in sorted(pathlib.Path('artifacts').glob('picker-v7-s*/games.jsonl')):
              games += [json.loads(x) for x in p.read_text().splitlines() if x.strip()]
          valid=[g for g in games if 'result' in g]
          W=sum(g['result']=='win' for g in valid);D=sum(g['result']=='draw' for g in valid);L=sum(g['result']=='loss' for g in valid);score=(W+.5*D)/len(valid)
          by={}
          for g in valid:by.setdefault(g['seed'],[]).append(1 if g['result']=='win' else .5 if g['result']=='draw' else 0)
          paired=[sum(v)/2 for v in by.values() if len(v)==2];rng=random.Random(0x357);boots=sorted(statistics.mean(rng.choice(paired) for _ in paired) for _ in range(10000));q=lambda x:boots[min(len(boots)-1,max(0,round(x*(len(boots)-1))))]
          starts=[];moves=[];delivered=[];completions=[];active=0;active_rows=[]
          for g in valid:
              s=g.get('stderr','');m=re.search(r'\[v36_picker\].*?starts=(\d+).*?completions=(\d+).*?moves=(\d+).*?delivered=(\d+)',s)
              if m:
                  st,co,mv,de=map(int,m.groups());starts.append(st);completions.append(co);moves.append(mv);delivered.append(de)
                  if st: active+=1;active_rows.append([g['seed'],g['candidate_seat'],g['result'],st,co,mv,de])
          mean=lambda x:statistics.mean(x) if x else 0
          out={'games':len(valid),'W':W,'D':D,'L':L,'score':score,'ci95':[q(.025),q(.975)],'errors':sum('error'in g for g in games),'illegal':sum(g.get('candidate_illegal',0) for g in games),'active_games':active,'starts_per_game':mean(starts),'completions_per_game':mean(completions),'moves_per_game':mean(moves),'delivered_per_game':mean(delivered),'active_rows':active_rows}
          pathlib.Path('picker-v7-aggregate.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n');print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: picker-v7-aggregate
          path: picker-v7-aggregate.json
          retention-days: 14
