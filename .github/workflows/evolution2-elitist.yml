name: evolution2-elitist

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/evolution2-elitist.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: evolution2-elitist
  cancel-in-progress: false

jobs:
  one-transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SDL_VIDEODRIVER: dummy
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout evolution2 control
        uses: actions/checkout@v4
        with:
          ref: evolution2/control
          fetch-depth: 0

      - name: Emergency STOP check
        id: stop
        shell: bash
        run: |
          set -euo pipefail
          if [ -e evolution2/STOP ]; then
            echo 'stopped=true' >> "$GITHUB_OUTPUT"
            echo 'evolution2/STOP present; no work performed'
          else
            echo 'stopped=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.stop.outputs.stopped != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize pinned evaluator
        if: steps.stop.outputs.stopped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git archive 2260b6f19d51a14d7c68770677f22d04dfd88022 competition generals | tar -x
          test -s competition/agents/juraj_v35_cpp/paired_benchmark.py
          test -s competition/matchup.py
          grep -q -- '--audit-json' competition/matchup.py
          python -m py_compile competition/agents/juraj_v35_cpp/paired_benchmark.py competition/matchup.py competition/protocol.py

      - name: Install evaluator dependencies
        if: steps.stop.outputs.stopped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps

      - name: Validate elitist orchestrator
        if: steps.stop.outputs.stopped != 'true'
        run: python -m py_compile tools/evolution2_orchestrator.py

      - name: Execute exactly one transaction
        id: evolve
        if: steps.stop.outputs.stopped != 'true'
        shell: bash
        run: |
          set +e
          python tools/evolution2_orchestrator.py 2>&1 | tee /tmp/evolution2.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Read durable state
        if: always() && steps.stop.outputs.stopped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin evolution2/control
          git show origin/evolution2/control:evolution2/state.json | tee /tmp/evolution2-state.json
          echo '### Evolution2 state' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s=json.load(open('/tmp/evolution2-state.json'))
          for k in ('phase','cycle1_attempted','cycle1_promoted','cycle1_rejected','cycle2_attempted','cycle2_x_promoted','cycle2_y_promoted','cycle2_x_rejected','cycle2_y_rejected','cycle2_x_skipped','cycle2_y_skipped','current_x_champion_sha','current_y_champion_sha','retry_count','last_error'):
              print(f'- **{k}**: {s.get(k)}')
          PY

      - name: Upload evidence
        if: always() && steps.stop.outputs.stopped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evolution2-evidence-${{ github.run_number }}
          path: |
            evolution2/baseline/
            evolution2/results/
            evolution2/final/
            evolution2/last-error.txt
            /tmp/evolution2.log
          if-no-files-found: ignore
          retention-days: 90

      - name: Dispatch next transaction
        if: steps.stop.outputs.stopped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin evolution2/control
          if git cat-file -e origin/evolution2/control:evolution2/STOP 2>/dev/null; then
            echo 'STOP present; recursive dispatch disabled.'
            exit 0
          fi
          git show origin/evolution2/control:evolution2/state.json > /tmp/evolution2-state.json
          phase=$(python -c "import json; print(json.load(open('/tmp/evolution2-state.json'))['phase'])")
          retry=$(python -c "import json; print(int(json.load(open('/tmp/evolution2-state.json')).get('retry_count',0)))")
          rc='${{ steps.evolve.outputs.rc }}'
          echo "phase=$phase retry_count=$retry rc=$rc"
          if [ "$phase" = done ]; then exit 0; fi
          if [ "$retry" -ge 3 ]; then echo 'Three consecutive infrastructure failures; hard stop.'; exit 1; fi
          gh workflow run evolution2-elitist.yml --repo "$GITHUB_REPOSITORY" --ref master

      - name: Fail visibly after durable recovery state
        if: steps.stop.outputs.stopped != 'true' && steps.evolve.outputs.rc != '0'
        run: exit 1
