name: evolution2-elitist

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/evolution2-elitist.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: evolution2-elitist
  cancel-in-progress: false

jobs:
  one-transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SDL_VIDEODRIVER: dummy
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout evolution2 control
        uses: actions/checkout@v4
        with:
          ref: evolution2/control
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize pinned competition harness
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin evolution2/start-x-original evolution2/start-y-original
          git archive 2260b6f19d51a14d7c68770677f22d04dfd88022 competition generals | tar -x
          test -s competition/agents/juraj_v35_cpp/paired_benchmark.py
          test -s competition/matchup.py
          grep -q -- '--audit-json' competition/matchup.py
          python -m py_compile competition/agents/juraj_v35_cpp/paired_benchmark.py competition/matchup.py competition/protocol.py

      - name: Install benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps

      - name: Validate elitist engine
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/evolution2_common.py \
            tools/evolution2_mutations.py \
            tools/evolution2_main.py \
            tools/evolution2_cycle2_policy.py \
            tools/evolution2_opponent_policy.py \
            tools/evolution2_entry.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Execute one evolution2 transaction
        id: evolve
        shell: bash
        run: |
          set +e
          python tools/evolution2_entry.py 2>&1 | tee /tmp/evolution2.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report durable state
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin evolution2/control
          git show origin/evolution2/control:evolution2/state.json | tee /tmp/evolution2-state.json
          echo '### Evolution2 state' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s=json.load(open('/tmp/evolution2-state.json'))
          for k in ('phase','cycle1_attempted','cycle1_promoted','cycle1_rejected','cycle2_attempted','cycle2_x_promoted','cycle2_y_promoted','cycle2_x_rejected','cycle2_y_rejected','cycle2_x_skipped','cycle2_y_skipped','current_x_champion_sha','current_y_champion_sha','retry_count','last_error'):
              print(f'- **{k}**: {s.get(k)}')
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: evolution2-evidence-${{ github.run_number }}
          path: |
            evolution2/baseline/
            evolution2/results/
            evolution2/last-error.txt
            /tmp/evolution2.log
          if-no-files-found: warn
          retention-days: 90

      - name: Upload final submission when present
        uses: actions/upload-artifact@v4
        with:
          name: evolution2-final-${{ github.run_number }}
          path: evolution2/final/
          if-no-files-found: ignore
          retention-days: 90

      - name: Decide and dispatch next transaction
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin evolution2/control
          if git cat-file -e origin/evolution2/control:evolution2/STOP 2>/dev/null; then
            echo 'evolution2/STOP is present. Loop remains stopped.'
            exit 0
          fi
          git show origin/evolution2/control:evolution2/state.json > /tmp/evolution2-state.json
          phase=$(python -c "import json; print(json.load(open('/tmp/evolution2-state.json'))['phase'])")
          retry=$(python -c "import json; print(int(json.load(open('/tmp/evolution2-state.json')).get('retry_count',0)))")
          rc='${{ steps.evolve.outputs.rc }}'
          echo "phase=$phase retry_count=$retry transaction_rc=$rc"
          if [ "$phase" = done ]; then
            echo 'Evolution2 complete; no further dispatch.'
            exit 0
          fi
          if [ "$retry" -ge 3 ]; then
            echo 'Three consecutive infrastructure failures; hard stop.'
            exit 1
          fi
          if [ "$rc" != 0 ]; then
            echo "::warning::Evolution2 transaction failed; durable state recorded and one automatic retry will be dispatched."
          fi
          gh workflow run evolution2-elitist.yml --repo "$GITHUB_REPOSITORY" --ref master

# hardened elitist launch with pinned JAX dependencies
