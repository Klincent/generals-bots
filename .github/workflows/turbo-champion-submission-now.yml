name: turbo-champion-submission-now

on:
  push:
    branches: [master]
    paths:
      - 'evolution4/turbo-champion-submission-kick.txt'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout latest stable Turbo champion
        uses: actions/checkout@v4
        with:
          ref: evolution4/turbo-champion
          fetch-depth: 1

      - name: Freeze current champion header into standalone main.cpp
        shell: bash
        run: |
          set -euo pipefail
          cd competition/agents/juraj_v35_cpp
          python - <<'PY'
          from pathlib import Path
          p=Path('main.cpp')
          h=Path('evolution4_genome.hpp').read_text()
          s=p.read_text()
          needle='#include "evolution4_genome.hpp"'
          assert needle in s
          s=s.replace(needle, '// frozen Turbo champion genome follows\n'+h, 1)
          p.write_text(s)
          PY
          ! grep -q '#include "evolution4_genome.hpp"' main.cpp
          rm -f agent
          ./build.sh

      - name: Create exact four-file competition ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          agent=Path('competition/agents/juraj_v35_cpp')
          out=Path('/tmp/juraj_turbo_champion_latest.zip')
          files=['main.cpp','core.hpp','build.sh','run.sh']
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for f in files:
                  data=(agent/f).read_bytes()
                  info=zipfile.ZipInfo(f'juraj_v35/{f}',date_time=(2026,8,24,0,0,0))
                  info.external_attr=(0o755 if f.endswith('.sh') else 0o644)<<16
                  info.compress_type=zipfile.ZIP_DEFLATED
                  z.writestr(info,data)
          names=zipfile.ZipFile(out).namelist()
          expected=[f'juraj_v35/{f}' for f in files]
          assert names==expected,(names,expected)
          sha=hashlib.sha256(out.read_bytes()).hexdigest()
          print('SHA256',sha)
          print('ENTRIES',names)
          Path('/tmp/submission-sha.txt').write_text(sha+'\n')
          PY

      - name: Upload latest Turbo champion submission
        uses: actions/upload-artifact@v4
        with:
          name: juraj-turbo-champion-latest
          path: /tmp/juraj_turbo_champion_latest.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish run marker for chat handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(cat /tmp/submission-sha.txt)
          body=$(printf '{"run_id":%s,"artifact":"juraj-turbo-champion-latest","zip":"juraj_turbo_champion_latest.zip","sha256":"%s"}\n' "$GITHUB_RUN_ID" "$sha")
          content=$(printf '%s' "$body" | base64 -w0)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/evolution4/submission-runs/${GITHUB_RUN_ID}.json" \
            -f message="ci: record Turbo champion submission run ${GITHUB_RUN_ID}" \
            -f content="$content" \
            -f branch="master"
