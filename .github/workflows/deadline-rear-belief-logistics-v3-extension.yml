name: Deadline rear-belief logistics v3 robustness extension

on:
  push:
    branches:
      - deadline/rear-belief-logistics-v3-extension
  workflow_dispatch:

jobs:
  robustness-extension:
    runs-on: ubuntu-24.04
    env:
      SDL_VIDEODRIVER: dummy
      PICKER9_SHA: eea352234ec56d01681e543603c6d6e5db6519a1
      RUSHER_SHA: 8187289deaa1b49391e1cdb41057a99e84f45a98
      EVO4_SHA: 2260b6f19d51a14d7c68770677f22d04dfd88022
      CASTLE_SHA: 58f1d03a6a1df23de094064e66fc0d8cf2287576
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deadline/rear-belief-logistics-v3-extension
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install, apply V3, build
        run: |
          pip install -e .
          python tools/apply_deadline_rear_belief_logistics_v3.py
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
      - name: Build exact opponents
        run: |
          git worktree add --detach /tmp/picker9 "$PICKER9_SHA"
          git worktree add --detach /tmp/rusher "$RUSHER_SHA"
          git worktree add --detach /tmp/evo4 "$EVO4_SHA"
          git worktree add --detach /tmp/castle "$CASTLE_SHA"
          bash /tmp/picker9/competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/rusher/competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/evo4/competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/castle/competition/agents/juraj_v35_cpp/build.sh
      - name: Picker9 fresh extension
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate competition/agents/juraj_v35_cpp/run.sh --baseline /tmp/picker9/competition/agents/juraj_v35_cpp/run.sh --start 46500 --seeds 8 --output /tmp/ext-picker9
          cat /tmp/ext-picker9/summary.json
      - name: Rusher fresh extension
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate competition/agents/juraj_v35_cpp/run.sh --baseline /tmp/rusher/competition/agents/juraj_v35_cpp/run.sh --start 46520 --seeds 8 --output /tmp/ext-rusher
          cat /tmp/ext-rusher/summary.json
      - name: Evolution4 fresh extension
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate competition/agents/juraj_v35_cpp/run.sh --baseline /tmp/evo4/competition/agents/juraj_v35_cpp/run.sh --start 46540 --seeds 8 --output /tmp/ext-evo4
          cat /tmp/ext-evo4/summary.json
      - name: Castle-edge fresh extension
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate competition/agents/juraj_v35_cpp/run.sh --baseline /tmp/castle/competition/agents/juraj_v35_cpp/run.sh --start 46560 --seeds 8 --output /tmp/ext-castle
          cat /tmp/ext-castle/summary.json
      - name: Aggregate extension
        run: |
          python - <<'PY'
          import json
          paths={'picker9':'/tmp/ext-picker9/summary.json','rusher':'/tmp/ext-rusher/summary.json','evolution4':'/tmp/ext-evo4/summary.json','castle_edge':'/tmp/ext-castle/summary.json'}
          out={'opponents':{}}; W=D=L=G=ERR=ILL=0
          for name,p in paths.items():
              d=json.load(open(p)); out['opponents'][name]=d
              W+=d['W']; D+=d['D']; L+=d['L']; G+=d['games']; ERR+=d['errors']; ILL+=d['illegal_actions']
          out.update(W=W,D=D,L=L,games=G,score=(W+0.5*D)/G,errors=ERR,illegal_actions=ILL)
          open('/tmp/v3-extension-aggregate.json','w').write(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Package extension-tested V3
        run: |
          cd competition/agents/juraj_v35_cpp
          zip ../../../submission-rear-belief-logistics-v3-extension.zip main.cpp core.hpp build.sh run.sh
          cd ../../..
          unzip -l submission-rear-belief-logistics-v3-extension.zip
      - uses: actions/upload-artifact@v4
        with:
          name: deadline-rear-belief-logistics-v3-extension
          path: |
            submission-rear-belief-logistics-v3-extension.zip
            /tmp/v3-extension-aggregate.json
            /tmp/ext-picker9/summary.json
            /tmp/ext-rusher/summary.json
            /tmp/ext-evo4/summary.json
            /tmp/ext-castle/summary.json
