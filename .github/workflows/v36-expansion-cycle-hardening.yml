name: v36-expansion-cycle-hardening
on:
  push:
    branches: [juraj-v3.6-expansion-cycle-hardening]
permissions:
  contents: write
jobs:
  apply-directed-edge-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.6-short-cycle-only
          fetch-depth: 0
      - name: Apply exact directed-edge cycle semantics
        run: |
          set -euo pipefail
          python tools/apply_v36_directed_edge_cycle_guard.py
      - name: Unit and build smoke
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
      - name: Commit tested implementation to short-cycle branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competition/agents/juraj_v35_cpp/main.cpp \
                  competition/agents/juraj_v35_cpp/core.hpp \
                  competition/agents/juraj_v35_cpp/test_core.cpp \
                  competition/agents/juraj_v35_cpp/test_stall_hardening.cpp
          if ! git diff --cached --quiet; then
            git commit -m 'V3.6: directed-edge cycle guard'
            git push origin HEAD:juraj-v3.6-short-cycle-only
          fi
