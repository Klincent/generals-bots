name: picker9-v75-h2h-pr

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  h2h:
    if: ${{ github.head_ref == 'tmp/picker9-v75-h2h-trigger' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      FINAL_SHA: 2260b6f19d51a14d7c68770677f22d04dfd88022
      V75_SHA: 9cc3b78a0003dd17079cd2aa8d6439321fedccc0
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FINAL_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine
        run: pip install -e .
      - name: Build exact versions
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/build.sh
          git worktree add --detach /tmp/v75 "$V75_SHA"
          bash /tmp/v75/competition/agents/juraj_v35_cpp/build.sh
          cat >/tmp/final.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1
          export V35_DOOMGUARD_ENABLED=1
          exec "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed 's/^/[FINAL] /' >&2)
          EOF
          cat >/tmp/v75.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1
          export V35_DOOMGUARD_ENABLED=1
          exec "/tmp/v75/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed 's/^/[V75] /' >&2)
          EOF
          chmod +x /tmp/final.sh /tmp/v75.sh
      - name: 50-game paired-seat head-to-head
        run: |
          set -euo pipefail
          OUT=/tmp/final-v75
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/final.sh --baseline /tmp/v75.sh \
            --start 51000 --seeds 25 --output "$OUT"
          cat "$OUT/summary.json"
      - name: Production and behavior diagnostics
        run: |
          python - <<'PY' | tee /tmp/final-v75/production-summary.txt
          import json,re,statistics
          rows=[json.loads(x) for x in open('/tmp/final-v75/games.jsonl')]
          turns=[50,100,150,200,250,300,400,600,800]
          land={k:{t:[] for t in turns} for k in ('FINAL','V75')}
          actions={k:[] for k in ('FINAL','V75')}
          doom={k:[] for k in ('FINAL','V75')}
          muster={k:[] for k in ('FINAL','V75')}
          for g in rows:
              s=g.get('stderr','')
              for who in ('FINAL','V75'):
                  for line in s.splitlines():
                      if not line.startswith(f'[{who}] '): continue
                      x=line[len(who)+3:]
                      if x.startswith('[v35_land]'):
                          d={int(a):int(b) for a,b in re.findall(r'(\d+):(\d+)',x)}
                          for t in turns:
                              if t in d: land[who][t].append(d[t])
                      elif x.startswith('[v35_actions]'): actions[who].append(x)
                      elif x.startswith('[v35_doomguard]'): doom[who].append(x)
                      elif x.startswith('[v36_muster]'): muster[who].append(x)
          print('PRODUCTION LAND SNAPSHOTS (mean owned land; higher -> higher production)')
          for t in turns:
              f=statistics.mean(land['FINAL'][t]) if land['FINAL'][t] else 0
              v=statistics.mean(land['V75'][t]) if land['V75'][t] else 0
              print(f'turn {t}: FINAL={f:.2f} V75={v:.2f} delta={f-v:+.2f}')
          print('trace_counts', {k:{'actions':len(actions[k]),'doom':len(doom[k]),'muster':len(muster[k])} for k in ('FINAL','V75')})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: picker9-final-v75-h2h-50games
          path: /tmp/final-v75
          retention-days: 14
