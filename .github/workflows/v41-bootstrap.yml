name: V4.1 bootstrap (reusable)

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Materialize corrected V4.1 sources
        run: |
          cat competition/training/v4/v41_bundle.part00_0 \
              competition/training/v4/v41_bundle.part00_1_0 \
              competition/training/v4/v41_bundle.part00_1_1 \
              competition/training/v4/v41_bundle.part01 \
              competition/training/v4/v41_bundle.part02 \
              competition/training/v4/v41_bundle.part03 \
              competition/training/v4/v41_bundle.part04 \
            | base64 -d | tar -xzf - -C .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install engine and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Reconstruct corrected runtime and run preflight
        run: |
          python competition/training/v4/prepare_v41_runtime.py --output /tmp/main.v41.cpp
          g++ -O2 -DNDEBUG -std=c++17 -Wall -Wextra -Wpedantic -o /tmp/juraj-v41 /tmp/main.v41.cpp
          PYTHONPATH=.:competition:competition/training/v4 python -m pytest -q \
            competition/training/v4/test_rollout_train.py \
            competition/training/v4/test_github_pipeline.py
      - name: Restore latest compatible state from an earlier PR run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python competition/training/v4/restore_previous_state.py --state-dir training-state
      - name: Initialize checkpoint if no compatible state exists
        run: |
          if [ ! -f training-state/checkpoint.json ]; then
            PYTHONPATH=.:competition:competition/training/v4 python competition/training/v4/rollout_train.py \
              --out training-state --games 0 --target-pairs 0 --max-games 0 \
              --seed-start 10000 --rollouts 4 --horizon 50 --states-per-game 10 \
              --candidates 8 --hash-bits 20 --collect-only
          fi
      - name: Require Run 1 checkpoint before continuation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = Path('training-state')
          cp = json.loads((state / 'checkpoint.json').read_text())
          cfg = cp.get('config', {})
          expected_cfg = {
              'candidates': 8,
              'env_mode': 'competition',
              'feature_schema': 2,
              'hash_bits': 20,
              'horizon': 50,
              'pack_version': 2,
              'rollouts': 4,
              'seed_start': 10000,
              'states_per_game': 10,
          }
          minimum = {
              'games': 3480,
              'raw_rollouts': 1009460,
              'states': 33194,
              'usable_pairs': 760741,
              'data_bytes': 15745049,
          }
          errors = []
          if cfg != expected_cfg:
              errors.append(f'config mismatch: {cfg!r}')
          for key, value in minimum.items():
              if int(cp.get(key, -1)) < value:
                  errors.append(f'{key}={cp.get(key)!r} < required {value}')
          for name in ('rollouts.jsonl.gz', 'policy.bin'):
              if not (state / name).is_file():
                  errors.append(f'missing restored {name}')
          if errors:
              raise SystemExit('REFUSING TO CONTINUE WITHOUT RUN 1 STATE: ' + '; '.join(errors))
          print('Resume guard PASS:', json.dumps({k: cp[k] for k in minimum}, sort_keys=True))
          PY
      - name: Tiny actual competition-engine smoke test
        run: |
          rm -rf smoke-state
          python competition/training/v4/run_github_chunk.py \
            --state-dir smoke-state --target-games 1 --target-pairs 0 --max-games 1 \
            --max-minutes 10 --rollouts 1 --horizon 1 --states-per-game 1 --candidates 4
      - name: Bootstrap summary
        run: |
          echo '## V4.1 bootstrap' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat training-state/checkpoint.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: v41-state-00
          path: training-state/
          retention-days: 14
          if-no-files-found: error
