name: picker9-soft-expansion-history-pr

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  history:
    if: ${{ github.head_ref == 'tmp/picker9-soft-expansion-history-trigger' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        parent:
          - name: v75
            sha: 9cc3b78a0003dd17079cd2aa8d6439321fedccc0
          - name: final
            sha: 2260b6f19d51a14d7c68770677f22d04dfd88022
        opponent:
          - v35-champion-70fresh
          - v35-defense-fresh
          - v35-heuristic-rebuild
          - v35-logistics-recenter
          - juraj-v3.6-iter1-attack-pass
          - juraj-v3.6-search-refactor
    env:
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.parent.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - name: Apply one soft-deficit expansion change and build parent/opponent
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/parent ${{ matrix.parent.sha }}
          OPP='${{ matrix.opponent }}'
          if git rev-parse --verify --quiet "origin/$OPP" >/dev/null; then OREF="origin/$OPP"; else OREF="$OPP"; fi
          git worktree add --detach /tmp/opponent "$OREF"
          python - <<'PY'
          from pathlib import Path
          p=Path('competition/agents/juraj_v35_cpp/main.cpp');s=p.read_text()
          old='production_==ProductionState::SEVERE_DEFICIT?.62:production_==ProductionState::SOFT_DEFICIT?.45:.35'
          new='production_==ProductionState::SEVERE_DEFICIT?.62:production_==ProductionState::SOFT_DEFICIT?.52:.35'
          if old not in s: raise SystemExit('soft expansion share not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          bash competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/parent/competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/opponent/competition/agents/juraj_v35_cpp/build.sh
          cat >/tmp/patched.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1 V35_DOOMGUARD_ENABLED=1
          exec "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@"
          EOF
          cat >/tmp/parent.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1 V35_DOOMGUARD_ENABLED=1
          exec "/tmp/parent/competition/agents/juraj_v35_cpp/run.sh" "$@"
          EOF
          chmod +x /tmp/patched.sh /tmp/parent.sh /tmp/opponent/competition/agents/juraj_v35_cpp/run.sh
      - name: Patched versus historical opponent
        run: |
          SAFE=$(echo '${{ matrix.opponent }}' | tr '/' '_')
          OUT=/tmp/patched-${{ matrix.parent.name }}-${SAFE}
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/patched.sh \
            --baseline /tmp/opponent/competition/agents/juraj_v35_cpp/run.sh \
            --start 54500 --seeds 5 --output "$OUT"
          python - "$OUT/summary.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]));assert s['errors']==0 and s['illegal_actions']==0,s
          PY
      - name: Exact parent versus same historical opponent
        run: |
          SAFE=$(echo '${{ matrix.opponent }}' | tr '/' '_')
          OUT=/tmp/parent-${{ matrix.parent.name }}-${SAFE}
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/parent.sh \
            --baseline /tmp/opponent/competition/agents/juraj_v35_cpp/run.sh \
            --start 54500 --seeds 5 --output "$OUT"
          python - "$OUT/summary.json" <<'PY'
          import json,sys
          s=json.load(open(sys.argv[1]));assert s['errors']==0 and s['illegal_actions']==0,s
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: softhist-${{ matrix.parent.name }}-${{ matrix.opponent }}
          path: /tmp/*-${{ matrix.parent.name }}-*
          retention-days: 14

  aggregate:
    if: ${{ github.head_ref == 'tmp/picker9-soft-expansion-history-trigger' }}
    needs: history
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: softhist-*
          path: /tmp/results
      - name: Aggregate diverse screen
        run: |
          python - <<'PY' | tee /tmp/soft-history-summary.txt
          import json,glob
          opps=['v35-champion-70fresh','v35-defense-fresh','v35-heuristic-rebuild','v35-logistics-recenter','juraj-v3.6-iter1-attack-pass','juraj-v3.6-search-refactor']
          for parent in ('v75','final'):
            tw=td=tl=bw=bd=bl=0
            print(parent)
            for opp in opps:
              safe=opp.replace('/','_')
              pp=glob.glob(f'/tmp/results/**/patched-{parent}-{safe}/summary.json',recursive=True)
              bp=glob.glob(f'/tmp/results/**/parent-{parent}-{safe}/summary.json',recursive=True)
              a=json.load(open(pp[0])); b=json.load(open(bp[0]))
              ag=a['games'];bg=b['games'];ascore=(a['W']+.5*a['D'])/ag;bscore=(b['W']+.5*b['D'])/bg
              print(f'  {opp}: patched {a["W"]}/{a["D"]}/{a["L"]} score={ascore:.3f}; parent {b["W"]}/{b["D"]}/{b["L"]} score={bscore:.3f}; delta={ascore-bscore:+.3f}')
              tw+=a['W'];td+=a['D'];tl+=a['L'];bw+=b['W'];bd+=b['D'];bl+=b['L']
            tn=tw+td+tl;bn=bw+bd+bl
            print(f'  TOTAL patched={tw}/{td}/{tl} score={(tw+.5*td)/tn:.4f}; parent={bw}/{bd}/{bl} score={(bw+.5*bd)/bn:.4f}; delta={(tw+.5*td)/tn-(bw+.5*bd)/bn:+.4f}')
          PY
          mkdir -p /tmp/summary && cp /tmp/soft-history-summary.txt /tmp/summary/
      - uses: actions/upload-artifact@v4
        with:
          name: picker9-soft-expansion-history-summary
          path: /tmp/summary
          retention-days: 14
