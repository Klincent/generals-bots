name: V4.1 cloud rollout training

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v41-training-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    uses: ./.github/workflows/v41-bootstrap.yml
  train_01:
    needs: bootstrap
    uses: ./.github/workflows/v41-chunk.yml
    with: {input_artifact: v41-state-00, output_artifact: v41-state-01, chunk_no: '01'}
  train_02:
    needs: train_01
    uses: ./.github/workflows/v41-chunk.yml
    with: {input_artifact: v41-state-01, output_artifact: v41-state-02, chunk_no: '02'}
  train_03:
    needs: train_02
    uses: ./.github/workflows/v41-chunk.yml
    with: {input_artifact: v41-state-02, output_artifact: v41-state-03, chunk_no: '03'}
  train_04:
    needs: train_03
    uses: ./.github/workflows/v41-chunk.yml
    with: {input_artifact: v41-state-03, output_artifact: v41-state-04, chunk_no: '04'}
  train_05:
    needs: train_04
    uses: ./.github/workflows/v41-chunk.yml
    with: {input_artifact: v41-state-04, output_artifact: v41-state-05, chunk_no: '05'}
  train_06:
    needs: train_05
    uses: ./.github/workflows/v41-chunk.yml
    with: {input_artifact: v41-state-05, output_artifact: v41-state-06, chunk_no: '06'}
  train_07:
    needs: train_06
    uses: ./.github/workflows/v41-chunk.yml
    with: {input_artifact: v41-state-06, output_artifact: v41-state-07, chunk_no: '07'}
  train_08:
    needs: train_07
    uses: ./.github/workflows/v41-chunk.yml
    with: {input_artifact: v41-state-07, output_artifact: v41-state-08, chunk_no: '08'}
  train_09:
    needs: train_08
    uses: ./.github/workflows/v41-chunk.yml
    with: {input_artifact: v41-state-08, output_artifact: v41-state-09, chunk_no: '09'}
  train_10:
    needs: train_09
    uses: ./.github/workflows/v41-chunk.yml
    with: {input_artifact: v41-state-09, output_artifact: v41-state-10, chunk_no: '10'}
  train_11:
    needs: train_10
    uses: ./.github/workflows/v41-chunk.yml
    with: {input_artifact: v41-state-10, output_artifact: v41-state-11, chunk_no: '11'}
  train_12:
    needs: train_11
    uses: ./.github/workflows/v41-chunk.yml
    with: {input_artifact: v41-state-11, output_artifact: v41-state-12, chunk_no: '12'}
  finalize:
    needs: train_12
    uses: ./.github/workflows/v41-finalize.yml
    with: {input_artifact: v41-state-12}
