name: v35-e50123-selective-v3
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ github.head_ref == 'juraj-v35-e50123-selective' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SDL_VIDEODRIVER: dummy
      E501: e50123cee7d924f0d643acd372a5300971f93917
      CHAMPION: v35-champion-70fresh
    steps:
      - uses: actions/checkout@v4
        with: {ref: juraj-v35-e50123-selective, fetch-depth: 0}
      - name: Apply selective integration
        run: python tools/apply_e50123_selective_layer.py
      - name: Verify invariants in source
        run: |
          set -euo pipefail
          M=competition/agents/juraj_v35_cpp/main.cpp; C=competition/agents/juraj_v35_cpp/core.hpp
          grep -q 'owned_castle_history_' "$M"; grep -q 'CASTLE_INVALIDATED' "$M"; grep -q 'tactical_next_logistics' "$M"
          test "$(grep -o 'castles_=plan_castles(g_,general_)' "$M" | wc -l)" -eq 1
          grep -q 'init_sector_exploration()' "$M"; grep -q 'std::array<int,9> sector_target_' "$M"; grep -q 'EdgePickerState picker_' "$M"; grep -q 'edge_picker_threshold_=16' "$M"
          grep -q 'eligible(a,150)' "$C"; grep -q 'eligible(b,250)' "$C"; grep -q 'forecast(o.turn,150,cost1' "$M"; grep -q 'forecast(o.turn,250,cost2' "$M"
          ! grep -q 'force_c1' "$M"
      - name: Unit, invariant and build tests
        run: |
          set -euo pipefail
          cd competition/agents/juraj_v35_cpp
          bash test.sh
          g++ -O2 -std=c++17 -Wall -Wextra -Wpedantic test_selective_invariants.cpp -o test_selective_invariants
          ./test_selective_invariants
          bash build.sh
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare benchmark runners
        run: |
          set -euo pipefail
          pip install -e .
          git worktree add --detach /tmp/champion "$CHAMPION"
          git worktree add --detach /tmp/e501 "$E501"
          bash /tmp/champion/competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/e501/competition/agents/juraj_v35_cpp/build.sh
          cat > /tmp/candidate.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_EDGE_PICKER_THRESHOLD=16 V36_EDGE_PICKER_MIN_EFFICIENCY=2.0
          "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@"
          EOF
          printf '#!/usr/bin/env bash\n"/tmp/champion/competition/agents/juraj_v35_cpp/run.sh" "$@"\n' > /tmp/champion.sh
          printf '#!/usr/bin/env bash\n"/tmp/e501/competition/agents/juraj_v35_cpp/run.sh" "$@"\n' > /tmp/e501.sh
          chmod +x /tmp/candidate.sh /tmp/champion.sh /tmp/e501.sh
      - name: 100 paired games vs champion
        run: |
          mkdir -p /tmp/results
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/candidate.sh --baseline /tmp/champion.sh --start 37000 --seeds 50 --output /tmp/results/champion
          cat /tmp/results/champion/summary.json
      - name: 60 paired games vs exact e50123
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/candidate.sh --baseline /tmp/e501.sh --start 38000 --seeds 30 --output /tmp/results/e501
          cat /tmp/results/e501/summary.json
      - name: Commit exact tested source and package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competition/agents/juraj_v35_cpp/core.hpp competition/agents/juraj_v35_cpp/main.cpp competition/agents/juraj_v35_cpp/test_core.cpp competition/agents/juraj_v35_cpp/test_selective_invariants.cpp tools/apply_e50123_selective_layer.py
          git commit -m 'V3.5 e50123 selective: picker 3x3 exploration anti-cycle recapture'
          git push origin HEAD:juraj-v35-e50123-selective
          mkdir -p /tmp/submission/juraj_v35
          cp competition/agents/juraj_v35_cpp/{main.cpp,core.hpp,build.sh,run.sh} /tmp/submission/juraj_v35/
          (cd /tmp/submission && zip -qr /tmp/juraj_v35_e50123_selective.zip juraj_v35)
          sha256sum /tmp/juraj_v35_e50123_selective.zip | tee /tmp/results/submission.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: v35-e50123-selective-v3-results
          path: |
            /tmp/results
            /tmp/juraj_v35_e50123_selective.zip
          retention-days: 3
