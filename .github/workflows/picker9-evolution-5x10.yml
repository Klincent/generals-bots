name: picker9-evolution-5x10

on:
  push:
    branches:
      - automation/picker9-loop
    paths:
      - tools/picker9_evolution_loop.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picker9-evolution-5x10
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      SDL_VIDEODRIVER: dummy
    steps:
      - name: Checkout permanent loop branch
        uses: actions/checkout@v4
        with:
          ref: automation/picker9-loop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install benchmark dependencies
        run: pip install -e .

      - name: Fetch all historical opponents
        run: git fetch origin --prune --tags

      - name: Run five outer blocks of ten evolution iterations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Evolution Loop'
          git config user.email 'actions@users.noreply.github.com'
          mkdir -p /tmp/picker9-evolution-artifacts
          for outer in 1 2 3 4 5; do
            echo "===== OUTER BLOCK ${outer}/5 : 10x build-test-loss-defense-attack-retest ====="
            python tools/picker9_evolution_loop.py --outer "$outer" | tee "/tmp/picker9-evolution-artifacts/outer-${outer}.log"
            cp tools/picker9_evolution_state.json "/tmp/picker9-evolution-artifacts/state-after-${outer}.json"
            cp /tmp/picker9_evolution_result.json "/tmp/picker9-evolution-artifacts/regression-${outer}.json"
            git add tools/picker9_evolution_state.json
            if ! git diff --cached --quiet; then
              git commit -m "ci: checkpoint picker9 evolution outer ${outer}/5"
              git push origin HEAD:automation/picker9-loop
            fi
          done

      - name: Enforce final safety gate
        run: |
          python - <<'PY'
          import json
          s=json.load(open('tools/picker9_evolution_state.json'))
          assert s['outer_done']==5, s.get('outer_done')
          r=s['last_regression']['aggregate']
          assert r['errors']==0, r
          assert r['illegal_actions']==0, r
          print('FINAL_REGRESSION',json.dumps(r,sort_keys=True))
          PY

      - name: Upload all five regression checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picker9-evolution-5x10-${{ github.run_number }}
          path: |
            /tmp/picker9-evolution-artifacts
            tools/picker9_evolution_state.json
          retention-days: 30
