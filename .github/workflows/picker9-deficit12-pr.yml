name: picker9-deficit12-pr

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  parent-delta:
    if: ${{ github.head_ref == 'tmp/picker9-deficit12-trigger' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: v75
            sha: 9cc3b78a0003dd17079cd2aa8d6439321fedccc0
          - name: final
            sha: 2260b6f19d51a14d7c68770677f22d04dfd88022
    env:
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - name: Apply only severe deficit threshold 12
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/parent ${{ matrix.sha }}
          python - <<'PY'
          from pathlib import Path
          p=Path('competition/agents/juraj_v35_cpp/main.cpp');s=p.read_text()
          old='else if(gap>18)production_=ProductionState::SEVERE_DEFICIT;'
          new='else if(gap>12)production_=ProductionState::SEVERE_DEFICIT;'
          if old not in s: raise SystemExit('severe threshold not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          bash competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/parent/competition/agents/juraj_v35_cpp/build.sh
          cat >/tmp/patched.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1 V35_DOOMGUARD_ENABLED=1
          exec "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed 's/^/[PATCHED] /' >&2)
          EOF
          cat >/tmp/parent.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1 V35_DOOMGUARD_ENABLED=1
          exec "/tmp/parent/competition/agents/juraj_v35_cpp/run.sh" "$@" 2> >(sed 's/^/[PARENT] /' >&2)
          EOF
          chmod +x /tmp/patched.sh /tmp/parent.sh
      - name: Paired parent screen
        run: |
          OUT=/tmp/${{ matrix.name }}-def12
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/patched.sh --baseline /tmp/parent.sh --start 53300 --seeds 10 --output "$OUT"
          cat "$OUT/summary.json"
      - name: Production snapshots
        run: |
          python - <<'PY' | tee /tmp/${{ matrix.name }}-def12/production.txt
          import json,re,statistics
          rows=[json.loads(x) for x in open('/tmp/${{ matrix.name }}-def12/games.jsonl')]
          turns=[50,100,150,200,250,300,400,600,800]
          d={k:{t:[] for t in turns} for k in ('PATCHED','PARENT')}
          for g in rows:
            for line in g.get('stderr','').splitlines():
              for who in d:
                if line.startswith(f'[{who}] [v35_land]'):
                  vals={int(a):int(b) for a,b in re.findall(r'(\d+):(\d+)',line)}
                  for t in turns:
                    if t in vals:d[who][t].append(vals[t])
          for t in turns:
            a=statistics.mean(d['PATCHED'][t]) if d['PATCHED'][t] else 0
            b=statistics.mean(d['PARENT'][t]) if d['PARENT'][t] else 0
            print(f'{t} patched={a:.2f} parent={b:.2f} delta={a-b:+.2f}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: def12-${{ matrix.name }}
          path: /tmp/${{ matrix.name }}-def12
          retention-days: 14
