name: V4.1 Phase 1 verification

on:
  push:
    branches:
      - v41-phase1
  workflow_dispatch:

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: dummy
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/competition:${{ github.workspace }}/competition/training/v4
  XLA_PYTHON_CLIENT_PREALLOCATE: 'false'

jobs:
  phase1-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Phase 1 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.4.6 \
            jax==0.11.0 \
            pytest
          python -m pip install -e . --no-deps

      - name: Print numeric dependency versions
        run: |
          python - <<'PY'
          import jax
          import jaxlib
          import numpy
          print("numpy", numpy.__version__)
          print("jax", jax.__version__)
          print("jaxlib", jaxlib.__version__)
          PY

      - name: Check Python syntax
        run: python -m py_compile competition/training/v4/*.py

      - name: Run Phase 1 tests
        run: |
          pytest -q \
            competition/training/v4/test_fit_policy_v41.py \
            competition/training/v4/test_github_pipeline.py \
            competition/training/v4/test_rollout_train.py

      - name: Materialize pinned V3.4 runtime source
        run: |
          git fetch --no-tags --depth=1 origin \
            refs/heads/juraj-v3.4:refs/remotes/origin/juraj-v3.4
          V34_SHA="$(git rev-parse refs/remotes/origin/juraj-v3.4)"
          test "$V34_SHA" = \
            "2ed9e8bbcf76b36c5276013afc356118fccc8b6e"

          rm -rf /tmp/v34-source
          mkdir -p /tmp/v34-source
          git archive \
            2ed9e8bbcf76b36c5276013afc356118fccc8b6e \
            competition/agents/juraj_cpp \
            | tar -x -C /tmp/v34-source

          AGENT_DIR="/tmp/v34-source/competition/agents/juraj_cpp"
          test -s "$AGENT_DIR/main.cpp"
          test "$(find "$AGENT_DIR" -maxdepth 1 -name 'v34_part*.inc' | wc -l)" -eq 8

      - name: Reconstruct V4.1 runtime
        run: |
          python competition/training/v4/prepare_v41_runtime.py \
            --agent-dir /tmp/v34-source/competition/agents/juraj_cpp \
            --output /tmp/main.v41.cpp

      - name: Compile reconstructed C++ runtime
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic \
            /tmp/main.v41.cpp \
            -o /tmp/v41-agent-bin
