name: evolution4-turbo-pause

on:
  push:
    branches: [master]
    paths:
      - 'evolution4/turbo-pause-kick.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolution4-turbo
  cancel-in-progress: true

jobs:
  pause-barrier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evolution4/turbo-structural
          fetch-depth: 1
      - name: Verify Turbo STOP
        shell: bash
        run: |
          set -euo pipefail
          test -f evolution4/STOP
          echo 'Turbo Evolution is PAUSED. No evolution transaction is executed by this workflow.'
          cat evolution4/STOP
