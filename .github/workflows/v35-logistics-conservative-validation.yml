name: V3.5 conservative logistics causal validation

on:
  workflow_dispatch:
  push:
    branches: [v35-logistics-conservative]
    paths:
      - '.github/workflows/v35-logistics-conservative-validation.yml'

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: dummy
  CANDIDATE_SHA: d83a7ca3cc6ac4f22688244100ae763cdaa6ff0d
  CHAMPION_SHA: 4f0fac768a8fc4479d45347a3ecbdbfedd6aef05
  V34_SHA: 2ed9e8bbcf76b36c5276013afc356118fccc8b6e

jobs:
  vs-v34:
    name: Candidate vs V3.4 — 22350..22399
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      score: ${{ steps.result.outputs.score }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Materialize exact agents and prove candidate identity
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cand .opp result
          mkdir -p .cand .opp result
          git archive "$CANDIDATE_SHA" competition/agents/juraj_v35_cpp | tar -x -C .cand
          git archive "$V34_SHA" competition/agents/juraj_cpp | tar -x -C .opp
          mapfile -t changed < <(git diff --name-only "$CHAMPION_SHA" "$CANDIDATE_SHA" -- competition/agents/juraj_v35_cpp)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'competition/agents/juraj_v35_cpp/main.cpp'
          grep -Fq 'off_axis_rear=edge<=2' .cand/competition/agents/juraj_v35_cpp/main.cpp
          grep -Fq 'axis_gain=detour_y<detour_x' .cand/competition/agents/juraj_v35_cpp/main.cpp
          ! grep -Eq 'staging_point|rear_pressure|behind_rally|castle_opportunity_|castle_target_' .cand/competition/agents/juraj_v35_cpp/main.cpp
          cmp .cand/competition/agents/juraj_v35_cpp/core.hpp <(git show "$CHAMPION_SHA":competition/agents/juraj_v35_cpp/core.hpp)
      - name: Build
        run: |
          .cand/competition/agents/juraj_v35_cpp/test.sh
          .cand/competition/agents/juraj_v35_cpp/build.sh
          .opp/competition/agents/juraj_cpp/build.sh
      - name: Install benchmark engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps
      - name: Benchmark 100 paired games
        run: |
          PYTHONPATH=. python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate .cand/competition/agents/juraj_v35_cpp/run.sh --baseline .opp/competition/agents/juraj_cpp/run.sh --start 22350 --seeds 50 --output result
      - name: Result
        id: result
        run: |
          python - <<'PY'
          import json, os
          s=json.load(open('result/summary.json'))
          assert s['games']==100 and s['errors']==0 and s['illegal_actions']==0, s
          score=float(s['score'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'score={score:.6f}\n')
          print('CANDIDATE_V34', json.dumps(s,sort_keys=True))
          print(f'Champion same-seed reference: 61.50%; delta={100*(score-.615):+.2f} pp')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v35-conservative-v34-22350, path: result/}

  direct-22350:
    name: Candidate vs Champion — 22350..22399
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      score: ${{ steps.result.outputs.score }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Materialize candidate and champion
        run: |
          rm -rf .cand .champ result && mkdir -p .cand .champ result
          git archive "$CANDIDATE_SHA" competition/agents/juraj_v35_cpp | tar -x -C .cand
          git archive "$CHAMPION_SHA" competition/agents/juraj_v35_cpp | tar -x -C .champ
          .cand/competition/agents/juraj_v35_cpp/build.sh
          .champ/competition/agents/juraj_v35_cpp/build.sh
      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps
      - name: Direct paired benchmark
        run: |
          PYTHONPATH=. python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate .cand/competition/agents/juraj_v35_cpp/run.sh --baseline .champ/competition/agents/juraj_v35_cpp/run.sh --start 22350 --seeds 50 --output result
      - name: Result
        id: result
        run: |
          python - <<'PY'
          import json,os
          s=json.load(open('result/summary.json'));assert s['games']==100 and s['errors']==0 and s['illegal_actions']==0,s
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"score={float(s['score']):.6f}\n")
          print('DIRECT_22350',json.dumps(s,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v35-conservative-direct-22350, path: result/}

  direct-22200:
    name: Candidate vs Champion — 22200..22249
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      score: ${{ steps.result.outputs.score }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Materialize candidate and champion
        run: |
          rm -rf .cand .champ result && mkdir -p .cand .champ result
          git archive "$CANDIDATE_SHA" competition/agents/juraj_v35_cpp | tar -x -C .cand
          git archive "$CHAMPION_SHA" competition/agents/juraj_v35_cpp | tar -x -C .champ
          .cand/competition/agents/juraj_v35_cpp/build.sh
          .champ/competition/agents/juraj_v35_cpp/build.sh
      - name: Install engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps
      - name: Direct paired benchmark
        run: |
          PYTHONPATH=. python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate .cand/competition/agents/juraj_v35_cpp/run.sh --baseline .champ/competition/agents/juraj_v35_cpp/run.sh --start 22200 --seeds 50 --output result
      - name: Result
        id: result
        run: |
          python - <<'PY'
          import json,os
          s=json.load(open('result/summary.json'));assert s['games']==100 and s['errors']==0 and s['illegal_actions']==0,s
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"score={float(s['score']):.6f}\n")
          print('DIRECT_22200',json.dumps(s,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v35-conservative-direct-22200, path: result/}

  package:
    name: Package submission if causal gates pass
    needs: [vs-v34, direct-22350, direct-22200]
    if: needs.vs-v34.result == 'success' && needs.direct-22350.result == 'success' && needs.direct-22200.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Evaluate gates
        id: gate
        env:
          V34_SCORE: ${{ needs.vs-v34.outputs.score }}
          D22350: ${{ needs.direct-22350.outputs.score }}
          D22200: ${{ needs.direct-22200.outputs.score }}
        run: |
          python - <<'PY'
          import os
          v=float(os.environ['V34_SCORE']); a=float(os.environ['D22350']); b=float(os.environ['D22200'])
          avg=(a+b)/2
          ok=v>=.595 and a>=.50 and b>=.50 and avg>=.52
          print(f'v34={v:.4f} direct22350={a:.4f} direct22200={b:.4f} direct_avg={avg:.4f} package={ok}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"ok={str(ok).lower()}\n")
          PY
      - name: Build minimal submission ZIP
        if: steps.gate.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf submission verify && mkdir submission verify
          for f in main.cpp core.hpp build.sh run.sh; do git show "$CANDIDATE_SHA:competition/agents/juraj_v35_cpp/$f" > "submission/$f"; done
          chmod +x submission/build.sh submission/run.sh
          (cd submission && zip -X ../juraj_v35_conservative_d83a7ca.zip main.cpp core.hpp build.sh run.sh)
          unzip -q juraj_v35_conservative_d83a7ca.zip -d verify
          (cd verify && ./build.sh)
          test -x verify/agent
          sha256sum juraj_v35_conservative_d83a7ca.zip | tee submission/SHA256.txt
          printf 'candidate=%s\nchampion=%s\nv34=%s\n' "$CANDIDATE_SHA" "$CHAMPION_SHA" "$V34_SHA" > submission/MANIFEST.txt
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          name: juraj-v35-conservative-submission-d83a7ca
          path: |
            juraj_v35_conservative_d83a7ca.zip
            submission/SHA256.txt
            submission/MANIFEST.txt
          if-no-files-found: error
