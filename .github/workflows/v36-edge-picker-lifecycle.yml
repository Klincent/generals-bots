name: v36-edge-picker-lifecycle

on:
  push:
    branches: [juraj-v3.6-edge-picker-lifecycle]
  workflow_dispatch:

permissions:
  contents: write

env:
  CHAMPION_SHA: 4f0fac768a8fc4479d45347a3ecbdbfedd6aef05
  CURRENT_SUBMISSION_SHA: 5043c64ed62ad48f5aa2fa6690ac73795601fe75
  BROKEN_PICKER_SHA: 9fd1c267bfb0f7cdea6f465dcfd6911af4e1c34f
  SDL_VIDEODRIVER: dummy

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.sha.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.6-edge-picker-lifecycle
          fetch-depth: 0
      - name: Verify picker ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CHAMPION_SHA" HEAD
          git merge-base --is-ancestor "$CURRENT_SUBMISSION_SHA" HEAD
          git merge-base --is-ancestor "$BROKEN_PICKER_SHA" HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply resumable picker lifecycle fix
        run: python tools/apply_v36_picker_lifecycle_fix.py
      - name: Install engine dependencies
        run: pip install -e .
      - name: Run V3.5 and picker lifecycle regressions
        run: bash competition/agents/juraj_v35_cpp/test.sh
      - name: Build candidate
        run: bash competition/agents/juraj_v35_cpp/build.sh
      - name: Commit and push tested implementation
        id: sha
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competition/agents/juraj_v35_cpp/main.cpp competition/agents/juraj_v35_cpp/test_picker.cpp
          if ! git diff --cached --quiet; then
            git commit -m "V3.6: make edge picker resumable until general"
            git push origin HEAD:juraj-v3.6-edge-picker-lifecycle
          fi
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: materialize
    strategy:
      fail-fast: false
      matrix:
        threshold: [3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.6-edge-picker-lifecycle
          fetch-depth: 0
      - name: Pin tested candidate
        run: |
          set -euo pipefail
          git fetch origin juraj-v3.6-edge-picker-lifecycle
          git checkout --detach "${{ needs.materialize.outputs.candidate_sha }}"
          test "$(git rev-parse HEAD)" = "${{ needs.materialize.outputs.candidate_sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine dependencies
        run: pip install -e .
      - name: Build candidate and pinned baselines
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/build.sh
          git worktree add --detach /tmp/current "$CURRENT_SUBMISSION_SHA"
          bash /tmp/current/competition/agents/juraj_v35_cpp/build.sh
          git worktree add --detach /tmp/champion "$CHAMPION_SHA"
          bash /tmp/champion/competition/agents/juraj_v35_cpp/build.sh
          git worktree add --detach /tmp/broken "$BROKEN_PICKER_SHA"
          bash /tmp/broken/competition/agents/juraj_v35_cpp/build.sh
          cat > /tmp/run-fixed.sh <<EOF
          #!/usr/bin/env bash
          export V35_EDGE_PICKER_THRESHOLD=${{ matrix.threshold }}
          exec "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "\$@"
          EOF
          cat > /tmp/run-broken.sh <<EOF
          #!/usr/bin/env bash
          export V35_EDGE_PICKER_THRESHOLD=${{ matrix.threshold }}
          exec "/tmp/broken/competition/agents/juraj_v35_cpp/run.sh" "\$@"
          EOF
          chmod +x /tmp/run-fixed.sh /tmp/run-broken.sh
      - name: H2H against broken picker
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/run-fixed.sh --baseline /tmp/run-broken.sh \
            --start 22600 --seeds 20 --output /tmp/vs-broken
      - name: H2H against current submission
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/run-fixed.sh --baseline /tmp/current/competition/agents/juraj_v35_cpp/run.sh \
            --start 22620 --seeds 20 --output /tmp/vs-current
      - name: H2H against immutable champion
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/run-fixed.sh --baseline /tmp/champion/competition/agents/juraj_v35_cpp/run.sh \
            --start 22640 --seeds 20 --output /tmp/vs-champion
      - name: Aggregate lifecycle telemetry
        env:
          THRESHOLD: ${{ matrix.threshold }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          pat=re.compile(r'\[v36_picker\] threshold=(\d+) starts=(\d+) completions=(\d+) moves=(\d+) delivered=(\d+) aborts=(\d+) active=(\d+) blocked_ticks=(\d+) lost_aborts=(\d+) depleted_aborts=(\d+) source_guard=(\d+) critical_preempt_moves=(\d+)')
          vals=[]
          for line in Path('/tmp/vs-current/games.jsonl').read_text().splitlines():
              row=json.loads(line)
              for m in pat.finditer(row.get('stderr','')): vals.append(tuple(map(int,m.groups())))
          n=max(1,len(vals)); starts=sum(v[1] for v in vals); completed=sum(v[2] for v in vals)
          tele={
            'samples':len(vals), 'starts_mean':starts/n, 'completions_mean':completed/n,
            'moves_mean':sum(v[3] for v in vals)/n, 'delivered_mean':sum(v[4] for v in vals)/n,
            'aborts_mean':sum(v[5] for v in vals)/n, 'completion_ratio':completed/max(1,starts),
            'blocked_ticks_mean':sum(v[7] for v in vals)/n, 'lost_aborts_mean':sum(v[8] for v in vals)/n,
            'depleted_aborts_mean':sum(v[9] for v in vals)/n, 'source_guard_mean':sum(v[10] for v in vals)/n,
            'critical_preempt_moves_mean':sum(v[11] for v in vals)/n,
          }
          out={'threshold':int(os.environ['THRESHOLD']), 'picker':tele,
               'vs_broken':json.loads(Path('/tmp/vs-broken/summary.json').read_text()),
               'vs_current':json.loads(Path('/tmp/vs-current/summary.json').read_text()),
               'vs_champion':json.loads(Path('/tmp/vs-champion/summary.json').read_text())}
          d=Path('/tmp/result');d.mkdir(exist_ok=True)
          (d/'result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v36-picker-lifecycle-${{ matrix.threshold }}
          path: |
            /tmp/result/result.json
            /tmp/vs-broken/summary.json
            /tmp/vs-current/summary.json
            /tmp/vs-champion/summary.json

  compare:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v36-picker-lifecycle-*
          path: /tmp/results
      - name: Build lifecycle comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in Path('/tmp/results').glob('*/result.json')]
          rows.sort(key=lambda x:x['threshold'])
          print('|T|vs broken|score|vs current|score|vs champion|score|starts|done|ratio|aborts|blocked|guard|')
          print('|-:|:-:|-:|:-:|-:|:-:|-:|-:|-:|-:|-:|-:|-:|')
          for r in rows:
            b,c,h,t=r['vs_broken'],r['vs_current'],r['vs_champion'],r['picker']
            print(f"|{r['threshold']}|{b['W']}-{b['D']}-{b['L']}|{b['score']:.3f}|{c['W']}-{c['D']}-{c['L']}|{c['score']:.3f}|{h['W']}-{h['D']}-{h['L']}|{h['score']:.3f}|{t['starts_mean']:.1f}|{t['completions_mean']:.1f}|{t['completion_ratio']:.3f}|{t['aborts_mean']:.1f}|{t['blocked_ticks_mean']:.1f}|{t['source_guard_mean']:.1f}|")
          Path('/tmp/lifecycle-comparison.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v36-picker-lifecycle-comparison
          path: /tmp/lifecycle-comparison.json
