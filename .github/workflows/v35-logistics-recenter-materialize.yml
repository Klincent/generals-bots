name: V3.5 materialize logistics recenter candidate

on:
  workflow_dispatch:
  push:
    branches: [v35-logistics-recenter]
    paths:
      - '.github/workflows/v35-logistics-recenter-materialize.yml'

permissions:
  contents: write

env:
  CHAMPION_SHA: 4f0fac768a8fc4479d45347a3ecbdbfedd6aef05

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v35-logistics-recenter

      - name: Prove gameplay is exact champion before patch
        shell: bash
        run: |
          set -euo pipefail
          for f in main.cpp core.hpp build.sh run.sh test.sh test_core.cpp test_agent.cpp paired_benchmark.py; do
            cmp "competition/agents/juraj_v35_cpp/$f" <(git show "${CHAMPION_SHA}:competition/agents/juraj_v35_cpp/$f")
          done
          ! grep -q 'castle_opportunity_' competition/agents/juraj_v35_cpp/main.cpp
          ! grep -q 'castle_target_' competition/agents/juraj_v35_cpp/main.cpp

      - name: Apply narrow logistics/recenter hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('competition/agents/juraj_v35_cpp/main.cpp')
          s = p.read_text()
          anchor = " int tactical_next(const Observation&o,int x,int target)const{int best=-1,bd=INF;for(int d=0;d<4;++d){int y=g_.neighbor(x,d);if(safe_step(o,x,y)&&g_.dist[y][target]<bd)best=y,bd=g_.dist[y][target];}return best;}\n"
          if s.count(anchor) != 1:
              raise SystemExit(f'tactical_next anchor count={s.count(anchor)}')
          helper1 = " int staging_point(int sink)const{if(sink<0||general_<0||g_.dist[general_][sink]>=INF)return sink;int d=g_.dist[general_][sink],steps=meaningful_contact_turn_>=0?std::max(2,d*3/5):std::max(1,d/3);steps=std::min(steps,d);int x=general_;for(int i=0;i<steps&&x!=sink;++i){int y=g_.next[x][sink];if(y<0||y==x)break;x=y;}return x;}\n"
          helper2 = " int rear_pressure(int x,int sink)const{if(x<0||x>=n_)return 0;int r=x/w_,c=x%w_,er=std::min(r,h_-1-r),ec=std::min(c,w_-1-c),edge=std::min(er,ec),score=edge==0?6:edge==1?3:edge==2?1:0;if(er<=1&&ec<=1)score+=5;int deg=g_.degree(x);if(deg<=1)score+=6;else if(deg==2&&edge<=2)score+=2;if(meaningful_contact_turn_>=0&&sink>=0&&general_>=0&&g_.dist[general_][sink]<INF&&g_.dist[general_][x]<INF&&g_.dist[x][sink]<INF){int detour=g_.dist[general_][x]+g_.dist[x][sink]-g_.dist[general_][sink];score+=std::min(10,std::max(0,detour));}return score;}\n"
          s = s.replace(anchor, anchor + helper1 + helper2, 1)
          start = s.find('  const Front*front=fronts_.primary();int sink=')
          end = s.find('  int window_pass=', start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('logistics block anchors not found')
          old = s[start:end]
          if old.count('Reason::REAR_EVACUATION') != 1 or old.count('Reason::WAR_MOBILIZATION') != 1:
              raise SystemExit('unexpected champion logistics block identity')
          new = "  const Front*front=fronts_.primary();int sink=belief_.confirmed()?belief_.confirmed_cell():(front?front->anchor:belief_.top());int rally=staging_point(sink);bool contact_known=meaningful_contact_turn_>=0&&sink>=0;for(int x=0;x<n_;++x)if(source(o,x)){int surplus=o.army[x]-reserve(o,x);if(surplus<=0)continue;int pressure=rear_pressure(x,sink);bool rear=pressure>=3,off_axis=contact_known&&pressure>=5,behind_rally=contact_known&&rally>=0&&rally!=x&&sink>=0&&g_.dist[x][sink]<INF&&g_.dist[rally][sink]<INF&&g_.dist[x][sink]>g_.dist[rally][sink]+1;int target=sink;if(rally>=0&&rally!=x){if(!contact_known&&rear)target=rally;else if(contact_known&&(rear||off_axis||behind_rally)&&g_.dist[x][sink]>=g_.dist[rally][sink])target=rally;}if(target==x)target=sink;int y=target>=0?tactical_next(o,x,target):-1;if(y<0)continue;double flow=double(surplus)/std::max(1,g_.dist[x][target]),pull=pressure*12.+(contact_known?40.:0.)+(behind_rally?20.:0.);if(confirmed_war&&b.war>0)c.push_back({2,x,y,0,flow+((rear||off_axis||behind_rally)?pull:0.),Reason::WAR_MOBILIZATION,false,ActionClass::LOGISTICS,target,front?front->id:-1,PacketRole::FRONT});else if((rear||off_axis||behind_rally)&&b.free+b.search>0)c.push_back({2,x,y,0,double(surplus)+pull,Reason::REAR_EVACUATION,false,ActionClass::LOGISTICS,target,-1,PacketRole::FREE_SURPLUS_RELOCATION});else if(!enemy_seen&&b.search>0)c.push_back({3,x,y,0,flow,Reason::SEARCH_PROGRESS,false,ActionClass::SEARCH,target,-1,PacketRole::SEARCH});}\n"
          s = s[:start] + new + s[end:]
          for token in ('int staging_point(int sink)const', 'int rear_pressure(int x,int sink)const', 'behind_rally=contact_known'):
              if s.count(token) != 1:
                  raise SystemExit(f'expected exactly one {token!r}, got {s.count(token)}')
          for forbidden in ('castle_opportunity_', 'castle_target_', 'CastleOpportunity'):
              if forbidden in s:
                  raise SystemExit(f'forbidden dynamic-castle token present: {forbidden}')
          p.write_text(s)
          PY
          git diff --check
          git diff -- competition/agents/juraj_v35_cpp/main.cpp
          test "$(git diff --name-only "$CHAMPION_SHA" -- competition/agents/juraj_v35_cpp | tr '\n' ' ')" = "competition/agents/juraj_v35_cpp/main.cpp "

      - name: Fast suite and build
        shell: bash
        run: |
          set -euo pipefail
          competition/agents/juraj_v35_cpp/test.sh
          competition/agents/juraj_v35_cpp/build.sh
          test -x competition/agents/juraj_v35_cpp/agent
          rm -f competition/agents/juraj_v35_cpp/agent competition/agents/juraj_v35_cpp/test_core competition/agents/juraj_v35_cpp/test_agent

      - name: Commit immutable gameplay candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competition/agents/juraj_v35_cpp/main.cpp
          test "$(git diff --cached --name-only)" = "competition/agents/juraj_v35_cpp/main.cpp"
          git commit -m 'v35: recenter rear surplus toward opponent corridor'
          git push origin HEAD:v35-logistics-recenter
          echo "GAMEPLAY_COMMIT=$(git rev-parse HEAD)"
          sha256sum competition/agents/juraj_v35_cpp/main.cpp
