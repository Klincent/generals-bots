name: evolution5-cambrian

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'evolution5/kick.txt'

permissions:
  contents: write
  actions: write

concurrency:
  group: evolution5-cambrian
  cancel-in-progress: false

jobs:
  cutover-stop:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest Cambrian durable control
        uses: actions/checkout@v4
        with:
          ref: evolution5/cambrian-league
          fetch-depth: 0
      - name: Stop old Cambrian after prior transaction completed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ChatGPT
          git config user.email actions@users.noreply.github.com
          git fetch --no-tags origin evolution5/cambrian-league
          git reset --hard origin/evolution5/cambrian-league
          if [ ! -f evolution5/STOP ]; then
            printf '%s\n' 'Evolution5 Cambrian stopped for lineage self-play cutover.' > evolution5/STOP
            git add evolution5/STOP
            git commit -m 'evolution5: stop Cambrian for lineage self-play cutover'
            git push origin HEAD:evolution5/cambrian-league
          fi
          echo 'Old Cambrian auto-loop is stopped. Lineage self-play workflow will own subsequent evolution.'
