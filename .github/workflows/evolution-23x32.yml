name: evolution-23x32

on:
  push:
    branches: [evolution/control]
    paths:
      - 'evolution/state.json'
      - 'tools/evolution_orchestrator.py'
      - '.github/workflows/evolution-23x32.yml'
  workflow_dispatch:

permissions:
  contents: read

# HARD STOP 2026-08-22: the original evolutionary loop allowed cumulative
# regressions. A new run created by this commit cancels any in-progress run in
# the same group; the job below is intentionally disabled. Do not re-enable
# this workflow. A replacement elitist workflow must use a new workflow file.
concurrency:
  group: evolution-23x32
  cancel-in-progress: true

jobs:
  evolution-stopped:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Original evolution loop is intentionally stopped.'
