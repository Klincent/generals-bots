name: v36-edge-picker-thresholds

on:
  push:
    branches: [juraj-v3.6-edge-picker]
  workflow_dispatch:

permissions:
  contents: write

env:
  CHAMPION_SHA: 4f0fac768a8fc4479d45347a3ecbdbfedd6aef05
  CURRENT_SUBMISSION_SHA: 5043c64ed62ad48f5aa2fa6690ac73795601fe75
  SDL_VIDEODRIVER: dummy

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.sha.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.6-edge-picker
          fetch-depth: 0
      - name: Verify V3.5 hardened submission ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$CHAMPION_SHA" HEAD
          git merge-base --is-ancestor "$CURRENT_SUBMISSION_SHA" HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply persistent edge picker refactor
        run: python tools/apply_v36_edge_picker.py
      - name: Install engine dependencies
        run: pip install -e .
      - name: Run V3.5 + V3.6 regression tests
        run: bash competition/agents/juraj_v35_cpp/test.sh
      - name: Build candidate
        run: bash competition/agents/juraj_v35_cpp/build.sh
      - name: Commit and push tested implementation
        id: sha
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competition/agents/juraj_v35_cpp/main.cpp competition/agents/juraj_v35_cpp/core.hpp competition/agents/juraj_v35_cpp/test.sh competition/agents/juraj_v35_cpp/test_picker.cpp
          if ! git diff --cached --quiet; then
            git commit -m "V3.6: persistent irrelevant-wall picker to general"
            git push origin HEAD:juraj-v3.6-edge-picker
          fi
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: materialize
    strategy:
      fail-fast: false
      matrix:
        threshold: [3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v3.6-edge-picker
          fetch-depth: 0
      - name: Pin materialized candidate
        run: |
          set -euo pipefail
          git fetch origin juraj-v3.6-edge-picker
          git checkout --detach "${{ needs.materialize.outputs.candidate_sha }}"
          test "$(git rev-parse HEAD)" = "${{ needs.materialize.outputs.candidate_sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine dependencies
        run: pip install -e .
      - name: Build candidate and pinned baselines
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/build.sh
          git worktree add --detach /tmp/current-submission "$CURRENT_SUBMISSION_SHA"
          bash /tmp/current-submission/competition/agents/juraj_v35_cpp/build.sh
          git worktree add --detach /tmp/v35-champion "$CHAMPION_SHA"
          bash /tmp/v35-champion/competition/agents/juraj_v35_cpp/build.sh
          cat > /tmp/run-picker.sh <<EOF
          #!/usr/bin/env bash
          export V35_EDGE_PICKER_THRESHOLD=${{ matrix.threshold }}
          exec "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "\$@"
          EOF
          chmod +x /tmp/run-picker.sh
      - name: Paired benchmark vs current submission
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/run-picker.sh \
            --baseline /tmp/current-submission/competition/agents/juraj_v35_cpp/run.sh \
            --start 22500 --seeds 20 --output /tmp/vs-current
      - name: Paired benchmark vs immutable V3.5 champion
        run: |
          python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate /tmp/run-picker.sh \
            --baseline /tmp/v35-champion/competition/agents/juraj_v35_cpp/run.sh \
            --start 22500 --seeds 20 --output /tmp/vs-champion
      - name: Aggregate picker telemetry
        env:
          THRESHOLD: ${{ matrix.threshold }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          pat=re.compile(r'\[v36_picker\] threshold=(\d+) starts=(\d+) completions=(\d+) moves=(\d+) delivered=(\d+) aborts=(\d+) active=(\d+)')
          vals=[]
          for line in Path('/tmp/vs-current/games.jsonl').read_text().splitlines():
              row=json.loads(line)
              for m in pat.finditer(row.get('stderr','')):
                  vals.append(tuple(map(int,m.groups())))
          n=max(1,len(vals))
          tele={
              'samples':len(vals),
              'starts_mean':sum(v[1] for v in vals)/n,
              'completions_mean':sum(v[2] for v in vals)/n,
              'moves_mean':sum(v[3] for v in vals)/n,
              'delivered_mean':sum(v[4] for v in vals)/n,
              'aborts_mean':sum(v[5] for v in vals)/n,
              'completion_ratio':sum(v[2] for v in vals)/max(1,sum(v[1] for v in vals)),
          }
          out={
              'threshold':int(os.environ['THRESHOLD']),
              'candidate_sha':os.environ.get('CANDIDATE_SHA',''),
              'vs_current':json.loads(Path('/tmp/vs-current/summary.json').read_text()),
              'vs_champion':json.loads(Path('/tmp/vs-champion/summary.json').read_text()),
              'picker':tele,
          }
          d=Path('/tmp/result');d.mkdir(exist_ok=True)
          (d/'result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v36-edge-picker-threshold-${{ matrix.threshold }}
          path: |
            /tmp/result/result.json
            /tmp/vs-current/summary.json
            /tmp/vs-champion/summary.json
            /tmp/vs-current/selected-traces.json
            /tmp/vs-champion/selected-traces.json

  compare:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: v36-edge-picker-threshold-*
          path: /tmp/results
      - name: Build threshold comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('/tmp/results').glob('*/result.json'):
              rows.append(json.loads(p.read_text()))
          rows.sort(key=lambda x:x['threshold'])
          print('| T | vs current W-D-L | score | vs champion W-D-L | score | picker starts | completed | delivered | aborts |')
          print('|---:|---:|---:|---:|---:|---:|---:|---:|---:|')
          for r in rows:
              a,b,t=r['vs_current'],r['vs_champion'],r['picker']
              print(f"| {r['threshold']} | {a['W']}-{a['D']}-{a['L']} | {a['score']:.3f} | {b['W']}-{b['D']}-{b['L']} | {b['score']:.3f} | {t['starts_mean']:.2f} | {t['completions_mean']:.2f} | {t['delivered_mean']:.1f} | {t['aborts_mean']:.2f} |")
          Path('/tmp/combined-results.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v36-edge-picker-threshold-comparison
          path: /tmp/combined-results.json
