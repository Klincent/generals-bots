name: submission-package-pr

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  package:
    if: ${{ github.head_ref == 'tmp/submission-package-trigger' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc330ce89cdaf1bcb215472a39e774b6c4e27a7e
          fetch-depth: 0
      - name: Validate exact submission source
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
          test -x competition/agents/juraj_v35_cpp/agent
      - name: Build submission zip
        run: |
          set -euo pipefail
          src=competition/agents/juraj_v35_cpp
          mkdir -p /tmp/submission
          cp "$src/main.cpp" "$src/core.hpp" "$src/build.sh" "$src/run.sh" /tmp/submission/
          chmod +x /tmp/submission/build.sh /tmp/submission/run.sh
          (cd /tmp/submission && zip -q /tmp/generals-picker9-doomguard-submission.zip main.cpp core.hpp build.sh run.sh)
          sha256sum /tmp/generals-picker9-doomguard-submission.zip | tee /tmp/submission.sha256
          unzip -l /tmp/generals-picker9-doomguard-submission.zip
      - uses: actions/upload-artifact@v4
        with:
          name: generals-picker9-doomguard-submission
          path: |
            /tmp/generals-picker9-doomguard-submission.zip
            /tmp/submission.sha256
          retention-days: 5
