name: V3.5 defense-only fresh validation

on:
  workflow_dispatch:
  push:
    branches: [v35-defense-fresh]
    paths:
      - '.github/workflows/v35-defense-fresh.yml'

permissions:
  contents: read

env:
  SDL_VIDEODRIVER: dummy
  CHAMPION_SHA: 4f0fac768a8fc4479d45347a3ecbdbfedd6aef05
  BASELINE_SHA: 2ed9e8bbcf76b36c5276013afc356118fccc8b6e

jobs:
  phase1:
    name: Fresh Phase 1 — 22300..22319
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      continue: ${{ steps.gate.outputs.continue }}
      candidate_sha256: ${{ steps.identity.outputs.candidate_sha256 }}
      score: ${{ steps.gate.outputs.score }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize exact champion and exact V3.4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .fresh-candidate .fresh-v34 fresh-validation
          mkdir -p .fresh-candidate .fresh-v34 fresh-validation/phase1 fresh-validation/candidate
          git archive "$CHAMPION_SHA" competition/agents/juraj_v35_cpp | tar -x -C .fresh-candidate
          git archive "$BASELINE_SHA" competition/agents/juraj_cpp | tar -x -C .fresh-v34
          cp .fresh-candidate/competition/agents/juraj_v35_cpp/main.cpp /tmp/champion-main.cpp

      - name: Apply exactly defense-only hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.fresh-candidate/competition/agents/juraj_v35_cpp/main.cpp')
          s = p.read_text()
          changes = [
              (
                  '(moving&&eta<=5&&o.army[x]>=6)',
                  '(moving&&eta<=6&&o.army[x]>=6&&last_army_[x]<=o.army[x]+2)',
                  'defense threat horizon',
              ),
              (
                  'if(dx<primary_eta&&o.army[x]-1>o.army[primary_threat])',
                  'if(dx<=primary_eta&&o.army[x]-1>o.army[primary_threat])',
                  'defense blocker timing',
              ),
          ]
          for old, new, label in changes:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one source match, got {n}')
              if new in s:
                  raise SystemExit(f'{label}: replacement already present before patch')
              s = s.replace(old, new, 1)
          p.write_text(s)
          for old, new, label in changes:
              if old in s or s.count(new) != 1:
                  raise SystemExit(f'{label}: post-patch identity failure')
          forbidden = ('castle_opportunity_', 'castle_target_', 'CastleOpportunity')
          for token in forbidden:
              if token in s:
                  raise SystemExit(f'forbidden dynamic-castle token present: {token}')
          print('Applied exactly two defense-only replacements.')
          PY

          # Everything except main.cpp is byte-identical to the exact champion.
          cmp .fresh-candidate/competition/agents/juraj_v35_cpp/core.hpp <(git show "$CHAMPION_SHA":competition/agents/juraj_v35_cpp/core.hpp)
          cmp .fresh-candidate/competition/agents/juraj_v35_cpp/build.sh <(git show "$CHAMPION_SHA":competition/agents/juraj_v35_cpp/build.sh)
          cmp .fresh-candidate/competition/agents/juraj_v35_cpp/run.sh <(git show "$CHAMPION_SHA":competition/agents/juraj_v35_cpp/run.sh)
          cmp .fresh-candidate/competition/agents/juraj_v35_cpp/test.sh <(git show "$CHAMPION_SHA":competition/agents/juraj_v35_cpp/test.sh)
          cmp .fresh-candidate/competition/agents/juraj_v35_cpp/test_core.cpp <(git show "$CHAMPION_SHA":competition/agents/juraj_v35_cpp/test_core.cpp)
          cmp .fresh-candidate/competition/agents/juraj_v35_cpp/test_agent.cpp <(git show "$CHAMPION_SHA":competition/agents/juraj_v35_cpp/test_agent.cpp)

          diff -u /tmp/champion-main.cpp .fresh-candidate/competition/agents/juraj_v35_cpp/main.cpp > fresh-validation/candidate/defense-only.patch || true
          cp .fresh-candidate/competition/agents/juraj_v35_cpp/main.cpp fresh-validation/candidate/main.cpp
          cp .fresh-candidate/competition/agents/juraj_v35_cpp/core.hpp fresh-validation/candidate/core.hpp
          cp .fresh-candidate/competition/agents/juraj_v35_cpp/build.sh fresh-validation/candidate/build.sh
          cp .fresh-candidate/competition/agents/juraj_v35_cpp/run.sh fresh-validation/candidate/run.sh

      - name: Candidate identity and manifest
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          MAIN=.fresh-candidate/competition/agents/juraj_v35_cpp/main.cpp
          CORE=.fresh-candidate/competition/agents/juraj_v35_cpp/core.hpp
          BUILD=.fresh-candidate/competition/agents/juraj_v35_cpp/build.sh
          RUN=.fresh-candidate/competition/agents/juraj_v35_cpp/run.sh
          CANDIDATE_SHA=$(sha256sum "$MAIN" | awk '{print $1}')
          echo "candidate_sha256=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "base_champion=$CHAMPION_SHA"
            echo "baseline_v34=$BASELINE_SHA"
            echo "candidate_main_sha256=$CANDIDATE_SHA"
            sha256sum "$CORE" "$BUILD" "$RUN"
            echo "phase1_seeds=22300..22319"
            echo "phase2_seeds=22350..22399"
            echo "final_holdout_untouched=30000..30499"
          } | tee fresh-validation/candidate/MANIFEST.txt
          echo 'Defense-only patch:'
          cat fresh-validation/candidate/defense-only.patch

      - name: Build and run C++ fast suite
        shell: bash
        run: |
          set -euo pipefail
          .fresh-candidate/competition/agents/juraj_v35_cpp/test.sh
          .fresh-candidate/competition/agents/juraj_v35_cpp/build.sh
          .fresh-v34/competition/agents/juraj_cpp/build.sh
          test -x .fresh-candidate/competition/agents/juraj_v35_cpp/agent
          test -x .fresh-v34/competition/agents/juraj_cpp/agent

      - name: Install benchmark engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps

      - name: Fresh Phase 1 paired benchmark
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate .fresh-candidate/competition/agents/juraj_v35_cpp/run.sh \
            --baseline .fresh-v34/competition/agents/juraj_cpp/run.sh \
            --start 22300 --seeds 20 --output fresh-validation/phase1 --diagnostics

      - name: Health gate and Phase 1 report
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('fresh-validation/phase1/summary.json')
          s = json.loads(p.read_text())
          assert s['games'] == 40, s
          assert s['maps'] == 20, s
          assert s['seed_start'] == 22300 and s['seed_end'] == 22319, s
          assert s['errors'] == 0, s
          assert s['illegal_actions'] == 0, s
          score = float(s['score'])
          cont = score >= 0.54
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'score={score:.6f}\n')
              f.write(f'continue={str(cont).lower()}\n')
          report = [
              '# V3.5 defense-only fresh validation — Phase 1',
              '',
              f"- Exact base champion: `{os.environ['CHAMPION_SHA']}`",
              f"- Exact V3.4 baseline: `{os.environ['BASELINE_SHA']}`",
              '- Candidate delta: exactly two defense-only replacements',
              '- Seeds: `22300..22319` (20 maps / 40 paired games)',
              f"- W/D/L: **{s['W']}/{s['D']}/{s['L']}**",
              f"- Score: **{100*score:.2f}%**",
              f"- Seat 0 / Seat 1: **{100*s['seat_score']['0']:.2f}% / {100*s['seat_score']['1']:.2f}%**",
              f"- Paired CI95: **[{100*s['paired_ci95'][0]:.2f}%, {100*s['paired_ci95'][1]:.2f}%]**",
              f"- Errors / illegal: **{s['errors']} / {s['illegal_actions']}**",
              f"- Continue gate (>=54%): **{cont}**",
              '',
              '```json',
              json.dumps(s, indent=2, sort_keys=True),
              '```',
          ]
          Path('fresh-validation/phase1/REPORT.md').write_text('\n'.join(report) + '\n')
          print('\n'.join(report[:12]))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-defense-fresh-phase1-22300
          path: fresh-validation/
          if-no-files-found: error

  phase2:
    name: Fresh Phase 2 — 22350..22399
    needs: phase1
    if: needs.phase1.result == 'success' && needs.phase1.outputs.continue == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Re-materialize exact candidate and exact V3.4
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .fresh-candidate .fresh-v34 fresh-validation
          mkdir -p .fresh-candidate .fresh-v34 fresh-validation/phase2 fresh-validation/candidate
          git archive "$CHAMPION_SHA" competition/agents/juraj_v35_cpp | tar -x -C .fresh-candidate
          git archive "$BASELINE_SHA" competition/agents/juraj_cpp | tar -x -C .fresh-v34
          python - <<'PY'
          from pathlib import Path
          p = Path('.fresh-candidate/competition/agents/juraj_v35_cpp/main.cpp')
          s = p.read_text()
          changes = [
              ('(moving&&eta<=5&&o.army[x]>=6)', '(moving&&eta<=6&&o.army[x]>=6&&last_army_[x]<=o.army[x]+2)'),
              ('if(dx<primary_eta&&o.army[x]-1>o.army[primary_threat])', 'if(dx<=primary_eta&&o.army[x]-1>o.army[primary_threat])'),
          ]
          for old, new in changes:
              if s.count(old) != 1 or new in s:
                  raise SystemExit('defense-only source identity failure')
              s = s.replace(old, new, 1)
          if any(t in s for t in ('castle_opportunity_', 'castle_target_', 'CastleOpportunity')):
              raise SystemExit('forbidden dynamic-castle code present')
          p.write_text(s)
          PY
          CANDIDATE_SHA=$(sha256sum .fresh-candidate/competition/agents/juraj_v35_cpp/main.cpp | awk '{print $1}')
          test "$CANDIDATE_SHA" = "${{ needs.phase1.outputs.candidate_sha256 }}"
          echo "Reproduced exact candidate SHA256: $CANDIDATE_SHA"
          cp .fresh-candidate/competition/agents/juraj_v35_cpp/main.cpp fresh-validation/candidate/main.cpp
          cp .fresh-candidate/competition/agents/juraj_v35_cpp/core.hpp fresh-validation/candidate/core.hpp
          cp .fresh-candidate/competition/agents/juraj_v35_cpp/build.sh fresh-validation/candidate/build.sh
          cp .fresh-candidate/competition/agents/juraj_v35_cpp/run.sh fresh-validation/candidate/run.sh
          {
            echo "base_champion=$CHAMPION_SHA"
            echo "baseline_v34=$BASELINE_SHA"
            echo "candidate_main_sha256=$CANDIDATE_SHA"
            echo "phase2_seeds=22350..22399"
            echo "phase1_score=${{ needs.phase1.outputs.score }}"
            echo "final_holdout_untouched=30000..30499"
          } > fresh-validation/candidate/MANIFEST.txt

      - name: Build and run C++ fast suite again
        shell: bash
        run: |
          set -euo pipefail
          .fresh-candidate/competition/agents/juraj_v35_cpp/test.sh
          .fresh-candidate/competition/agents/juraj_v35_cpp/build.sh
          .fresh-v34/competition/agents/juraj_cpp/build.sh

      - name: Install benchmark engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy jax jaxlib
          python -m pip install -e . --no-deps

      - name: Fresh Phase 2 paired benchmark
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python competition/agents/juraj_v35_cpp/paired_benchmark.py \
            --candidate .fresh-candidate/competition/agents/juraj_v35_cpp/run.sh \
            --baseline .fresh-v34/competition/agents/juraj_cpp/run.sh \
            --start 22350 --seeds 50 --output fresh-validation/phase2 --diagnostics

      - name: Final health check and Phase 2 report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('fresh-validation/phase2/summary.json')
          s = json.loads(p.read_text())
          assert s['games'] == 100, s
          assert s['maps'] == 50, s
          assert s['seed_start'] == 22350 and s['seed_end'] == 22399, s
          assert s['errors'] == 0, s
          assert s['illegal_actions'] == 0, s
          score = float(s['score'])
          if score < .52: verdict = 'SERIOUS REGRESSION'
          elif score < .54: verdict = 'WEAK / BASELINE-ISH'
          elif score < .56: verdict = 'PREVIOUS LEVEL'
          elif score < .58: verdict = 'CLEAR IMPROVEMENT'
          elif score < .60: verdict = 'MAJOR IMPROVEMENT'
          else: verdict = 'EXCELLENT'
          report = [
              '# V3.5 defense-only fresh validation — Phase 2',
              '',
              f"- Exact base champion: `{os.environ['CHAMPION_SHA']}`",
              f"- Exact V3.4 baseline: `{os.environ['BASELINE_SHA']}`",
              '- Candidate delta: exactly two defense-only replacements',
              '- Seeds: `22350..22399` (50 maps / 100 paired games)',
              f"- W/D/L: **{s['W']}/{s['D']}/{s['L']}**",
              f"- Score: **{100*score:.2f}%**",
              f"- Seat 0 / Seat 1: **{100*s['seat_score']['0']:.2f}% / {100*s['seat_score']['1']:.2f}%**",
              f"- Paired CI95: **[{100*s['paired_ci95'][0]:.2f}%, {100*s['paired_ci95'][1]:.2f}%]**",
              f"- Errors / illegal: **{s['errors']} / {s['illegal_actions']}**",
              f"- Verdict: **{verdict}**",
              '',
              '```json',
              json.dumps(s, indent=2, sort_keys=True),
              '```',
          ]
          Path('fresh-validation/phase2/REPORT.md').write_text('\n'.join(report) + '\n')
          print('\n'.join(report[:12]))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-defense-fresh-phase2-22350
          path: fresh-validation/
          if-no-files-found: error
