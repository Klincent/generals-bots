name: V4.1 post-training candidate

on:
  workflow_dispatch:
  push:
    branches: [v41-phase2]
    paths:
      - .github/workflows/v41-posttrain.yml

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/competition:${{ github.workspace }}/competition/training/v4
      SDL_VIDEODRIVER: dummy
      XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install numpy==2.4.6 jax==0.11.0 pytest
          python -m pip install -e . --no-deps
      - name: Download authoritative 5000-game training artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python competition/training/v4/fetch_v41_artifact.py \
            --artifact-id 9164275598 \
            --state-dir /tmp/v41-state
      - name: Strictly validate training state
        run: |
          python competition/training/v4/validate_training_state_v41.py \
            --state-dir /tmp/v41-state \
            --report /tmp/training-state-report.json
      - name: Fit full V4.1 policy pack
        run: |
          mkdir -p /tmp/v41-candidate
          python competition/training/v4/fit_policy_v41.py \
            --rollouts /tmp/v41-state/rollouts.jsonl.gz \
            --policy /tmp/v41-candidate/policy.bin \
            --report /tmp/v41-candidate/policy-report.json \
            --hash-bits 20 \
            --epochs 8 \
            --learning-rate 0.05 \
            --l2 0.0001
          python - <<'PY'
          import sys
          sys.path.insert(0, 'competition/training/v4')
          from fit_policy_v41 import deserialize_policy
          w,c,n = deserialize_policy(open('/tmp/v41-candidate/policy.bin','rb').read())
          print('policy samples', n, 'weights', len(w), 'covered', int((c>0).sum()))
          PY
      - name: Mine targeted V4.1 tactics pack
        run: |
          python competition/training/v4/mine_tactics_v41.py \
            --tactics /tmp/v41-candidate/tactics.bin \
            --report /tmp/v41-candidate/tactics-report.json \
            --seed-start 41000 \
            --games 64 \
            --states-per-game 3 \
            --rollouts-per-action 4 \
            --horizon 30 \
            --candidates 8 \
            --min-support 3
          python - <<'PY'
          import sys
          sys.path.insert(0, 'competition/training/v4')
          from tactics_v41 import deserialize_tactics
          rows = deserialize_tactics(open('/tmp/v41-candidate/tactics.bin','rb').read())
          print('tactic records', len(rows))
          if not rows:
              raise SystemExit('empty tactics pack')
          PY
      - name: Reconstruct and compile Phase 2 runtime
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/juraj-v3.4:refs/remotes/origin/juraj-v3.4
          test "$(git rev-parse refs/remotes/origin/juraj-v3.4)" = "2ed9e8bbcf76b36c5276013afc356118fccc8b6e"
          mkdir -p /tmp/v34-source
          git archive 2ed9e8bbcf76b36c5276013afc356118fccc8b6e competition/agents/juraj_cpp | tar -x -C /tmp/v34-source
          python competition/training/v4/prepare_v41_runtime.py \
            --agent-dir /tmp/v34-source/competition/agents/juraj_cpp \
            --output /tmp/v41-candidate/main.cpp
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic /tmp/v41-candidate/main.cpp -o /tmp/v41-candidate/juraj-v41
          sha256sum /tmp/v41-candidate/main.cpp /tmp/v41-candidate/policy.bin /tmp/v41-candidate/tactics.bin
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: v41-phase2-candidate
          path: |
            /tmp/v41-candidate/main.cpp
            /tmp/v41-candidate/juraj-v41
            /tmp/v41-candidate/policy.bin
            /tmp/v41-candidate/policy-report.json
            /tmp/v41-candidate/tactics.bin
            /tmp/v41-candidate/tactics-report.json
            /tmp/training-state-report.json
          retention-days: 14
