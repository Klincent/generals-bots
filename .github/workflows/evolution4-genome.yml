name: evolution4-genome

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/evolution4-genome.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: evolution4-genome
  cancel-in-progress: true

jobs:
  evolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SDL_VIDEODRIVER: dummy
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout durable evolution4 control
        uses: actions/checkout@v4
        with:
          ref: evolution4/control
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name ChatGPT
          git config user.email actions@users.noreply.github.com

      - name: Repair evolution4 infrastructure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          # Preserve historical V35_* test/debug overrides after loading EVO4 defaults.
          p=Path('tools/evolution4/template_transform.py')
          s=p.read_text()
          old_line="    new='cfg_.load();doomguard_enabled_=cfg_.doomguard_enabled;picker_enabled_=cfg_.picker_enabled;edge_picker_threshold_=cfg_.edge_picker_threshold;edge_picker_min_efficiency_=cfg_.picker_min_efficiency;muster_threshold_=cfg_.muster_threshold;'"
          fixed_line=old_line[:-1]+"'+old"
          if old_line in s:
              p.write_text(s.replace(old_line,fixed_line,1))
          elif fixed_line not in s:
              raise SystemExit('unexpected template_transform legacy-env marker')

          op=Path('tools/evolution4/orchestrator.py')
          o=op.read_text()

          # Keep pinned X0 smoke runner repair if an older control checkout still needs it.
          old_smoke="""    # Fresh game-level smoke with actual engine.\n    run(['python','competition/matchup.py',str(t/AGENT/'run.sh'),str(x/AGENT/'run.sh'),'--mode','competition','--seed','399901'])\n    yw=wrapper(t/AGENT/'run.sh',founder_y0(),Path('/tmp/e4-y-smoke.sh')); run(['python','competition/matchup.py',str(yw),str(y/AGENT/'run.sh'),'--mode','competition','--seed','399902'])\n"""
          new_smoke="""    # Fresh game-level smoke with the pinned X0 runner. The current control\n    # branch's older matchup.py has a path-label-only bug for /tmp worktrees;\n    # pinning the known X0 runner avoids changing game/evaluator semantics.\n    pinned_matchup=ROOT/'competition'/'evolution4_matchup_pinned.py'\n    pinned_matchup.write_text(git('show',f'{X0}:competition/matchup.py',capture=True).stdout)\n    try:\n        run(['python',str(pinned_matchup),str(t/AGENT/'run.sh'),str(x/AGENT/'run.sh'),'--mode','competition','--seed','399901'])\n        yw=wrapper(t/AGENT/'run.sh',founder_y0(),Path('/tmp/e4-y-smoke.sh'))\n        run(['python',str(pinned_matchup),str(yw),str(y/AGENT/'run.sh'),'--mode','competition','--seed','399902'])\n    finally:\n        pinned_matchup.unlink(missing_ok=True)\n"""
          if old_smoke in o:
              o=o.replace(old_smoke,new_smoke,1)

          # Generation evaluation used to be completely sequential and silent.
          # Replace it with deterministic max-4 parallel genome evaluation.
          old_stage='''def stage_population(s,t,opps,ids,generation):\n    template_run=t/AGENT/'run.sh'; rep_names=['aggressive-expansion','defense-turtle','doomer-rusher','recent-reference']; rep=[o for o in opps if o['archetype'] in rep_names]\n    starts1={o['archetype']:allocate(s,3,f'g{generation:02d}-stage1-{o["archetype"]}') for o in rep}\n    rows=[]\n    for gid in ids:\n        out=RESULTS/f'g{generation:02d}'/'stage1'/gid[:12]; ev=eval_genome(genome_values(gid),template_run,rep,starts1,3,out); rows.append({'genome_id':gid,'fitness':ev['fitness'],'stage1':ev})\n    top8=select(rows,8)\n    starts2={o['archetype']:allocate(s,5,f'g{generation:02d}-stage2-{o["archetype"]}') for o in opps}\n    rows2=[]\n    for r in top8:\n        gid=r['genome_id']; out=RESULTS/f'g{generation:02d}'/'stage2'/gid[:12]; ev=eval_genome(genome_values(gid),template_run,opps,starts2,5,out); rows2.append({'genome_id':gid,'fitness':ev['fitness'],'stage1':r['stage1'],'stage2':ev})\n    top4=select(rows2,4); return rows,rows2,top4\n'''
          new_stage='''def stage_population(s,t,opps,ids,generation):\n    from concurrent.futures import ThreadPoolExecutor, as_completed\n    template_run=t/AGENT/'run.sh'; rep_names=['aggressive-expansion','defense-turtle','doomer-rusher','recent-reference']; rep=[o for o in opps if o['archetype'] in rep_names]\n    starts1={o['archetype']:allocate(s,3,f'g{generation:02d}-stage1-{o["archetype"]}') for o in rep}\n    print(f'[evolution4] STAGE1 start generation={generation} genomes={len(ids)} workers={min(4,len(ids))}',flush=True)\n    def one1(gid):\n        print(f'[evolution4] STAGE1 GENOME START {gid[:12]}',flush=True)\n        out=RESULTS/f'g{generation:02d}'/'stage1'/gid[:12]; ev=eval_genome(genome_values(gid),template_run,rep,starts1,3,out)\n        print(f'[evolution4] STAGE1 GENOME DONE {gid[:12]} score={ev["fitness"]["aggregate"]:.4f}',flush=True)\n        return {'genome_id':gid,'fitness':ev['fitness'],'stage1':ev}\n    got={}\n    with ThreadPoolExecutor(max_workers=min(4,len(ids))) as ex:\n        futs={ex.submit(one1,gid):gid for gid in ids}\n        for f in as_completed(futs): got[futs[f]]=f.result()\n    rows=[got[gid] for gid in ids]\n    top8=select(rows,8)\n    starts2={o['archetype']:allocate(s,5,f'g{generation:02d}-stage2-{o["archetype"]}') for o in opps}\n    print(f'[evolution4] STAGE2 start generation={generation} genomes={len(top8)} workers={min(4,len(top8))}',flush=True)\n    stage1_by={r['genome_id']:r['stage1'] for r in top8}\n    top8_ids=[r['genome_id'] for r in top8]\n    def one2(gid):\n        print(f'[evolution4] STAGE2 GENOME START {gid[:12]}',flush=True)\n        out=RESULTS/f'g{generation:02d}'/'stage2'/gid[:12]; ev=eval_genome(genome_values(gid),template_run,opps,starts2,5,out)\n        print(f'[evolution4] STAGE2 GENOME DONE {gid[:12]} score={ev["fitness"]["aggregate"]:.4f}',flush=True)\n        return {'genome_id':gid,'fitness':ev['fitness'],'stage1':stage1_by[gid],'stage2':ev}\n    got2={}\n    with ThreadPoolExecutor(max_workers=min(4,len(top8_ids))) as ex:\n        futs={ex.submit(one2,gid):gid for gid in top8_ids}\n        for f in as_completed(futs): got2[futs[f]]=f.result()\n    rows2=[got2[gid] for gid in top8_ids]\n    top4=select(rows2,4); return rows,rows2,top4\n'''
          if old_stage in o:
              o=o.replace(old_stage,new_stage,1)
          elif new_stage not in o:
              raise SystemExit('unexpected stage_population marker')
          op.write_text(o)

          # Remove recovery-note clutter, but deliberately keep evolution4/STOP
          # until the hung run has been cancelled and a clean restart is requested.
          for q in Path('evolution4').glob('recovery*'):
              if q.is_file(): q.unlink()
          Path('evolution4/.recovery_lock').unlink(missing_ok=True)
          PY
          git add -A tools/evolution4 evolution4
          if ! git diff --cached --quiet; then
            git commit -m 'evolution4: repair hung-generation evaluator infrastructure'
            git push origin HEAD:evolution4/control
          fi

      - name: Capture remote pre-state and STOP
        id: pre
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin evolution4/control evolution4/founder-x0 evolution4/founder-y0 evolution4/template evolution4/champion evolution3/control master
          git show origin/evolution4/control:evolution4/state.json > /tmp/pre-state.json
          python - <<'PY' | tee /tmp/pre-summary.txt
          import json
          s=json.load(open('/tmp/pre-state.json'))
          print('pre phase=',s['phase'],'generation=',s['generation'],'retry=',s.get('retry_count',0))
          PY
          if git cat-file -e origin/evolution4/control:evolution4/STOP 2>/dev/null; then
            echo stopped=true >> "$GITHUB_OUTPUT"
          else
            echo stopped=false >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.pre.outputs.stopped != 'true'
        with:
          python-version: '3.12'

      - name: Install evaluator dependencies
        if: steps.pre.outputs.stopped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest numpy jax jaxlib
          python -m pip install -e . --no-deps

      - name: Static validation and genetic-engine tests
        if: steps.pre.outputs.stopped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/evolution4/*.py
          pytest -q tests/test_evolution4.py

      - name: Execute exactly one evolution4 transaction
        id: tx
        if: steps.pre.outputs.stopped != 'true'
        shell: bash
        run: |
          set +e
          python -m tools.evolution4.orchestrator 2>&1 | tee /tmp/evolution4.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fetch and validate remote post-state
        id: post
        if: always() && steps.pre.outputs.stopped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin evolution4/control
          git show origin/evolution4/control:evolution4/state.json > /tmp/post-state.json
          python - <<'PY'
          import json, os
          pre=json.load(open('/tmp/pre-state.json')); post=json.load(open('/tmp/post-state.json'))
          rc=int(os.environ.get('TX_RC','0'))
          bp, bg=pre['phase'], int(pre['generation']); ap, ag=post['phase'], int(post['generation'])
          print('post phase=',ap,'generation=',ag,'retry=',post.get('retry_count',0),'last_error=',post.get('last_error'))
          if rc==0:
              if bp=='bootstrap' and not (ap=='exploration' and ag==0):
                  raise SystemExit(f'FALSE GREEN: bootstrap did not become exploration/0: {ap}/{ag}')
              if bp in ('exploration','exploitation') and ag != bg+1:
                  raise SystemExit(f'FALSE GREEN: generation did not increment exactly once: {bg}->{ag}')
              if bp=='final' and not (ap=='done' and ag==bg):
                  raise SystemExit(f'FALSE GREEN: final did not become done: {ap}/{ag}')
          PY
        env:
          TX_RC: ${{ steps.tx.outputs.rc }}

      - name: Upload transaction evidence
        if: always() && steps.pre.outputs.stopped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evolution4-${{ github.run_number }}
          path: |
            /tmp/evolution4.log
            /tmp/pre-state.json
            /tmp/post-state.json
            evolution4/heartbeat.json
            evolution4/results/
            evolution4/checkpoints/
            evolution4/final/
          if-no-files-found: ignore
          retention-days: 30

      - name: Dispatch next transaction when allowed
        if: always() && steps.pre.outputs.stopped != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TX_RC: ${{ steps.tx.outputs.rc }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin evolution4/control
          if git cat-file -e origin/evolution4/control:evolution4/STOP 2>/dev/null; then
            echo 'evolution4 STOP present; no dispatch.'
            exit 0
          fi
          git show origin/evolution4/control:evolution4/state.json > /tmp/latest-state.json
          phase=$(python -c "import json;print(json.load(open('/tmp/latest-state.json'))['phase'])")
          retry=$(python -c "import json;print(int(json.load(open('/tmp/latest-state.json')).get('retry_count',0)))")
          echo "phase=$phase retry=$retry rc=$TX_RC"
          if [ "$phase" = done ] || [ "$phase" = stopped ]; then exit 0; fi
          if [ "$retry" -ge 3 ]; then exit 0; fi
          gh workflow run evolution4-genome.yml --repo "$GITHUB_REPOSITORY" --ref master

      - name: Fail visibly on transaction error
        if: steps.pre.outputs.stopped != 'true' && steps.tx.outputs.rc != '0'
        run: exit 1

