name: one-time-cleanup-all-workflows

on:
  push:
    branches: [master]
    paths: ['.github/workflows/cleanup-all-workflows.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-time-cleanup-all-workflows
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Remove workflow definitions from every branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          : > /tmp/cleaned.txt
          : > /tmp/noop.txt
          : > /tmp/failed.txt

          mapfile -t refs < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin/ | sort)
          for ref in "${refs[@]}"; do
            branch="${ref#origin/}"
            [ "$branch" = "HEAD" ] && continue
            [ "$branch" = "master" ] && continue

            wt="/tmp/wf-clean-${RANDOM}-${RANDOM}"
            if ! git worktree add --detach "$wt" "$ref" >/dev/null 2>&1; then
              echo "$branch worktree-add" >> /tmp/failed.txt
              continue
            fi

            if [ ! -d "$wt/.github/workflows" ]; then
              echo "$branch" >> /tmp/noop.txt
              git worktree remove --force "$wt" >/dev/null 2>&1 || true
              continue
            fi

            find "$wt/.github/workflows" -type f -print | sort > /tmp/files-before.txt
            rm -rf "$wt/.github/workflows"
            (
              cd "$wt"
              git add -A .github/workflows 2>/dev/null || true
              if git diff --cached --quiet; then
                exit 3
              fi
              git commit -m 'ci: remove obsolete GitHub workflows' >/dev/null
              git push origin "HEAD:refs/heads/$branch" >/dev/null 2>&1
            )
            rc=$?

            if [ "$rc" -eq 0 ]; then
              echo "$branch" >> /tmp/cleaned.txt
            elif [ "$rc" -eq 3 ]; then
              echo "$branch" >> /tmp/noop.txt
            else
              echo "$branch push-or-commit-rc=$rc" >> /tmp/failed.txt
            fi
            git worktree remove --force "$wt" >/dev/null 2>&1 || true
          done

          echo '=== CLEANED BRANCHES ==='
          cat /tmp/cleaned.txt || true
          echo '=== ALREADY CLEAN ==='
          cat /tmp/noop.txt || true
          echo '=== FAILURES ==='
          cat /tmp/failed.txt || true

          cleaned=$(wc -l < /tmp/cleaned.txt)
          noop=$(wc -l < /tmp/noop.txt)
          failed=$(wc -l < /tmp/failed.txt)
          {
            echo "### Workflow cleanup"
            echo "- cleaned branches: $cleaned"
            echo "- already clean: $noop"
            echo "- failures: $failed"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Self-delete cleanup workflow from master
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout master
          git pull --ff-only origin master
          git rm .github/workflows/cleanup-all-workflows.yml
          git commit -m 'ci: finish one-time workflow cleanup'
          git push origin master
