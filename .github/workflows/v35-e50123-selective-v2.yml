name: v35-e50123-selective-v2
on:
  pull_request:
    branches: [master]
permissions:
  contents: write
jobs:
  test-benchmark-package:
    if: ${{ github.head_ref == 'juraj-v35-e50123-selective' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SDL_VIDEODRIVER: dummy
      BASE_E501: e50123cee7d924f0d643acd372a5300971f93917
      CHAMPION: 4f0fac768a8fc447a3ecbdbfedd6aef05
    steps:
      - uses: actions/checkout@v4
        with:
          ref: juraj-v35-e50123-selective
          fetch-depth: 0
      - name: Apply selected e50123 layer
        run: python tools/apply_e50123_selective_layer.py
      - name: Verify requested architecture
        run: |
          set -euo pipefail
          M=competition/agents/juraj_v35_cpp/main.cpp
          C=competition/agents/juraj_v35_cpp/core.hpp
          grep -q 'owned_castle_history_' "$M"
          grep -q 'Reason::CASTLE_INVALIDATED' "$M"
          grep -q 'tactical_next_logistics' "$M"
          grep -q 'castles_=plan_castles(g_,general_)' "$M"
          test "$(grep -o 'castles_=plan_castles(g_,general_)' "$M" | wc -l)" -eq 1
          grep -q 'init_sector_exploration()' "$M"
          grep -q 'std::array<int,9> sector_target_' "$M"
          grep -q 'EdgePickerState picker_' "$M"
          grep -q 'edge_picker_threshold_=16' "$M"
          grep -q 'eligible(a,150)' "$C"
          grep -q 'eligible(b,250)' "$C"
          grep -q 'forecast(o.turn,150,cost1' "$M"
          grep -q 'forecast(o.turn,250,cost2' "$M"
          ! grep -q 'force_c1' "$M"
      - name: Add focused invariant tests
        run: |
          cat > competition/agents/juraj_v35_cpp/test_selective_invariants.cpp <<'EOF'
          #define V35_AGENT_TEST
          #include "main.cpp"
          #include <cassert>
          #include <iostream>
          static Observation base(){Observation o;o.turn=0;o.type.assign(441,1);o.owner.assign(441,0);o.army.assign(441,0);o.type[220]=4;o.owner[220]=1;o.army[220]=90;o.my_land=1;o.my_army=90;return o;}
          static int src(const Action&a){return a.row*21+a.col;}static int dst(const Action&a){if(a.kind)return -1;static int dr[4]={-1,1,0,0},dc[4]={0,0,-1,1};return (a.row+dr[a.dir])*21+a.col+dc[a.dir];}
          int main(){
            {Agent a(0,21,21);auto o=base();a.decide(o);int c1=a.planned_castle(0),c2=a.planned_castle(1);assert(c1>=0&&c2>=0&&c1!=c2);assert(a.search_sector_backbone_count()==8);assert(a.search_reachable_sectors()==9);o.turn=120;for(int x=0;x<441;++x)if(x!=220){o.owner[x]=(x%3==0)?1:0;o.army[x]=o.owner[x]?2:0;}o.owner[220]=1;o.army[220]=30;a.decide(o);assert(a.planned_castle(0)==c1&&a.planned_castle(1)==c2);}
            {Packet p;p.cell=10;p.target=20;p.event_version=0;p.path={10,11,10};assert(route_allowed(p,11,1,1,0,Reason::SEARCH_PROGRESS));p.path={10,11,12,13,10};p.cell=10;assert(!route_allowed(p,11,1,1,0,Reason::SEARCH_PROGRESS));assert(route_allowed(p,11,1,1,0,Reason::GENERAL_EMERGENCY));}
            {Agent a(0,21,21);auto o=base();int t=100,s=101;o.type[t]=3;o.owner[t]=1;o.army[t]=1;o.owner[s]=1;o.army[s]=20;o.my_land=3;o.my_army=111;a.decide(o);o.turn=1;o.owner[t]=2;o.army[t]=2;o.opp_land=1;o.opp_army=2;o.my_land=2;o.my_army=110;auto q=a.decide(o);assert(q.kind==0&&src(q)==s&&dst(q)==t);}
            std::cout<<"selective e50123 invariants passed\n";
          }
          EOF
          printf '\ng++ -O2 -std=c++17 -Wall -Wextra -Wpedantic test_selective_invariants.cpp -o test_selective_invariants\n./test_selective_invariants\n' >> competition/agents/juraj_v35_cpp/test.sh
      - name: Unit tests and build
        run: |
          set -euo pipefail
          bash competition/agents/juraj_v35_cpp/test.sh
          bash competition/agents/juraj_v35_cpp/build.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies and baselines
        run: |
          set -euo pipefail
          pip install -e .
          git worktree add --detach /tmp/champion "$CHAMPION"
          git worktree add --detach /tmp/e501 "$BASE_E501"
          bash /tmp/champion/competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/e501/competition/agents/juraj_v35_cpp/build.sh
          cat > /tmp/run-candidate.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_EDGE_PICKER_THRESHOLD=16
          export V36_EDGE_PICKER_MIN_EFFICIENCY=2.0
          "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@"
          EOF
          printf '#!/usr/bin/env bash\n"/tmp/champion/competition/agents/juraj_v35_cpp/run.sh" "$@"\n' > /tmp/run-champion.sh
          printf '#!/usr/bin/env bash\n"/tmp/e501/competition/agents/juraj_v35_cpp/run.sh" "$@"\n' > /tmp/run-e501.sh
          chmod +x /tmp/run-candidate.sh /tmp/run-champion.sh /tmp/run-e501.sh
      - name: Benchmark 100 games vs champion
        run: |
          set -euo pipefail
          mkdir -p /tmp/selective-bench
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/run-candidate.sh --baseline /tmp/run-champion.sh --start 35000 --seeds 50 --output /tmp/selective-bench/champion
          cat /tmp/selective-bench/champion/summary.json
      - name: Regression 60 games vs exact e50123
        run: |
          set -euo pipefail
          python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/run-candidate.sh --baseline /tmp/run-e501.sh --start 36000 --seeds 30 --output /tmp/selective-bench/e501
          cat /tmp/selective-bench/e501/summary.json
      - name: Commit tested source and package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competition/agents/juraj_v35_cpp/core.hpp competition/agents/juraj_v35_cpp/main.cpp competition/agents/juraj_v35_cpp/test.sh competition/agents/juraj_v35_cpp/test_selective_invariants.cpp tools/apply_e50123_selective_layer.py
          git commit -m 'V3.5 e50123 selective: picker 3x3 search and exact anti-cycle'
          git push origin HEAD:juraj-v35-e50123-selective
          rm -rf /tmp/submission && mkdir -p /tmp/submission/juraj_v35
          cp competition/agents/juraj_v35_cpp/{main.cpp,core.hpp,build.sh,run.sh} /tmp/submission/juraj_v35/
          (cd /tmp/submission && zip -qr /tmp/juraj_v35_e50123_selective.zip juraj_v35)
          sha256sum /tmp/juraj_v35_e50123_selective.zip | tee /tmp/selective-bench/submission.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: v35-e50123-selective-results
          path: |
            /tmp/selective-bench
            /tmp/juraj_v35_e50123_selective.zip
          retention-days: 3
