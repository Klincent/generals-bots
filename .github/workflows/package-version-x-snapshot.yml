name: package-version-x-snapshot

on:
  push:
    branches:
      - snapshot/version-x-20260822-0655
    paths:
      - '.github/workflows/package-version-x-snapshot.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: snapshot/version-x-20260822-0655
          fetch-depth: 0

      - name: Build exact snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd competition/agents/juraj_v35_cpp
          bash build.sh
          test -x agent
          rm -f agent

      - name: Create clean submission
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/version-x-submission snapshot_submission
          mkdir -p /tmp/version-x-submission/juraj_v35 snapshot_submission
          cp competition/agents/juraj_v35_cpp/main.cpp /tmp/version-x-submission/juraj_v35/
          cp competition/agents/juraj_v35_cpp/core.hpp /tmp/version-x-submission/juraj_v35/
          cp competition/agents/juraj_v35_cpp/build.sh /tmp/version-x-submission/juraj_v35/
          cp competition/agents/juraj_v35_cpp/run.sh /tmp/version-x-submission/juraj_v35/
          chmod +x /tmp/version-x-submission/juraj_v35/build.sh /tmp/version-x-submission/juraj_v35/run.sh
          cd /tmp/version-x-submission
          zip -qr "$GITHUB_WORKSPACE/snapshot_submission/version_x_snapshot_submission.zip" juraj_v35
          cd "$GITHUB_WORKSPACE"
          sha256sum snapshot_submission/version_x_snapshot_submission.zip > snapshot_submission/version_x_snapshot_submission.sha256
          unzip -l snapshot_submission/version_x_snapshot_submission.zip

      - name: Commit packaged snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add snapshot_submission/version_x_snapshot_submission.zip snapshot_submission/version_x_snapshot_submission.sha256
          git commit -m 'snapshot: package version-x submission [skip ci]'
          git push origin HEAD:snapshot/version-x-20260822-0655
