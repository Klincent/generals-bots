name: picker9-mix5453-fast-pr

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verdict:
    if: ${{ github.head_ref == 'tmp/picker9-mix5453-trigger' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - parent: v75
            sha: 9cc3b78a0003dd17079cd2aa8d6439321fedccc0
            kind: random
            start: 55800
            seeds: 12
          - parent: v75
            sha: 9cc3b78a0003dd17079cd2aa8d6439321fedccc0
            kind: defense-candidate
            start: 55820
            seeds: 10
          - parent: v75
            sha: 9cc3b78a0003dd17079cd2aa8d6439321fedccc0
            kind: defense-parent
            start: 55820
            seeds: 10
          - parent: final
            sha: 2260b6f19d51a14d7c68770677f22d04dfd88022
            kind: random
            start: 55800
            seeds: 12
          - parent: final
            sha: 2260b6f19d51a14d7c68770677f22d04dfd88022
            kind: defense-candidate
            start: 55820
            seeds: 10
          - parent: final
            sha: 2260b6f19d51a14d7c68770677f22d04dfd88022
            kind: defense-parent
            start: 55820
            seeds: 10
    env:
      SDL_VIDEODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e .
      - name: Prepare builds
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/parent ${{ matrix.sha }}
          if git rev-parse --verify --quiet origin/v35-defense-fresh >/dev/null; then DREF=origin/v35-defense-fresh; else DREF=v35-defense-fresh; fi
          git worktree add --detach /tmp/defense "$DREF"
          if [ '${{ matrix.kind }}' != 'defense-parent' ]; then
            python - <<'PY'
          from pathlib import Path
          p=Path('competition/agents/juraj_v35_cpp/main.cpp')
          s=p.read_text()
          old='production_==ProductionState::SEVERE_DEFICIT?.62:production_==ProductionState::SOFT_DEFICIT?.45:.35'
          new='production_==ProductionState::SEVERE_DEFICIT?.62:production_==ProductionState::SOFT_DEFICIT?((!enemy_seen&&o.turn<=250)?.52:.45):((!enemy_seen&&o.turn<=250)?.40:.35)'
          if old not in s or s.count(old)!=1: raise SystemExit('expansion share anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY
          fi
          bash competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/parent/competition/agents/juraj_v35_cpp/build.sh
          bash /tmp/defense/competition/agents/juraj_v35_cpp/build.sh
          cat >/tmp/candidate.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1 V35_DOOMGUARD_ENABLED=1
          exec "$GITHUB_WORKSPACE/competition/agents/juraj_v35_cpp/run.sh" "$@"
          EOF
          cat >/tmp/parent.sh <<'EOF'
          #!/usr/bin/env bash
          export V35_PICKER_ENABLED=1 V35_DOOMGUARD_ENABLED=1
          exec "/tmp/parent/competition/agents/juraj_v35_cpp/run.sh" "$@"
          EOF
          chmod +x /tmp/candidate.sh /tmp/parent.sh /tmp/defense/competition/agents/juraj_v35_cpp/run.sh
      - name: Run verdict slice
        run: |
          set -euo pipefail
          OUT=/tmp/result
          if [ '${{ matrix.kind }}' = random ]; then
            python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/candidate.sh --baseline /tmp/parent.sh --start ${{ matrix.start }} --seeds ${{ matrix.seeds }} --output "$OUT"
          elif [ '${{ matrix.kind }}' = defense-candidate ]; then
            python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/candidate.sh --baseline /tmp/defense/competition/agents/juraj_v35_cpp/run.sh --start ${{ matrix.start }} --seeds ${{ matrix.seeds }} --output "$OUT"
          else
            python competition/agents/juraj_v35_cpp/paired_benchmark.py --candidate /tmp/parent.sh --baseline /tmp/defense/competition/agents/juraj_v35_cpp/run.sh --start ${{ matrix.start }} --seeds ${{ matrix.seeds }} --output "$OUT"
          fi
          cat "$OUT/summary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: fast-${{ matrix.parent }}-${{ matrix.kind }}
          path: /tmp/result
          retention-days: 14

  aggregate:
    if: ${{ github.head_ref == 'tmp/picker9-mix5453-trigger' }}
    needs: verdict
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fast-*
          path: /tmp/results
      - name: Aggregate
        run: |
          python - <<'PY' | tee /tmp/fast-summary.txt
          import json,glob
          for parent in ('v75','final'):
            print(parent)
            for kind in ('random','defense-candidate','defense-parent'):
              p=glob.glob(f'/tmp/results/fast-{parent}-{kind}/**/summary.json',recursive=True)[0]
              s=json.load(open(p)); n=s['W']+s['D']+s['L']; score=(s['W']+.5*s['D'])/n
              print(f'  {kind}: {s["W"]}/{s["D"]}/{s["L"]} score={score:.4f} errors={s["errors"]} illegal={s["illegal_actions"]}')
          PY
          mkdir -p /tmp/summary && cp /tmp/fast-summary.txt /tmp/summary/
      - uses: actions/upload-artifact@v4
        with:
          name: picker9-mix5453-fast-summary
          path: /tmp/summary
          retention-days: 14
